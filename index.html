  /* ================================================================
     RENDER: HORARIO & ENFOQUE PERSONAL
     ================================================================ */
  function renderHorario(mem, current) {
    let h = '';
    const todayStr = localDateStr(new Date());
    const dates = getWeekDates(mem.currentWeekStart);
    const ws = getWeekState();
    const sch = getSchedule();
    const cats = getMemberCategories();

    if (!sch) return '<div class="hs-empty">No hay horario configurado. Ve al Editor para crear uno.</div>';

    if (current && cats[current.block[3]]) {
      h += '<div class="hs-banner">⚡ Actividad en curso de '+esc(mem.name)+': <strong>'+esc(current.block[2])+'</strong> ('+cats[current.block[3]].n+')</div>';
    }

    // Week Nav & View Switch
    const label = fmtShort(dates[0]) + ' – ' + fmtFull(dates[6]);
    h += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;">';
    h += '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">';
    h += '<button class="hs-btn sm" id="week-prev">◀</button>';
    h += '<span style="font-family:var(--mono);font-size:13px;font-weight:700;">'+esc(label)+'</span>';
    h += '<button class="hs-btn sm" id="week-next">▶</button>';
    h += '<button class="hs-btn sm primary" id="week-today">Esta Semana</button>';
    h += '<button class="hs-btn sm" id="print-schedule-btn" style="background:var(--accent-soft);color:var(--user-color, var(--accent));">🖨️ Imprimir Horario A4</button>';
    h += '</div>';

    h += '<div class="hs-view-switch">';
    h += '<button class="hs-view-switch-btn'+(view.scheduleMode==='week'?' active':'')+'" id="switch-view-week">📅 Vista Semanal</button>';
    h += '<button class="hs-view-switch-btn'+(view.scheduleMode==='day'?' active':'')+'" id="switch-view-day">📱 Vista Diaria</button>';
    h += '</div>';
    h += '</div>';

    if (view.scheduleMode === 'day') {
      // Vista Diaria para Móviles
      const selDay = view.activeDay || 'LUNES';
      h += '<div class="hs-dayview-tabs">';
      ORDER.forEach((d, i) => {
        const isToday = localDateStr(dates[i]) === todayStr;
        const isSel = selDay === d;
        h += '<button class="hs-dayview-tab'+(isSel?' active':'')+'" data-activeday="'+d+'">';
        h += '<span>'+LABELS[d]+' '+dates[i].getDate()+'</span>';
        h += '<span style="font-size:9.5px;opacity:0.8;margin-top:2px;">'+pctDay(d)+'%</span>';
        h += '</button>';
      });
      h += '</div>';

      const dayBlocks = (sch.days[selDay] || []);
      if (!dayBlocks.length) {
        h += '<div class="hs-card" style="text-align:center;padding:28px 16px;color:var(--text-3);font-size:13px;">No hay bloques programados para '+LABELS[selDay]+'. Puedes agregarlos en la pestaña <strong>✏️ Editor</strong>.</div>';
      } else {
        h += '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px;">';
        dayBlocks.forEach((b, i) => {
          const key = selDay + '-' + i;
          const isDone = !!ws.done[key];
          const isNow = current && current.day === selDay && current.idx === i;
          const catInfo = cats[b[3]] || { c: '#7c6cff', n: b[3] };
          h += '<div class="hs-dayview-card'+(isDone?' done':'')+(isNow?' now':'')+'" style="--cat:'+catInfo.c+'" data-key="'+key+'">';
          h += '<div style="display:flex;align-items:center;gap:12px;flex:1;">';
          h += '<span style="font-size:16px;">'+(isDone?'✅':'⬜')+'</span>';
          h += '<div><span class="hs-dayview-time">'+b[0]+' – '+b[1]+'</span>';
          h += '<div class="hs-dayview-title">'+esc(b[2])+'</div></div>';
          h += '</div>';
          h += '<div style="display:flex;align-items:center;gap:6px;">';
          h += '<span class="hs-dayview-cat">'+esc(catInfo.n)+'</span>';
          h += '<button class="quick-edit-block" data-d="'+selDay+'" data-i="'+i+'" style="border:none;background:var(--bg-surface);color:var(--text-2);border-radius:4px;padding:3px 7px;cursor:pointer;font-size:11.5px;" title="Editar actividad">✏️</button>';
          h += '</div>';
          h += '</div>';
        });
        h += '</div>';
        h += '<p class="hs-hint">💡 Toca cualquier bloque para marcarlo como completado.</p>';
      }
    } else {
      // Vista Semanal (Tabla Completa con Línea de Tiempo NOW)
      const dayMaps = {}, covered = {};
      ORDER.forEach(d => { dayMaps[d] = buildDayMap(d); covered[d] = {}; });
      const now = new Date();
      const currentMins = now.getHours() * 60 + now.getMinutes();

      h += '<div class="hs-wrap"><table class="hs-table"><thead><tr><th></th>';
      ORDER.forEach((d, i) => {
        const isToday = localDateStr(dates[i]) === todayStr;
        h += '<th'+(isToday?' class="today"':'')+'>' + LABELS[d] + ' ' + dates[i].getDate() + '<span class="pct">'+pctDay(d)+'%</span></th>';
      });
      h += '</tr></thead><tbody>';

      for (let s = 0; s < N_SLOTS; s++) {
        const mins = GRID_START + s*SLOT;
        h += '<tr><td class="hs-timecell">'+(mins%60===0?labelHM(mins):'')+'</td>';
        ORDER.forEach((d, di) => {
          if (covered[d][s]) return;
          const entry = dayMaps[d][s];
          const isToday = localDateStr(dates[di]) === todayStr;
          const isNowSlot = isToday && currentMins >= mins && currentMins < mins + SLOT;
          const colCls = isToday ? ' today-col' : '';
          const nowLineHtml = isNowSlot ? '<div class="now-indicator-line"><span class="now-indicator-badge">🔴 '+labelHM(currentMins)+'</span></div>' : '';

          if (entry) {
            for (let k=0;k<entry.span;k++) covered[d][s+k]=true;
            const key = d+'-'+entry.idx, b = entry.block;
            const isDone = !!ws.done[key], isNow = current && current.day===d && current.idx===entry.idx;
            const catInfo = cats[b[3]] || { c: '#7c6cff', n: b[3] };
            let cls = 'hs-block'+(isDone?' done':'')+(isNow?' now':'');
            h += '<td class="hs-daycell'+colCls+'" rowspan="'+entry.span+'" style="height:'+(entry.span*15)+'px;position:relative;">';
            h += nowLineHtml;
            h += '<div class="'+cls+'" style="--cat:'+catInfo.c+'" data-key="'+key+'">';
            h += '<span class="tm">'+b[0]+'–'+b[1]+'</span><span class="lbl">'+esc(b[2])+'</span></div></td>';
          } else {
            h += '<td class="hs-daycell'+colCls+'" style="height:15px;position:relative;">'+nowLineHtml+'</td>';
          }
        });
        h += '</tr>';
      }
      h += '</tbody></table></div>';
      h += '<p class="hs-hint">💡 Clic en un bloque para marcarlo como completado · La línea roja marca la hora actual en vivo.</p>';
    }

    // Grid: Configurable Pomodoro + Daily Priorities
    h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:20px;">';
    
    // Configurable Focus Timer
    const isB = pomo.mode==='Descanso';
    const cfg = state.pomoConfig || { focusMins: 25, breakMins: 5 };

    h += '<div class="hs-card">';
    h += '<div class="hs-card-header">';
    h += '<span class="hs-section-title">⏱️ Temporizador de Enfoque</span>';
    h += '<div class="pomo-time-presets">';
    [15, 25, 45, 60].forEach(m => {
      h += '<button class="pomo-preset-btn'+(cfg.focusMins===m?' active':'')+'" data-setmins="'+m+'">'+m+' min</button>';
    });
    h += '</div></div>';

    h += '<div class="hs-pomo-wrap">';
    h += '<div class="hs-pomo-ring-wrap"><svg class="hs-pomo-ring" viewBox="0 0 200 200">';
    h += '<circle class="hs-pomo-ring-bg" cx="100" cy="100" r="88"/>';
    h += '<circle class="hs-pomo-ring-fill'+(isB?' on-break':'')+'" id="pomo-ring" cx="100" cy="100" r="88"/>';
    h += '</svg><div class="hs-pomo-center">';
    h += '<span class="hs-pomo-mode'+(isB?' break-mode':'')+'" id="pomo-mode">'+pomo.mode+'</span>';
    h += '<span class="hs-pomo-time" id="pomo-time">25:00</span></div></div>';

    // Custom time input row
    h += '<div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);">';
    h += '<span>Enfoque:</span><input type="number" id="custom-focus-mins" min="1" max="180" value="'+cfg.focusMins+'" style="width:48px;padding:3px 6px;background:var(--bg-input);border:1px solid var(--border);color:var(--text-1);border-radius:4px;font-family:var(--mono);"><span>min</span>';
    h += '<span style="margin-left:8px;">Descanso:</span><input type="number" id="custom-break-mins" min="1" max="60" value="'+cfg.breakMins+'" style="width:48px;padding:3px 6px;background:var(--bg-input);border:1px solid var(--border);color:var(--text-1);border-radius:4px;font-family:var(--mono);"><span>min</span>';
    h += '<button class="hs-btn sm" id="apply-pomo-config">Aplicar</button>';
    h += '</div>';

    h += '<div style="display:flex;gap:10px;margin-top:6px;">';
    h += '<button class="hs-btn '+(pomo.running?'danger':'primary')+'" id="pomo-start">'+(pomo.running?'Pausar':'Iniciar')+'</button>';
    h += '<button class="hs-btn" id="pomo-reset">Reiniciar</button>';
    h += '</div>';
    h += '<div style="font-size:12px;color:var(--text-2);" id="pomo-count">🍅 Pomodoros completados hoy: '+(mem.pomoCount||0)+'</div>';
    h += '</div></div>';

    // Daily priorities
    h += '<div class="hs-card">';
    h += '<div class="hs-card-header"><span class="hs-section-title">📋 Prioridades del Día</span></div>';
    h += '<div class="hs-todo-list">';
    (mem.priorities||[]).forEach((p, idx) => {
      h += '<div class="hs-todo-item'+(p.done?' done':'')+'">';
      h += '<input type="checkbox" class="todo-check" data-idx="'+idx+'" '+(p.done?'checked':'')+'>';
      h += '<span class="hs-todo-text">'+esc(p.text)+'</span>';
      h += '<button class="hs-todo-del" data-idx="'+idx+'">✕</button>';
      h += '</div>';
    });
    h += '</div>';
    h += '<div style="display:flex;gap:8px;margin-top:12px;">';
    h += '<input type="text" id="new-todo-text" placeholder="Nueva prioridad..." style="flex:1;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 10px;color:var(--text-1);font-size:12px;">';
    h += '<button class="hs-btn primary sm" id="add-todo-btn">+ Agregar</button>';
    h += '</div>';
    h += '</div>';

    h += '</div>';

    // Weekly Habits / Metas Tracker Card
    h += '<div class="hs-card" style="margin-top:16px;">';
    h += '<div class="hs-card-header">';
    h += '<div><span class="hs-section-title">🎯 Metas & Hábitos Semanales — ' + esc(mem.name) + '</span><div style="font-size:11.5px;color:var(--text-3);margin-top:2px;">Constancia semanal y objetivos de enfoque</div></div>';
    h += '<button class="hs-btn sm primary" id="add-habit-btn">+ Nueva Meta</button>';
    h += '</div>';

    h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:8px;">';
    (mem.habits || []).forEach((hb, hidx) => {
      h += '<div style="background:var(--bg-elevated);border:1px solid var(--border);border-left:4px solid var(--user-color, var(--accent));border-radius:var(--radius-sm);padding:12px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;">';
      h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:6px;">';
      h += '<span style="font-weight:600;font-size:13px;color:var(--text-1);">' + esc(hb.text) + '</span>';
      h += '<button class="habit-del" data-i="' + hidx + '" style="border:none;background:none;color:#ff6666;cursor:pointer;">✕</button>';
      h += '</div>';
      h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;">';
      h += '<span style="font-size:11px;color:var(--text-2);font-family:var(--mono);">Meta: ' + esc(hb.target) + '</span>';
      h += '<div style="display:flex;align-items:center;gap:6px;">';
      h += '<button class="hs-btn sm habit-dec" data-i="' + hidx + '" style="padding:2px 7px;">-</button>';
      h += '<strong style="font-family:var(--mono);font-size:13px;color:var(--user-color, var(--accent));">' + (hb.count || 0) + '</strong>';
      h += '<button class="hs-btn sm habit-inc" data-i="' + hidx + '" style="padding:2px 7px;">+1</button>';
      h += '</div></div>';
      h += '</div>';
    });
    h += '</div></div>';

    // WIDGET: CENTRO DE ALARMAS & NOTIFICACIONES EN CELULAR (ADAPTADO)
    const isSchoolKid = (mem.id === 'franco' || mem.id === 'benjamin');
    h += '<div class="hs-card" style="margin-top:16px;border-top:3px solid var(--user-color, var(--accent));">';
    h += '<div class="hs-card-header" style="flex-wrap:wrap;gap:8px;">';
    h += '<div>';
    h += '<div style="display:flex;align-items:center;gap:8px;">';
    h += '<span style="font-size:18px;">🔔</span>';
    h += '<span class="hs-section-title">Centro de Alarmas & Recordatorios — ' + esc(mem.name) + '</span>';
    h += '<span style="font-size:10px;font-family:var(--mono);font-weight:700;padding:2px 7px;border-radius:10px;background:rgba(16,185,129,0.15);color:#10b981;">📱 Modo Celular (Silencioso en PC)</span>';
    h += '</div>';
    h += '<p style="font-size:12px;color:var(--text-2);margin-top:2px;">Configurado para sonar solo en tu teléfono sin interrumpir en la PC de Geanly. '+(isSchoolKid ? '<strong style="color:var(--accent);">🎒 Modo Colegio:</strong> Las alarmas se omiten en horario escolar (antes de las 15:00).' : '')+'</p>';
    h += '</div>';
    h += '<div style="display:flex;gap:6px;flex-wrap:wrap;">';
    h += '<button class="hs-btn sm" id="test-alarm-sound-btn" style="background:rgba(59,130,246,0.15);color:#3b82f6;border:1px solid #3b82f6;font-weight:700;">🔔 1. Probar Sonido de Alarma</button>';
    h += '<button class="hs-btn primary sm" id="export-ics-alarm-btn">📲 2. Sincronizar Alarma a mi Celular (.ics)</button>';
    h += '</div>';
    h += '</div>';

    // Tarea de prueba interactiva
    h += '<div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">';
    h += '<div style="display:flex;align-items:center;gap:10px;">';
    h += '<span style="font-size:22px;">⏰</span>';
    h += '<div>';
    h += '<strong style="font-size:13px;color:var(--text-1);">🔔 Tarea de Prueba: Alarma de Inicio de Rutina</strong>';
    h += '<div style="font-size:11.5px;color:var(--text-3);margin-top:2px;">Suena el chime armónico de recordatorio (aviso 10 min antes en teléfono)</div>';
    h += '</div>';
    h += '</div>';
    h += '<button class="hs-btn sm" id="trigger-test-task-btn" style="background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;font-weight:700;padding:6px 12px;cursor:pointer;">▶️ Ejecutar Alarma de Prueba Ahora</button>';
    h += '</div>';
    h += '</div>';

    return h;

  /* ================================================================

  function renderMemberExams(mem) {
    const exams = mem.exams || [];
    const today = new Date();
    today.setHours(0,0,0,0);

    let h = '<div class="hs-card" style="border-top:4px solid var(--user-color, #3b82f6);">';

    h += '<span style="background:var(--accent-soft);color:var(--user-color, var(--accent));font-size:11px;font-family:var(--mono);padding:2px 8px;border-radius:10px;font-weight:700;">' + exams.length + ' evaluaciones</span>';
    h += '</div>';
    h += '<p style="font-size:12px;color:var(--text-2);margin-top:2px;">Control de fechas clave, ponderaciones, cuentas regresivas y temas de estudio</p>';
    h += '</div>';
    h += '<button class="hs-btn primary sm" id="add-exam-btn">+ Agregar Examen / Entrega</button>';
    h += '</div>';

    if (!exams.length) {
      h += '<div style="padding:32px 16px;text-align:center;color:var(--text-3);background:var(--bg-elevated);border-radius:var(--radius-sm);border:1px dashed var(--border);">';
      h += '<p style="font-size:13.5px;margin-bottom:8px;">No tienes exámenes ni entregas programadas.</p>';
      h += '<button class="hs-btn primary sm" id="add-exam-btn-empty">+ Registrar Primera Evaluación</button>';
      h += '</div>';
    } else {
      h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;margin-top:12px;">';
      
      const sorted = [...exams].sort((a,b) => new Date(a.date) - new Date(b.date));

      sorted.forEach((ex) => {
        const exDate = new Date(ex.date + 'T00:00:00');
        const diffTime = exDate - today;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        
        let badgeBg = 'rgba(59,130,246,0.15)', badgeColor = '#3b82f6', badgeText = `En ${diffDays} días`;
        if (ex.done) {
          badgeBg = 'rgba(16,185,129,0.15)'; badgeColor = '#10b981'; badgeText = '✓ Rendido / Entregado';
        } else if (diffDays < 0) {
          badgeBg = 'rgba(100,116,139,0.15)'; badgeColor = '#64748b'; badgeText = 'Finalizado';
        } else if (diffDays === 0) {
          badgeBg = 'rgba(239,68,68,0.2)'; badgeColor = '#ef4444'; badgeText = '🚨 ¡ES HOY!';
        } else if (diffDays <= 3) {
          badgeBg = 'rgba(245,158,11,0.2)'; badgeColor = '#f59e0b'; badgeText = `⚠️ Faltan ${diffDays} días`;
        }

        h += '<div style="background:var(--bg-elevated);border:1px solid var(--border);border-left:4px solid '+(ex.done?'#10b981':diffDays<=3?'#ef4444':'var(--user-color, var(--accent))')+';border-radius:var(--radius-sm);padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;">';
        
        h += '<div>';
        h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:6px;">';
        h += '<span style="font-size:10.5px;font-family:var(--mono);font-weight:700;padding:2px 7px;border-radius:10px;background:'+badgeBg+';color:'+badgeColor+';">'+badgeText+'</span>';
        h += '<span style="font-size:11px;font-family:var(--mono);color:var(--text-3);font-weight:600;">Peso: '+(ex.weight||'—')+'</span>';
        h += '</div>';

        h += '<strong style="font-size:14px;color:var(--text-1);display:block;margin-bottom:2px;">'+esc(ex.course)+'</strong>';
        h += '<span style="font-size:12px;color:var(--user-color, var(--accent));font-weight:600;">'+esc(ex.type)+'</span>';
        
        h += '<div style="display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-2);margin-top:8px;font-family:var(--mono);">';
        h += '<span>📅 '+esc(ex.date)+'</span>';
        if (ex.time) h += '<span>⏰ '+esc(ex.time)+'</span>';
        h += '</div>';

        if (ex.notes) {
          h += '<div style="font-size:11.5px;color:var(--text-3);margin-top:8px;background:var(--bg-surface);padding:6px 8px;border-radius:4px;border:1px solid var(--border);line-height:1.4;">📖 '+esc(ex.notes)+'</div>';
        }
        h += '</div>';

        // Action footer
        h += '<div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:8px;margin-top:4px;">';
        h += '<label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:11.5px;color:var(--text-2);user-select:none;">';
        h += '<input type="checkbox" class="exam-toggle-done" data-id="'+ex.id+'" '+(ex.done?'checked':'')+'> <span>'+(ex.done?'Rendido':'Marcar Rendido')+'</span>';
        h += '</label>';
        h += '<div style="display:flex;gap:4px;">';
        h += '<button class="exam-edit-btn hs-btn sm" data-id="'+ex.id+'" style="padding:2px 6px;font-size:10.5px;">✏️</button>';
        h += '<button class="exam-del-btn hs-btn sm" data-id="'+ex.id+'" style="padding:2px 6px;font-size:10.5px;color:#ff6666;">✕</button>';
        h += '</div>';
        h += '</div>';

        h += '</div>';
      });

      h += '</div>';
    }

    h += '</div>';
    return h;
  }

  /* ================================================================
     RENDER: FINANZAS DEL HOGAR - EN EL INICIO
     ================================================================ */
  function renderFinanzas() {
    const fTab = state.finanzasSubView || 'presupuesto';
    const items = (state.household && state.household.budgetItems) || [];
    const daily = (state.household && state.household.dailyExpenses) || [];
    const goals = (state.household && state.household.savingGoals) || [];
    const fNotes = (state.household && state.household.familyNotes) || [];
    const simulador = (state.household && state.household.simulador) || { name: '💻 Laptop Renders 3D & Civil (Geanly)', cost: 3200, dedicationPct: 50 };

    // Financial Computations
    let totalIngresos = 0, totalGastosFijos = 0, totalServiciosPendientes = 0, countServiciosPendientes = 0;
    let costNecesidades = 0, costEducacion = 0;

    // Per Member Calculations
    const memberStats = {
      Willman: { income: 0, expense: 0, items: [] },
      Karen: { income: 0, expense: 0, items: [] },
      Geanly: { income: 0, expense: 0, items: [] },
      Compartido: { income: 0, expense: 0, items: [] }
    };

    items.forEach(b => {
      const amt = +b.amount || 0;
      const pKey = memberStats[b.payer] ? b.payer : 'Compartido';
      if (b.type === 'ingreso') {
        totalIngresos += amt;
        memberStats[pKey].income += amt;
      } else {
        totalGastosFijos += amt;
        memberStats[pKey].expense += amt;
        if (b.cat === 'servicios' && b.status === 'Pendiente') {
          totalServiciosPendientes += amt;
          countServiciosPendientes++;
        }
        if (['servicios', 'alimentacion', 'transporte', 'hogar', 'salud'].includes(b.cat)) {
          costNecesidades += amt;
        } else {
          costEducacion += amt;
        }
      }
      memberStats[pKey].items.push(b);
    });

    let totalGastosDiarios = 0;
    daily.forEach(d => {
      const amt = +d.amount || 0;
      totalGastosDiarios += amt;
      const pKey = memberStats[d.payer] ? d.payer : 'Compartido';
      memberStats[pKey].expense += amt;
      if (['servicios', 'alimentacion', 'transporte', 'hogar', 'salud'].includes(d.cat)) {
        costNecesidades += amt;
      } else {
        costEducacion += amt;
      }
    });

    let totalAhorrado = 0, totalMetaAhorro = 0;
    goals.forEach(g => {
      totalAhorrado += (+g.current || 0);
      totalMetaAhorro += (+g.target || 0);
    });

    const totalGastosReal = totalGastosFijos + totalGastosDiarios;
    const balanceNeto = totalIngresos - totalGastosReal;

    // 50/30/20 Distribution
    const baseIngreso = Math.max(totalIngresos, 1);
    const pctNec = Math.min(100, Math.round((costNecesidades / baseIngreso) * 100));
    const pctEdu = Math.min(100, Math.round((costEducacion / baseIngreso) * 100));
    const pctAhorro = Math.min(100, Math.round((balanceNeto > 0 ? (balanceNeto / baseIngreso) * 100 : 0)));

    let saludLabel = '🟢 Salud Financiera Excelente';
    let saludColor = '#10b981';
    if (balanceNeto < 0) {
      saludLabel = '🔴 Alerta de Sobregasto';
      saludColor = '#ef4444';
    } else if (pctNec > 65) {
      saludLabel = '🟡 Presupuesto Ajustado';
      saludColor = '#f59e0b';
    }

    const catBadges = {
      servicios: { label: '⚡ Servicios', color: '#f59e0b', bg: 'rgba(245,158,11,0.12)' },
      alimentacion: { label: '🛒 Alimentación', color: '#10b981', bg: 'rgba(16,185,129,0.12)' },
      educacion: { label: '🎓 Educación', color: '#3b82f6', bg: 'rgba(59,130,246,0.12)' },
      salud: { label: '🏥 Salud', color: '#ec4899', bg: 'rgba(236,72,153,0.12)' },
      transporte: { label: '🚗 Transporte', color: '#8b5cf6', bg: 'rgba(139,92,246,0.12)' },
      hogar: { label: '🏠 Mantenimiento', color: '#06b6d4', bg: 'rgba(6,182,212,0.12)' },
      negocio: { label: '💼 Negocio/Ingreso', color: '#10b981', bg: 'rgba(16,185,129,0.15)' },
      otros: { label: '📦 Otros', color: '#64748b', bg: 'rgba(100,116,139,0.12)' }
    };

    let h = '<div class="hs-card" style="border-top:4px solid #10b981;">';
    
    // Header
    h += '<div class="hs-card-header" style="flex-wrap:wrap;gap:12px;">';
    h += '<div>';
    h += '<div style="display:flex;align-items:center;gap:8px;">';
    h += '<h2 style="font-size:22px;font-weight:800;letter-spacing:-0.02em;">🏠 FINANZAS & ECONOMÍA FAMILIAR GFB</h2>';
    h += '<span style="background:rgba(16,185,129,0.15);color:#10b981;font-size:11px;font-family:var(--mono);padding:3px 10px;border-radius:12px;font-weight:700;">CENTRO DE CONTROL FINANCIERO</span>';
    h += '</div>';
    h += '<p style="font-size:12.5px;color:var(--text-2);margin-top:3px;">Control en vivo de ingresos compartidos, radar de vencimientos, gastos diarios, cuentas individuales y metas</p>';
    h += '</div>';
    h += '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">';
    h += '<button class="hs-btn primary sm" id="add-daily-expense-btn">⚡ + Gasto Rápido</button>';
    h += '<button class="hs-btn sm" id="add-budget-item">➕ + Movimiento Fijo</button>';
    h += '<button class="hs-btn sm" id="transfer-sinergia-btn">💼 + Ganancia Sinergia</button>';
    h += '<button class="hs-btn sm" id="add-saving-goal-btn">🎯 + Meta Ahorro</button>';
    h += '<button class="hs-btn sm" id="export-finanzas-csv-btn">📥 Exportar Excel</button>';
    h += '</div>';
    h += '</div>';

    // Sub Navigation Tabs (6 modules)
    h += '<div style="display:flex;gap:6px;border-bottom:1px solid var(--border);margin-top:16px;overflow-x:auto;padding-bottom:2px;">';
    h += '<button class="top-nav-btn'+(fTab==='presupuesto'?' active':'')+'" id="fin-tab-presupuesto">📊 1. Presupuesto & Gastos Diarios ('+items.length+')</button>';
    h += '<button class="top-nav-btn'+(fTab==='radar'?' active':'')+'" id="fin-tab-radar">🚨 2. Radar de Vencimientos</button>';
    h += '<button class="top-nav-btn'+(fTab==='integrantes'?' active':'')+'" id="fin-tab-integrantes">👥 3. Cuentas por Integrante</button>';
    h += '<button class="top-nav-btn'+(fTab==='metas'?' active':'')+'" id="fin-tab-metas">🎯 4. Metas de Ahorro ('+goals.length+')</button>';
    h += '<button class="top-nav-btn'+(fTab==='simulador'?' active':'')+'" id="fin-tab-simulador">🔮 5. Simulador de Compras</button>';
    h += '<button class="top-nav-btn'+(fTab==='pizarra'?' active':'')+'" id="fin-tab-pizarra">📌 6. Pizarra Familiar ('+fNotes.length+')</button>';
    h += '</div>';

    // 4 Key Stat KPI Cards
    h += '<div class="hs-stats" style="margin-top:16px;">';
    h += '<div class="hs-stat" style="--cat:#10b981"><div class="hs-stat-h" style="color:#10b981;">S/. '+totalIngresos.toFixed(2)+'</div><div class="hs-stat-l">Ingresos Totales del Mes</div></div>';
    h += '<div class="hs-stat" style="--cat:#ff6b4a"><div class="hs-stat-h" style="color:#ff6b4a;">S/. '+totalGastosReal.toFixed(2)+'</div><div class="hs-stat-l">Gastos Totales (Fijos: '+totalGastosFijos.toFixed(0)+' + Diarios: '+totalGastosDiarios.toFixed(0)+')</div></div>';
    h += '<div class="hs-stat" style="--cat:'+(balanceNeto>=0?'#3b82f6':'#ef4444')+'"><div class="hs-stat-h" style="color:'+(balanceNeto>=0?'#3b82f6':'#ef4444')+';">S/. '+balanceNeto.toFixed(2)+'</div><div class="hs-stat-l">Balance Neto '+(balanceNeto>=0?'(Superávit)':'(Déficit)')+'</div></div>';
    h += '<div class="hs-stat" style="--cat:#8b5cf6"><div class="hs-stat-h" style="color:#8b5cf6;">S/. '+totalAhorrado.toFixed(2)+'</div><div class="hs-stat-l">Ahorro Acumulado en Fondos</div></div>';
    h += '</div>';

    // WIDGET: Salud Financiera & Regla 50/30/20
    h += '<div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-top:14px;">';
    h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px;">';
    h += '<div><span style="font-size:12px;font-weight:700;font-family:var(--mono);text-transform:uppercase;color:var(--text-1);">📈 Distribución Financiera Familiar (Regla 50/30/20)</span>';
    h += '<span style="font-size:11px;color:var(--text-3);margin-left:8px;">Basada en ingresos de S/. '+totalIngresos.toFixed(2)+'</span></div>';
    h += '<span style="font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;background:'+saludColor+'20;color:'+saludColor+';font-family:var(--mono);">'+saludLabel+'</span>';
    h += '</div>';

    h += '<div style="height:14px;background:var(--bg-surface);border-radius:8px;overflow:hidden;border:1px solid var(--border);display:flex;margin-bottom:8px;">';
    h += '<div style="width:'+pctNec+'%;background:#10b981;title:Necesidades '+pctNec+'%;transition:width 0.3s ease;"></div>';
    h += '<div style="width:'+pctEdu+'%;background:#3b82f6;title:Educación/Desarrollo '+pctEdu+'%;transition:width 0.3s ease;"></div>';
    h += '<div style="width:'+pctAhorro+'%;background:#8b5cf6;title:Ahorro/Margen '+pctAhorro+'%;transition:width 0.3s ease;"></div>';
    h += '</div>';

    h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;font-size:11px;color:var(--text-2);">';
    h += '<div style="display:flex;align-items:center;gap:6px;"><span style="width:10px;height:10px;background:#10b981;border-radius:50%;"></span><strong>50% Necesidades:</strong> S/. '+costNecesidades.toFixed(2)+' ('+pctNec+'%)</div>';
    h += '<div style="display:flex;align-items:center;gap:6px;"><span style="width:10px;height:10px;background:#3b82f6;border-radius:50%;"></span><strong>30% Educación/Hogar:</strong> S/. '+costEducacion.toFixed(2)+' ('+pctEdu+'%)</div>';
    h += '<div style="display:flex;align-items:center;gap:6px;"><span style="width:10px;height:10px;background:#8b5cf6;border-radius:50%;"></span><strong>20% Ahorro/Superávit:</strong> S/. '+(Math.max(0, balanceNeto)).toFixed(2)+' ('+pctAhorro+'%)</div>';
    h += '</div>';
    h += '</div>';

    // FEATURE 3.B: FONDO DE RESERVA & EMERGENCIA FAMILIAR INTELIGENTE
    const fund = state.household.emergencyFund || { current: 3500, targetMonths: 3, monthlyEssential: 2100 };
    const monthlyEssential = Math.max(1200, costNecesidades + (totalGastosFijos * 0.6));
    const targetFundAmount = monthlyEssential * (fund.targetMonths || 3);
    const coverageMonths = (cleanNum(fund.current, 0) / monthlyEssential).toFixed(1);
    const fundPct = Math.min(100, Math.round((cleanNum(fund.current, 0) / targetFundAmount) * 100));

    let fundStatusColor = '#10b981', fundStatusLabel = '🛡️ Blindaje Óptimo';

    Object.keys(totals).forEach(k => { totalPlannedMins += totals[k]; });

      else {

  /* ================================================================
     POMODORO TIMER LOGIC
     ================================================================ */
  function pomoTick() {
    pomo.remaining--;
    const mem = getActiveMember();
    const cfg = state.pomoConfig || { focusMins: 25, breakMins: 5 };

    if (pomo.remaining <= 0) {
      if (pomo.mode === 'Enfoque') {
        if (mem) { mem.pomoCount = (mem.pomoCount||0) + 1; }
        pomo.mode = 'Descanso';
        pomo.remaining = cfg.breakMins * 60;
        pomo.total = cfg.breakMins * 60;
        state.pomoMode = 'Descanso';
        state.pomoEndTime = Date.now() + (pomo.remaining * 1000);
        saveState();
        playBeep();
        showToast('🍅 ¡Enfoque completado! Tómate un merecido descanso.');
        if ('Notification' in window && Notification.permission === 'granted') {
          new Notification('🍅 ¡Pomodoro Completado! — Familia GFB', {
            body: 'Has cumplido tu bloque de enfoque. Tómate un descanso de ' + cfg.breakMins + ' minutos.',
            icon: 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'
          });
        }
      } else {
        pomo.mode = 'Enfoque';
        pomo.remaining = cfg.focusMins * 60;
        pomo.total = cfg.focusMins * 60;
        state.pomoMode = 'Enfoque';
        state.pomoEndTime = Date.now() + (pomo.remaining * 1000);
        saveState();
        playBeep();
        showToast('🎯 ¡Descanso finalizado! Hora de enfocarse.', 'info');
        if ('Notification' in window && Notification.permission === 'granted') {
          new Notification('🎯 ¡A enfocarse! — Familia GFB', {
            body: 'Inicia tu nuevo ciclo de productividad de ' + cfg.focusMins + ' minutos.',
            icon: 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'
          });
        }
      }
    }
    updatePomoUI();
  }

  function pomoToggle() {
    if (pomo.running) {
      clearInterval(pomo.interval);
      pomo.running = false;
      state.pomoRunning = false;
      state.pomoRemainingSecs = pomo.remaining;
      saveState();
    } else {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
      pomo.running = true;
      state.pomoRunning = true;
      state.pomoEndTime = Date.now() + (pomo.remaining * 1000);
      state.pomoMode = pomo.mode;
      delete state.pomoRemainingSecs;
      saveState();
      pomo.interval = setInterval(pomoTick, 1000);
    }
    const btn = document.getElementById('pomo-start');
    if (btn) {
      btn.textContent = pomo.running ? 'Pausar' : 'Iniciar';
      btn.className = 'hs-btn ' + (pomo.running ? 'danger' : 'primary');
    }
    updatePomoUI();
  }

  function pomoReset() {
    clearInterval(pomo.interval);
    pomo.running = false;
    state.pomoRunning = false;
    delete state.pomoEndTime;
    delete state.pomoRemainingSecs;
    pomo.mode = 'Enfoque';
    state.pomoMode = 'Enfoque';
    const cfg = state.pomoConfig || { focusMins: 25, breakMins: 5 };
    pomo.remaining = cfg.focusMins * 60;
    pomo.total = cfg.focusMins * 60;
    saveState();
    const btn = document.getElementById('pomo-start');
    if (btn) {
      btn.textContent = 'Iniciar';
      btn.className = 'hs-btn primary';
    }
    updatePomoUI();
  }

  function updatePomoUI() {
    const t = document.getElementById('pomo-time'), m = document.getElementById('pomo-mode'), r = document.getElementById('pomo-ring'), c = document.getElementById('pomo-count');
    const mem = getActiveMember();
    if (!t) return;
    const mm = Math.floor(pomo.remaining/60), ss = pomo.remaining%60;
    t.textContent = (mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;
    if (m) m.textContent = pomo.mode;
    if (r) {
      r.style.strokeDashoffset = POMO_CIRC * (1 - pomo.remaining/pomo.total);
      r.classList.toggle('on-break', pomo.mode==='Descanso');
    }
    if (m) m.classList.toggle('break-mode', pomo.mode==='Descanso');
    if (c && mem) c.textContent = '🍅 Pomodoros completados hoy: ' + (mem.pomoCount||0);
  }

      let rowCells = '';
      ORDER.forEach((d) => {
        const blocks = sch.days[d] || [];
        const match = blocks.find(b => {
          const m0 = toMin(b[0]), m1 = toMin(b[1]);
          return mins >= m0 && mins < m1;
        });
        if (match) {
          const isStart = mins === toMin(match[0]);
          if (isStart) {
            const span = Math.max(1, Math.round((toMin(match[1]) - toMin(match[0])) / SLOT));
            const cat = cats[match[3]] || { c: '#7c6cff', n: match[3] };
            rowCells += `<td rowspan="${span}" style="background:#f8fafc;border:1px solid #cbd5e1;border-left:4px solid ${cat.c};padding:4px 6px;font-size:11px;vertical-align:top;">

              <div style="font-weight:700;color:#0f172a;margin-top:2px;">${esc(match[2])}</div>
            </td>`;
          }
        } else {
          const isCovered = blocks.some(b => {
            const m0 = toMin(b[0]), m1 = toMin(b[1]);
            return mins > m0 && mins < m1;
          });
          if (!isCovered) {
            rowCells += `<td style="border:1px solid #e2e8f0;height:14px;"></td>`;
          }
        }
      });
      rowsHtml += `<tr><td style="font-family:monospace;font-size:10px;color:#64748b;text-align:right;padding:2px 4px;border:1px solid #e2e8f0;">${timeLbl}</td>${rowCells}</tr>`;

  /* ================================================================
     EVENTS
     ================================================================ */
  function handleClick(e) {
    if (e.target.id==='theme-toggle'||e.target.closest('#theme-toggle')) {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      applyTheme(); saveState(); render(); return;
    }

    // Cerrar menú flotante si está abierto y se hace clic afuera
    if (state.quickNavOpen && !e.target.closest('#quick-nav-toggle') && !e.target.closest('#quick-nav-dropdown')) {
      state.quickNavOpen = false;
      render();
    }

    // Botón Iniciar en Pantalla Splash
    if (e.target.id === 'btn-app-iniciar' || e.target.closest('#btn-app-iniciar')) {
      state.appFlow = 'hub';
      state.quickNavOpen = false;
      saveState(); render(); return;
    }

    // Botón Volver a Splash
    if (e.target.id === 'back-to-splash-btn') {
      state.appFlow = 'splash';
      state.quickNavOpen = false;
      saveState(); render(); return;
    }

    // Clic en tarjeta del Hub de 3 Opciones
    const hubCard = e.target.closest('[data-hub-enter]');
    if (hubCard) {
      state.activeGlobalTab = hubCard.dataset.hubEnter;
      if (state.activeGlobalTab === 'portal' && state.lastActiveMemberId && !state.activeMemberId) {
        state.activeMemberId = state.lastActiveMemberId;
      }
      state.appFlow = 'workspace';
      state.quickNavOpen = false;
      saveState(); render(); return;
    }

    // Toggle Cuadrado de 3 Líneas (Menú Flotante)
    if (e.target.closest('#quick-nav-toggle')) {
      state.quickNavOpen = !state.quickNavOpen;
      render(); return;
    }
    if (e.target.id === 'quick-nav-close') {
      state.quickNavOpen = false;
      render(); return;
    }

    // Salto rápido desde los Cuadraditos del Menú Flotante
    const qJump = e.target.closest('[data-quick-jump]');
    if (qJump) {
      state.activeGlobalTab = qJump.dataset.quickJump;
      if (state.activeGlobalTab === 'portal' && state.lastActiveMemberId && !state.activeMemberId) {
        state.activeMemberId = state.lastActiveMemberId;
      }
      state.appFlow = 'workspace';
      state.quickNavOpen = false;
      saveState(); render();
      const tabNames = { portal: '📅 Horarios de la Familia', sinergia: '🏢 Sinergia Studio', finanzas: '🏠 Finanzas del Hogar' };
      showToast('Cambiado a ' + (tabNames[state.activeGlobalTab] || 'Módulo'));
      return;
    }

    // Botón para ir al Hub de 3 opciones desde el Menú Flotante
    if (e.target.id === 'quick-to-hub-btn') {

          saveState(); render();
          showToast('✓ Proveedor agregado a la agenda');
        }
      });
      return;
    }
    const supEdit = e.target.closest('.sup-edit-btn');
    if (supEdit) {
      const sup = state.sinergiaSuppliers[+supEdit.dataset.i];
      if (sup) {
        showSinergiaModal({
          title: '✏️ Editar Proveedor',
          saveLabel: 'Guardar Cambios',
          fields: [
            { id: 'name', label: 'Nombre del Proveedor:', value: sup.name || '' },
            { id: 'type', label: 'Rubro / Especialidad:', value: sup.type || '' },
            { id: 'contact', label: 'Teléfono / WhatsApp:', value: sup.contact || '' },
            { id: 'note', label: 'Notas / Descuento:', value: sup.note || '' }
          ],
          onSave: (data) => {
            sup.name = data.name || sup.name;
            sup.type = data.type || sup.type;
            sup.contact = data.contact || sup.contact;
            sup.note = data.note || sup.note;
            saveState(); render();
            showToast('✓ Proveedor actualizado');
          }
        });
      }
      return;
    }
    const supDel = e.target.closest('.sup-del');
    if (supDel) {
      if (!confirm('¿Deseas eliminar este proveedor de la agenda?')) return;
      state.sinergiaSuppliers.splice(+supDel.dataset.i, 1);
      saveState(); render(); showToast('Proveedor eliminado', 'warn'); return;
    }



    // Sinergia Calculator: Print / PDF
    if (e.target.id==='print-quote-btn') {
      printQuotePDF();
      return;
    }

    // Sinergia Calculator: Shopping list
    if (e.target.id==='print-shopping-btn') {
      printShoppingList();
      return;
    }

    // Sinergia Calculator: Copy to WhatsApp (Cliente)
    if (e.target.id==='copy-quote-btn') {
      const client = (document.getElementById('calc-client')?.value||'Estimado(a) Cliente').trim();
      const room = document.getElementById('calc-room-type')?.value||'Ambiente de Diseño';
      const tot = document.getElementById('sum-total')?.textContent||'S/. 0';
      const ade = document.getElementById('sum-adelanto')?.textContent||'S/. 0';
      const sal = document.getElementById('sum-saldo')?.textContent||'S/. 0';
      const dias = (document.getElementById('calc-dias-entrega')?.value||'12 a 15 días hábiles').trim();

      const text = `✨ *PROPUESTA DE DISEÑO & MOBILIARIO A MEDIDA*\n` +
                   `🏢 *SINERGIA STUDIO*\n` +
                   `📅 *Fecha:* ${localDateStr(new Date())}\n` +
                   `👤 *Cliente:* ${client}\n` +
                   `🏠 *Proyecto / Espacio:* ${room}\n\n` +
                   `*ESPECIFICACIONES TÉCNICAS & ALCANCE:*` +
                   `\n• Tableros de Melamina 18mm Pelíkano/Masisa antimicrobiana con cantos termoadheridos.` +
                   `\n• Herrajes de alta gama: Bisagras cierre suave (soft-close) y correderas telescópicas pesadas.` +
                   `\n• Cubierta de Cuarzo/Granito pulido con destajes y zócalos protectores.` +
                   `\n• Iluminación arquitectónica LED con perfiles de aluminio y difusor opalino.` +
                   `\n• Modelado 3D en SketchUp y Renders fotorrealistas en alta definición.` +
                   `\n• Traslado, habilitación y armado completo en su domicilio por maestros especialistas.\n\n` +
                   `💰 *PRESUPUESTO TOTAL CERRADO: ${tot}*\n` +
                   `• *Adelanto (50%):* ${ade} (Para inicio de fabricación y reserva de materiales)\n` +
                   `• *Saldo Final (50%):* ${sal} (Contra entrega e instalación conforme)\n` +
                   `• *Tiempo estimado:* ${dias}\n` +
                   `• *Garantía técnica:* 12 meses (1 año) en estructura y herrajes\n\n` +
                   `_Quedamos atentos a cualquier consulta para dar inicio al proyecto._\n` +
                   `✨ *Sinergia Studio — Transformamos tus espacios.*`;

      navigator.clipboard.writeText(text).then(() => {
        showToast('📋 ¡Propuesta formal copiada lista para WhatsApp!');
      }).catch(() => {
        showSinergiaModal({
          title: '📋 Propuesta Formal Sinergia',
          saveLabel: 'Cerrar',
          fields: [
            { id: 'propText', label: 'Copia el texto para WhatsApp:', type: 'textarea', value: text }
          ],
          onSave: () => {}
        });
      });
      return;
    }

    // Sinergia: Load Project into Calculator & Shopping List
    const projLoad = e.target.closest('.proj-load-quote-btn');
    if (projLoad) {
      const p = state.sinergia.projects.find(x => x.id === projLoad.dataset.pid);
      if (p) {
        if (p.cart && p.cart.length) {
          state.sinergiaCart = JSON.parse(JSON.stringify(p.cart));
        }
        state.sinergiaQuoteDraft = {
          client: p.client || '',
          phone: p.phone || '',
          room: p.room || '',
          moFactor: p.moFactor || 1.55,
          disenoPrice: p.disenoPrice || 450,
          adelantoPct: p.adelantoPct || 50,
          dias: p.dias || '12 a 15 días hábiles'
        };
        state.sinergiaView = 'cotizador';
        saveState(); render(); recalcQuote();
        showToast('✓ Cotizador cargado con los datos de ' + p.client);
      }
      return;
    }

    // Sinergia Calculator: Save as Project
    if (e.target.id==='save-quote-as-proj') {
      const client = (document.getElementById('calc-client')?.value||'Nuevo Cliente').trim();
      const phone = (document.getElementById('calc-phone')?.value||'').trim();
      const room = document.getElementById('calc-room-type')?.value||'Ambiente de Diseño';
      const tot = document.getElementById('sum-total')?.textContent||'S/. 0';
      state.sinergia.projects.unshift({
        id: genId(),
        title: room + ' — ' + client,
        client: client,
        phone: phone,
        room: room,
        stage: 'cotizacion',
        budget: tot,
        cart: JSON.parse(JSON.stringify(state.sinergiaCart || [])),
        moFactor: +(document.getElementById('calc-mo-factor')?.value || 1.55),
        disenoPrice: +(document.getElementById('calc-diseno')?.value || 450),
        adelantoPct: +(document.getElementById('calc-adelanto-pct')?.value || 50),
        dias: (document.getElementById('calc-dias-entrega')?.value || '12 a 15 días hábiles').trim(),
        driveUrl: 'https://drive.google.com',
        despieceUrl: 'https://drive.google.com',
        adelantoPaid: false,
        saldoPaid: false
      });
      state.sinergiaView = 'proyectos';
      saveState(); render();
      showToast('🎉 ¡Proyecto guardado en el Pipeline Kanban con su lista de insumos!');
      return;
    }

    if (e.target.id==='backup-json') { exportBackupJSON(); return; }
  }

  function exportMaterialsCSV() {
    const mats = state.sinergiaMaterials || [];
    if (!mats.length) {
      showToast('No hay insumos registrados para exportar', 'warn');
      return;
    }
    const headers = ['Categoría', 'Insumo / Color / Modelo', 'Marca', 'Especificación', 'Unidad', 'Precio (S/.)', 'Proveedor', 'Notas'];
    const rows = mats.map(m => [
      `"${(m.cat||'').replace(/"/g, '""')}"`,
      `"${(m.name||'').replace(/"/g, '""')}"`,
      `"${(m.brand||'').replace(/"/g, '""')}"`,
      `"${(m.spec||'').replace(/"/g, '""')}"`,
      `"${(m.unit||'').replace(/"/g, '""')}"`,
      (+m.price||0).toFixed(2),
      `"${(m.supplier||'').replace(/"/g, '""')}"`,
      `"${(m.notes||'').replace(/"/g, '""')}"`
    ]);

    const csvContent = '\uFEFF' + [headers.join(','), ...rows.map(r => r.join(','))].join('\r\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.setAttribute('href', url);
    link.setAttribute('download', `Tarifario_Sinergia_Studio_${localDateStr(new Date()).replace(/\//g,'-')}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    showToast('📥 Tarifario exportado en formato Excel (.csv)');
  }

  function recalcQuote() {
    const cart = state.sinergiaCart || [];
    const moMethod = document.getElementById('calc-mo-method')?.value || 'factor';
    const moFactor = +(document.getElementById('calc-mo-factor')?.value || 1.55);
    const disenoPrice = +(document.getElementById('calc-diseno')?.value || 450);
    const adelantoPct = +(document.getElementById('calc-adelanto-pct')?.value || 50);

    const fin = calculateSinergiaFinancials(cart, {
      moMethod,
      moFactor,
      disenoPrice,
      adelantoPct
    });

    const sMel = document.getElementById('sum-melamina');
    const sHer = document.getElementById('sum-herrajes');
    const sCz = document.getElementById('sum-cuarzo');
    const sLed = document.getElementById('sum-led');
    const sExtras = document.getElementById('sum-extras');
    const sMatTot = document.getElementById('sum-mat-total');
    const sDis = document.getElementById('sum-diseno');
    const sMO = document.getElementById('sum-mo');
    const sTot = document.getElementById('sum-total');
    const sAde = document.getElementById('sum-adelanto');
    const sSal = document.getElementById('sum-saldo');
    const moLbl = document.getElementById('calc-mo-label');

    if (moLbl) {
      moLbl.textContent = moMethod === 'factor' ? 'Factor Melamina (ej. 1.55):' : '% Mano de Obra (ej. 40%):';
    }

    if (sMel) sMel.textContent = 'S/. ' + fin.costMel.toFixed(2);
    if (sHer) sHer.textContent = 'S/. ' + fin.costHerrajes.toFixed(2);
    if (sCz) sCz.textContent = 'S/. ' + fin.costCz.toFixed(2);
    if (sLed) sLed.textContent = 'S/. ' + fin.costLed.toFixed(2);
    if (sExtras) sExtras.textContent = 'S/. ' + fin.costExtras.toFixed(2);
    if (sMatTot) sMatTot.textContent = 'S/. ' + fin.costMatTotal.toFixed(2);
    if (sDis) sDis.textContent = 'S/. ' + fin.disenoPrice.toFixed(2);
    if (sMO) sMO.textContent = 'S/. ' + fin.costMO.toFixed(2);
    if (sTot) sTot.textContent = 'S/. ' + fin.grandTotal.toFixed(2);
    if (sAde) sAde.textContent = 'S/. ' + fin.adelantoVal.toFixed(2);
    if (sSal) sSal.textContent = 'S/. ' + fin.saldoVal.toFixed(2);
  }

  function handleChange(e) {
    if (e.target.id === 'sinergia-search-proj') {
      view.sinergiaSearch = e.target.value;
      render();
      const inp = document.getElementById('sinergia-search-proj');
      if (inp) {
        inp.focus();
        inp.setSelectionRange(inp.value.length, inp.value.length);
      }
      return;
    }

    if (e.target.id === 'sinergia-search-mat') {
      view.sinergiaMatSearch = e.target.value;
      render();
      const inp = document.getElementById('sinergia-search-mat');
      if (inp) {
        inp.focus();
        inp.setSelectionRange(inp.value.length, inp.value.length);
      }
      return;
    }

    if (e.target.id === 'paso2-search-mat') {
      view.paso2Search = e.target.value;
      render();
      const inp = document.getElementById('paso2-search-mat');
      if (inp) {
        inp.focus();
        inp.setSelectionRange(inp.value.length, inp.value.length);
      }
      return;
    }

    if (e.target.id === 'finanzas-search-input') {
      view.finanzasSearch = e.target.value;
      render();
      const inp = document.getElementById('finanzas-search-input');
      if (inp) {
        inp.focus();
        inp.setSelectionRange(inp.value.length, inp.value.length);
      }
      return;
    }

    if (e.target.closest('#sim-item-name, #sim-item-cost, #sim-item-pct')) {
      if (!state.household.simulador) state.household.simulador = {};
      const nameInp = document.getElementById('sim-item-name');
      const costInp = document.getElementById('sim-item-cost');
      const pctInp = document.getElementById('sim-item-pct');
      if (nameInp) state.household.simulador.name = nameInp.value;
      if (costInp) state.household.simulador.cost = cleanNum(costInp.value, 3200);
      if (pctInp) state.household.simulador.dedicationPct = cleanNum(pctInp.value, 50);
      saveState();
      render();
      const activeEl = document.getElementById(e.target.id);
      if (activeEl && activeEl.focus) {
        activeEl.focus();
        if (activeEl.setSelectionRange && activeEl.value) {
          activeEl.setSelectionRange(activeEl.value.length, activeEl.value.length);
        }
      }
      return;
    }

    if (e.target.matches('.mat-price-edit')) {
      const m = (state.sinergiaMaterials||[]).find(x => x.id === e.target.dataset.id);
      if (m) {
        m.price = cleanNum(e.target.value, 0);
        saveState();
      }
      return;
    }

    if (e.target.matches('.cart-qty-input')) {
      const idx = +e.target.dataset.i;
      if (state.sinergiaCart && state.sinergiaCart[idx]) {
        state.sinergiaCart[idx].qty = cleanNum(e.target.value, 0);
        saveState(); recalcQuote();
      }
      return;
    }

    if (e.target.matches('.cart-price-input')) {
      const idx = +e.target.dataset.i;
      if (state.sinergiaCart && state.sinergiaCart[idx]) {
        state.sinergiaCart[idx].price = cleanNum(e.target.value, 0);
        saveState(); recalcQuote();
      }
      return;
    }

    if (e.target.id === 'calc-mo-method') {
      const moLbl = document.getElementById('calc-mo-label');
      const moInp = document.getElementById('calc-mo-factor');
      if (e.target.value === 'factor') {
        if (moLbl) moLbl.textContent = 'Factor Melamina (ej. 1.55):';
        if (moInp && +moInp.value > 10) moInp.value = '1.55';
      } else {
        if (moLbl) moLbl.textContent = '% Mano de Obra (ej. 40%):';
        if (moInp && +moInp.value < 5) moInp.value = '40';
      }
      recalcQuote();
      return;
    }

    if (e.target.closest('#calc-mo-factor, #calc-diseno, #calc-adelanto-pct, #calc-dias-entrega')) {
      recalcQuote();
      return;
    }
    const mem = getActiveMember();

    if (mem && e.target.id === 'sch-selector') {
      mem.activeScheduleId = e.target.value;
      saveState(); render();
      showToast('Horario activo cambiado');
      return;
    }
    if (mem && e.target.matches('.cat-color-picker')) {
      const k = e.target.dataset.cat;
      if (mem.categories && mem.categories[k]) {
        mem.categories[k].c = e.target.value;
        saveState();
      }
      return;
    }
    if (mem && e.target.matches('.cat-name-input')) {
      const k = e.target.dataset.cat;
      if (mem.categories && mem.categories[k]) {
        mem.categories[k].n = e.target.value.trim();
        saveState();
      }
      return;
    }
    if (mem && e.target.matches('.todo-check')) {
      mem.priorities[+e.target.dataset.idx].done = e.target.checked;
      saveState(); render(); return;
    }
    if (mem && e.target.matches('.mem-drive-input')) {
      const idx = +e.target.dataset.i;
      if (mem.driveVault && mem.driveVault[idx]) {
        mem.driveVault[idx].url = e.target.value.trim();
        saveState();
      }
      return;
    }
    if (e.target.matches('.proj-stage-change')) {
      const p = state.sinergia.projects.find(x => x.id === e.target.dataset.pid);
      if (p) { p.stage = e.target.value; saveState(); render(); showToast('Estado del proyecto actualizado'); }
      return;
    }
    if (e.target.matches('.df-url')) {
      state.sinergia.driveFolders[+e.target.dataset.i].url = e.target.value;
      saveState(); return;
    }
    if (e.target.matches('.course-drive')) {
      state.academic.courses[+e.target.dataset.i].driveUrl = e.target.value;
      saveState(); return;
    }

    if (mem) {
      const sch = getSchedule(); if (!sch) return;
      if (e.target.matches('.ed-start')) { (sch.days[e.target.dataset.d]||[])[+e.target.dataset.i][0] = e.target.value; saveState(); return; }
      if (e.target.matches('.ed-end')) {
        let v = e.target.value; if(v==='23:59') v='24:00';
        (sch.days[e.target.dataset.d]||[])[+e.target.dataset.i][1] = v; saveState(); return;
      }
      if (e.target.matches('.ed-label')) { (sch.days[e.target.dataset.d]||[])[+e.target.dataset.i][2] = e.target.value; saveState(); return; }
      if (e.target.matches('.ed-cat')) { (sch.days[e.target.dataset.d]||[])[+e.target.dataset.i][3] = e.target.value; saveState(); render(); return; }
    }

    if (e.target.id==='restore-json-input') {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          state = JSON.parse(evt.target.result);
          saveState(); applyTheme(); render();
          showToast('✓ Backup restaurado');
        } catch(err){ showToast('Archivo inválido', 'warn'); }
      };
      reader.readAsText(file);
    }
  }

    document.addEventListener('click', function(e) {
      try { handleClick(e); } catch(err) { console.error('Click error:', err); }
    });
    document.addEventListener('change', function(e) {
      try { handleChange(e); } catch(err) { console.error('Change error:', err); }
    });
    document.addEventListener('input', function(e) {
      try {
        handleChange(e);
        // Debounce automático para inputs de texto largos y búsquedas
        if (e.target.matches('input[type="text"], textarea, .cat-name-input')) {
          debounceSave(400);
        }
      } catch(err) { console.error('Input error:', err); }
    });

    // Atajos de teclado globales (Ctrl + M: Menú rápido ☰, Escape: Cerrar modal/menú)
    window.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        const modal = document.getElementById('smodal-backdrop');
        if (modal) {
          hideSinergiaModal();
          return;
        }
        if (state.quickNavOpen) {
          state.quickNavOpen = false;
          render();
          return;
        }
      }
      if ((e.ctrlKey || e.altKey || e.metaKey) && (e.key === 'm' || e.key === 'M')) {
        e.preventDefault();
        state.quickNavOpen = !state.quickNavOpen;
        render();
      }
    });
    
    window.addEventListener('error', function(e) {
      console.warn('App error intercepted:', e.message);
    });

    loadState();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(reg => {
          reg.update();
        }).catch(()=>{});
      });
    }

  })();
  </script>
