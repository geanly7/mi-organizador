<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>FAMILIA GFB & SINERGIA — Core Workspace</title>
  <meta name="description" content="Ecosistema integral de horarios familiares, proyectos compartidos de Sinergia, finanzas del hogar y bóveda académica UNCP para la Familia GFB.">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7c6cff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; min-height: 100vh; background: #0e1015 url('./fondo-textura.jpg') center center / cover no-repeat fixed; color: #f4f5f8; transition: background 0.35s, color 0.35s; overflow-x: hidden; }

    /* ============ THEMES ============ */
    #app-root[data-theme="dark"] {
      --bg-body: #0e1015;
      --bg-base: #14161d;
      --bg-mix: #1a1d26;
      --bg-surface: rgba(255, 255, 255, 0.04);
      --bg-surface-hover: rgba(255, 255, 255, 0.075);
      --bg-elevated: #20232d;
      --bg-card: rgba(22, 24, 32, 0.88);
      --bg-input: #12141a;
      --border: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(255, 255, 255, 0.18);
      --cell-border: rgba(255, 255, 255, 0.05);
      --text-1: #f4f5f8;
      --text-2: #a0a6b8;
      --text-3: #6c7285;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.14);
      --accent-gradient: linear-gradient(135deg, #3b82f6, #2563eb);
      --header-gradient: linear-gradient(135deg, rgba(30, 33, 43, 0.95), rgba(18, 20, 27, 0.98));
      --th-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.01));
      --th-today: linear-gradient(180deg, rgba(59, 130, 246, 0.22), rgba(59, 130, 246, 0.06));
      --success: #10b981;
      --success-soft: rgba(16, 185, 129, 0.14);
      --warn: #f59e0b;
      --warn-soft: rgba(245, 158, 11, 0.14);
      --warn-text: #fbbf24;
      --info-text: #93c5fd;
      --banner-border: rgba(245, 158, 11, 0.3);
      --info-border: rgba(59, 130, 246, 0.3);
      --shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
      --glass-glow: radial-gradient(circle at 50% 0%, rgba(218, 175, 55, 0.08), transparent 70%);
    }

    #app-root[data-theme="light"] {
      --bg-body: #f4f6fb;
      --bg-base: #ffffff;
      --bg-mix: #ffffff;
      --bg-surface: rgba(0, 0, 0, 0.02);
      --bg-surface-hover: rgba(0, 0, 0, 0.045);
      --bg-elevated: #ffffff;
      --bg-card: rgba(255, 255, 255, 0.92);
      --bg-input: #eef2f7;
      --border: rgba(0, 0, 0, 0.08);
      --border-strong: rgba(0, 0, 0, 0.16);
      --cell-border: rgba(0, 0, 0, 0.05);
      --text-1: #14172c;
      --text-2: #535c79;
      --text-3: #8a94b0;
      --accent: #5b52d9;
      --accent-soft: rgba(91, 82, 217, 0.1);
      --accent-gradient: linear-gradient(135deg, #5b52d9, #4339b8);
      --header-gradient: linear-gradient(135deg, rgba(91, 82, 217, 0.08), rgba(0, 168, 130, 0.04));
      --th-bg: linear-gradient(180deg, rgba(91, 82, 217, 0.08), rgba(91, 82, 217, 0.02));
      --th-today: linear-gradient(180deg, rgba(91, 82, 217, 0.16), rgba(91, 82, 217, 0.06));
      --success: #00a882;
      --success-soft: rgba(0, 168, 130, 0.1);
      --warn: #e05530;
      --warn-soft: rgba(224, 85, 48, 0.08);
      --warn-text: #c44420;
      --info-text: #4a41a8;
      --banner-border: rgba(224, 85, 48, 0.25);
      --info-border: rgba(91, 82, 217, 0.25);
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      --glass-glow: radial-gradient(circle at 50% 0%, rgba(91, 82, 217, 0.08), transparent 70%);
    }

    #app-root {
      --radius: 12px;
      --radius-sm: 8px;
      --mono: 'JetBrains Mono', 'Consolas', monospace;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      width: 100%;
      max-width: 1680px;
      margin: 0 auto;
      padding: 0 0 36px;
      color: var(--text-1);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ============ TOP NAV BAR (ALWAYS VISIBLE) ============ */
    .top-global-header {
      padding: 14px 24px;
      background: var(--header-gradient);
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
    }
    .top-header-center {
      display: flex;
      align-items: center;
      justify-content: center;
      justify-self: center;
    }
    .top-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .top-badge {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-strong);
      font-weight: 700;
    }
    .top-main-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .top-nav-btn {
      font-family: var(--mono);
      font-size: 11.5px;
      padding: 8px 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-2);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      font-weight: 600;
    }
    .top-nav-btn:hover { background: var(--bg-surface-hover); color: var(--text-1); }
    .top-nav-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
    }
    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      justify-self: end;
      gap: 8px;
      position: relative;
    }

    /* ============ SPLASH & HUB SCREENS ============ */
    .splash-container {
      min-height: 85vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 20px;
    }
    .splash-card {
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: 20px;
      padding: 48px 36px;
      max-width: 620px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .splash-badge {
      font-family: var(--mono);
      font-size: 11.5px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid var(--border-strong);
      font-weight: 700;
      margin-bottom: 18px;
    }
    .splash-title {
      font-size: 40px;
      font-weight: 900;
      letter-spacing: -0.03em;
      color: var(--text-1);
      margin-bottom: 8px;
      line-height: 1.1;
    }
    .splash-sub {
      font-size: 14.5px;
      color: var(--text-2);
      line-height: 1.5;
      margin-bottom: 28px;
      max-width: 480px;
    }
    .splash-start-btn {
      font-size: 16px;
      font-weight: 800;
      font-family: var(--mono);
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px 38px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
      transition: all 0.25s var(--ease);
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .splash-start-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 14px 32px rgba(37, 99, 235, 0.5);
    }

    /* HUB DE 3 OPCIONES */
    .hub-container {
      padding: 30px 20px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    .hub-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 22px;
      margin-top: 28px;
    }
    .hub-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-top: 5px solid var(--h-color);
      border-radius: var(--radius);
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.25s var(--ease);
      box-shadow: var(--shadow);
      position: relative;
    }
    .hub-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.25);
      border-color: var(--h-color);
    }
    .hub-card-icon {
      font-size: 38px;
      margin-bottom: 16px;
      width: 64px;
      height: 64px;
      border-radius: 14px;
      background: color-mix(in srgb, var(--h-color) 18%, var(--bg-surface));
      border: 1px solid color-mix(in srgb, var(--h-color) 35%, transparent);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hub-card-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-1);
      margin-bottom: 8px;
    }
    .hub-card-desc {
      font-size: 13px;
      color: var(--text-2);
      line-height: 1.5;
      margin-bottom: 22px;
      flex-grow: 1;
    }
    .hub-card-btn {
      width: 100%;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 700;
      font-family: var(--mono);
      background: color-mix(in srgb, var(--h-color) 16%, var(--bg-surface));
      color: var(--h-color);
      border: 1px solid color-mix(in srgb, var(--h-color) 40%, transparent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s;
    }
    .hub-card:hover .hub-card-btn {
      background: var(--h-color);
      color: #fff;
      border-color: var(--h-color);
    }

    /* BOTÓN CUADRADO 3 LÍNEAS & MENÚ FLOTANTE */
    .quick-nav-btn {
      width: 38px;
      height: 38px;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.2s;
      padding: 0;
      flex-shrink: 0;
    }
    .quick-nav-btn:hover, .quick-nav-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
    }
    .quick-nav-line {
      width: 18px;
      height: 2.2px;
      background: var(--text-1);
      border-radius: 2px;
      transition: all 0.2s;
    }
    .quick-nav-btn:hover .quick-nav-line, .quick-nav-btn.active .quick-nav-line {
      background: var(--accent);
    }
    .quick-nav-dropdown {
      position: absolute;
      top: 56px;
      right: 18px;
      width: 310px;
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 16px;
      z-index: 99999;
      animation: fadeIn 0.2s ease;
    }
    .quick-nav-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 12px 0;
    }
    .quick-nav-square {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .quick-nav-square:hover {
      background: color-mix(in srgb, var(--q-color) 16%, var(--bg-surface));
      border-color: var(--q-color);
      transform: translateY(-2px);
    }

    /* ============ MEMBER SUB-HEADER (WHEN PROFILE IS ACTIVE) ============ */
    .member-sub-header {
      padding: 12px 24px;
      background: color-mix(in srgb, var(--user-color, var(--accent)) 8%, var(--bg-base));
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }
    .member-info-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .member-avatar-mini {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--user-color, var(--accent)) 20%, var(--bg-mix));
      border: 2px solid var(--user-color, var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .member-sub-tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
    }
    .member-sub-btn {
      font-family: var(--mono);
      font-size: 11px;
      padding: 7px 12px;
      border: none;
      background: none;
      color: var(--text-3);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: color 0.2s, border-color 0.2s;
      font-weight: 500;
    }
    .member-sub-btn:hover { color: var(--text-1); }
    .member-sub-btn.active {
      color: var(--user-color, var(--accent));
      border-bottom-color: var(--user-color, var(--accent));
      font-weight: 700;
    }

    /* ============ HOME PORTAL ============ */
    .portal-hero {
      text-align: center;
      padding: 32px 20px 24px;
      position: relative;
    }
    .portal-title {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, var(--text-1) 30%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .portal-sub { font-size: 15px; color: var(--text-2); max-width: 600px; margin: 0 auto; line-height: 1.5; }

    .gfb-members-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      width: 100%;
      margin-top: 20px;
    }
    .gfb-member-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: all 0.25s var(--ease);
      position: relative;
      overflow: hidden;
    }
    .gfb-member-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: var(--m-color);
      transition: height 0.25s;
    }
    .gfb-member-card:hover {
      transform: translateY(-5px);
      border-color: var(--m-color);
      box-shadow: 0 14px 28px color-mix(in srgb, var(--m-color) 20%, transparent);
    }
    .gfb-member-card:hover::before { height: 6px; }
    .gfb-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--m-color) 18%, var(--bg-mix));
      border: 2px solid var(--m-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 12px;
    }
    .gfb-member-name { font-size: 18px; font-weight: 700; color: var(--text-1); margin-bottom: 2px; }
    .gfb-member-role { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--m-color); text-transform: uppercase; margin-bottom: 10px; }
    .gfb-member-focus-preview { font-size: 11.5px; color: var(--text-2); line-height: 1.4; margin-bottom: 14px; flex-grow: 1; }
    .gfb-enter-btn {
      width: 100%;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--bg-surface);
      color: var(--text-1);
      font-size: 11.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .gfb-member-card:hover .gfb-enter-btn { background: var(--m-color); color: #fff; border-color: var(--m-color); }

    /* ============ PANEL ============ */
    .hs-panel { padding: 20px 24px 0; flex-grow: 1; }

    /* ============ CARDS & UI ============ */
    .hs-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 18px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
    }
    .hs-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .hs-section-title {
      font-family: var(--mono);
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-3);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hs-hint { font-size: 12px; color: var(--text-3); margin: 12px 0 0; }
    .hs-banner {
      background: var(--warn-soft);
      border: 1px solid var(--banner-border);
      color: var(--warn-text);
      font-size: 12.5px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      margin: 0 0 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ============ BUTTONS & INPUTS ============ */
    .hs-btn {
      font-family: var(--mono);
      font-size: 11.5px;
      letter-spacing: 0.04em;
      padding: 8px 15px;
      border: 1px solid var(--border-strong);
      background: var(--bg-surface);
      color: var(--text-2);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 500;
      text-decoration: none;
    }
    .hs-btn:hover { background: var(--bg-surface-hover); color: var(--text-1); transform: translateY(-1px); }
    .hs-btn.primary { background: var(--accent-gradient); border-color: var(--accent); color: #fff; font-weight: 600; }
    .hs-btn.danger { border-color: rgba(255, 100, 100, 0.4); color: #ff7777; }
    .hs-btn.danger:hover { background: rgba(255, 100, 100, 0.12); color: #ff9999; }
    .hs-btn.sm { padding: 5px 10px; font-size: 10.5px; }

    /* ============ TABLE / HORARIO ============ */
    .hs-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      scrollbar-width: thin;
      box-shadow: var(--shadow);
    }
    .hs-table { border-collapse: collapse; width: 100%; min-width: 780px; table-layout: fixed; }
    .hs-table th {
      background: var(--th-bg);
      color: var(--text-2);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      padding: 10px 4px;
      position: sticky;
      top: 0;
      z-index: 2;
      border-bottom: 1px solid var(--border-strong);
    }
    .hs-table th.today { color: var(--user-color, var(--accent)); background: var(--th-today); font-weight: 700; }
    .hs-table th .pct { display: block; font-size: 9.5px; opacity: 0.75; margin-top: 2px; color: var(--text-3); }
    .hs-table th:first-child { width: 56px; }
    .hs-timecell {
      font-family: var(--mono);
      font-size: 9.5px;
      color: var(--text-3);
      text-align: right;
      padding: 2px 8px;
      border-top: 1px solid var(--cell-border);
      vertical-align: top;
    }
    .hs-daycell { border-top: 1px solid var(--cell-border); border-left: 1px solid var(--cell-border); padding: 0; vertical-align: top; }
    .hs-daycell.today-col { background: color-mix(in srgb, var(--user-color, var(--accent)) 3.5%, transparent); }

    .hs-block {
      background: color-mix(in srgb, var(--cat) 18%, var(--bg-mix));
      border-left: 3.5px solid var(--cat);
      border-radius: var(--radius-sm);
      margin: 1.5px;
      padding: 4px 7px;
      font-size: 11px;
      line-height: 1.3;
      cursor: pointer;

    /* ============ TOAST ============ */

    /* INDICADOR DE HORA ACTUAL EN EL HORARIO (LÍNEA ROJA NOW) */

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes toastIn { from { opacity:0; transform: translateX(40px); } to { opacity:1; transform: translateX(0); } }

    .picker-modal-backdrop {

      z-index: 10001;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .picker-modal-card {
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      width: 100%;
      max-width: 380px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .picker-modal-header {
      padding: 12px 16px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .picker-modal-title { font-size: 14px; font-weight: 800; color: var(--text-1); display: flex; align-items: center; gap: 6px; }
    
    /* Calendar Grid */
    .mini-cal-nav { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px 8px; }
    .mini-cal-month-title { font-size: 14px; font-weight: 800; color: var(--text-1); }
    .mini-cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; padding: 0 16px 14px; text-align: center; }
    .mini-cal-dayhead { font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: var(--text-3); padding: 4px 0; }

      border-radius: 6px;
      border: 1px solid transparent;
      background: var(--bg-surface);
      color: var(--text-1);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;

    .mini-cal-daybtn:hover { background: var(--accent-soft); color: var(--accent); }

    .mini-cal-daybtn.today-highlight { border-color: var(--accent); color: var(--accent); }

    .time-wheel-body { display: flex; justify-content: center; gap: 12px; padding: 20px 16px; background: var(--bg-card); }

      flex-direction: column;
      height: 180px;
      overflow-y: auto;

      width: 76px;

      min-height: 38px;

      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-2);
      cursor: pointer;
      scroll-snap-align: center;
      transition: all 0.15s;
    }
    .time-wheel-item:hover { background: var(--bg-surface-hover); color: var(--text-1); }
    .time-wheel-item.selected {
      background: var(--accent) !important;
      color: #ffffff !important;
      font-weight: 800;
      font-size: 15px;
    }

  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function toMin(t) { if(!t) return 0; const p = t.split(':'); return (+p[0])*60+(+p[1]); }
  function slotIdx(m) { return Math.round((m - GRID_START) / SLOT); }
  function labelHM(m) { const h = Math.floor(m/60)%24, mm = m%60; return (h<10?'0':'')+h+':'+(mm<10?'0':'')+mm; }
  function genId() { return 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

  function localDateStr(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function fmtShort(d) { return d.getDate() + ' ' + MONTHS[d.getMonth()]; }
  function fmtFull(d) { return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }

  function getMondayOf(date) {
    const d = new Date(date);
    const day = d.getDay();
    d.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
    return localDateStr(d);
  }

  function getWeekDates(weekStr) {
    const parts = (weekStr||getMondayOf(new Date())).split('-');
    const ws = new Date(+parts[0], +parts[1]-1, +parts[2], 12, 0, 0);
    return ORDER.map((_, i) => { const d = new Date(ws); d.setDate(ws.getDate()+i); return d; });
  }

  /* ================================================================
     SINERGIA FINANCIAL CALCULATION ENGINE (CENTRALIZED & SANITIZED)
     ================================================================ */
  function cleanNum(val, defaultVal = 0, min = 0, max = Infinity) {
    let n = parseFloat(val);
    if (isNaN(n) || !isFinite(n)) n = defaultVal;
    if (n < min) n = min;
    if (n > max) n = max;
    return n;
  }

  function calculateSinergiaFinancials(cart = [], params = {}) {
    const moMethod = params.moMethod || 'factor';
    const moFactor = cleanNum(params.moFactor, 1.55, 0.1, 100.0);
    const disenoPrice = cleanNum(params.disenoPrice, 450, 0);
    const adelantoPct = cleanNum(params.adelantoPct, 50, 0, 100);

    let costMel = 0, costTapacanto = 0, costHerrajes = 0, costCz = 0, costLed = 0, costExtras = 0;

    cart.forEach(it => {
      const q = cleanNum(it.qty, 0, 0);
      const p = cleanNum(it.price, 0, 0);
      const sub = q * p;

      if (it.cat === 'melamina') costMel += sub;
      else if (it.cat === 'tapacantos') costTapacanto += sub;
      else if (it.cat === 'correderas' || it.cat === 'bisagras') costHerrajes += sub;
      else if (it.cat === 'piedras') costCz += sub;
      else if (it.cat === 'led') costLed += sub;
      else costExtras += sub;
    });

    const totalHerrajes = costTapacanto + costHerrajes;
    const costMatTotal = costMel + totalHerrajes + costCz + costLed + costExtras;

    // Mano de Obra: Factor sobre Melamina (ej. 1.55x) o Porcentaje sobre Materiales (ej. 40%)
    let costMO = 0;
    if (moMethod === 'factor') {
      costMO = costMel * moFactor;
    } else {
      costMO = costMatTotal * (moFactor / 100);
    }

    const grandTotal = costMatTotal + disenoPrice + costMO;
    const adelantoVal = grandTotal * (adelantoPct / 100);
    const saldoVal = grandTotal - adelantoVal;

    return {
      costMel,
      costTapacanto,
      costHerrajes: totalHerrajes,
      costCz,
      costLed,
      costExtras,
      costMatTotal,
      costMO,
      disenoPrice,
      grandTotal,
      adelantoVal,
      saldoVal,
      adelantoPct,
      moMethod,
      moFactor
    };
  }

  let _saveDebounceTimer = null;

  function normStr(str) {
    if (!str) return '';

  let _undoState = null;
  function pushUndo(actionLabel, snapshot) {

  function applyUndo() {

  /* ================================================================
     MINI-CALENDARIO VISUAL INTERACTIVO & RUEDA DESLIZABLE DE HORA
     ================================================================ */
  let currentPickerYear = new Date().getFullYear();
  let currentPickerMonth = new Date().getMonth();

  function openMiniCalendar(targetInputId) {
    const targetInput = document.getElementById(targetInputId);
    if (!targetInput) return;
    const container = document.getElementById('picker-popup-container');
    if (!container) return;

    if (targetInput.value && /^\d{4}-\d{2}-\d{2}$/.test(targetInput.value)) {
      const parts = targetInput.value.split('-');
      currentPickerYear = parseInt(parts[0], 10);
      currentPickerMonth = parseInt(parts[1], 10) - 1;
    }

    const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

    function renderCal() {
      const firstDayOfMonth = new Date(currentPickerYear, currentPickerMonth, 1).getDay();
      const daysInMonth = new Date(currentPickerYear, currentPickerMonth + 1, 0).getDate();
      const firstDayCol = (firstDayOfMonth === 0 ? 6 : firstDayOfMonth - 1);

      const todayStr = localDateStr(new Date());
      const selectedVal = targetInput.value;

      let gridHtml = '';
      ['LU', 'MA', 'MI', 'JU', 'VI', 'SA', 'DO'].forEach(dh => {
        gridHtml += `<div class="mini-cal-dayhead">${dh}</div>`;
      });

      for (let i = 0; i < firstDayCol; i++) {
        gridHtml += '<div class="mini-cal-daybtn empty"></div>';
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const mStr = String(currentPickerMonth + 1).padStart(2, '0');
        const dStr = String(day).padStart(2, '0');
        const dateIso = `${currentPickerYear}-${mStr}-${dStr}`;
        const isSelected = (dateIso === selectedVal);
        const isToday = (dateIso === todayStr);

        let cls = 'mini-cal-daybtn';
        if (isSelected) cls += ' selected';
        if (isToday) cls += ' today-highlight';

        gridHtml += `<button type="button" class="${cls}" data-cal-val="${dateIso}">${day}</button>`;
      }

      const html = `
        <div class="picker-modal-backdrop" id="picker-backdrop">
          <div class="picker-modal-card">
            <div class="picker-modal-header">
              <div class="picker-modal-title">📅 Mini Calendario Interactivo</div>
              <button id="picker-close-btn" style="border:none;background:none;color:var(--text-3);font-size:16px;cursor:pointer;padding:4px;">✕</button>
            </div>
            <div class="mini-cal-nav">
              <button type="button" class="hs-btn sm" id="cal-prev-month" style="padding:4px 10px;flex-shrink:0;">◀</button>
              <div class="mini-cal-month-title" style="width:170px;min-width:170px;max-width:170px;text-align:center;font-weight:800;white-space:nowrap;user-select:none;box-sizing:border-box;">${monthNames[currentPickerMonth]} ${currentPickerYear}</div>
              <button type="button" class="hs-btn sm" id="cal-next-month" style="padding:4px 10px;flex-shrink:0;">▶</button>
            </div>
            <div class="mini-cal-grid">
              ${gridHtml}
            </div>
            <div style="padding:10px 16px 14px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
              <button type="button" class="hs-btn sm" id="cal-go-today">📅 Hoy (${todayStr})</button>
              <button type="button" class="hs-btn primary sm" id="cal-close-done">✓ Listo</button>
            </div>
          </div>
        </div>
      `;

      container.innerHTML = html;

      document.getElementById('picker-close-btn').onclick = closePicker;
      document.getElementById('cal-close-done').onclick = closePicker;
      document.getElementById('picker-backdrop').onclick = (e) => {
        if (e.target.id === 'picker-backdrop') closePicker();
      };

      document.getElementById('cal-prev-month').onclick = () => {
        currentPickerMonth--;
        if (currentPickerMonth < 0) {
          currentPickerMonth = 11;
          currentPickerYear--;
        }
        renderCal();
      };

      document.getElementById('cal-next-month').onclick = () => {
        currentPickerMonth++;
        if (currentPickerMonth > 11) {
          currentPickerMonth = 0;
          currentPickerYear++;
        }
        renderCal();
      };

      document.getElementById('cal-go-today').onclick = () => {
        const t = new Date();
        currentPickerYear = t.getFullYear();
        currentPickerMonth = t.getMonth();
        targetInput.value = localDateStr(t);
        targetInput.dispatchEvent(new Event('change', { bubbles: true }));
        closePicker();
      };

      container.querySelectorAll('[data-cal-val]').forEach(btn => {
        btn.onclick = () => {
          targetInput.value = btn.dataset.calVal;
          targetInput.dispatchEvent(new Event('change', { bubbles: true }));
          closePicker();
        };
      });
    }

    renderCal();
  }

  function openTimeWheelPicker(targetInputOrId) {
    const targetInput = (typeof targetInputOrId === 'string') ? document.getElementById(targetInputOrId) : targetInputOrId;
    if (!targetInput) return;
    const container = document.getElementById('picker-popup-container');
    if (!container) return;

    let selectedH = '08';
    let selectedM = '00';
    let selectedP = 'AM';

    if (targetInput.value && targetInput.value.includes(':')) {
      const parts = targetInput.value.split(':');
      let hNum = parseInt(parts[0], 10);
      selectedM = String(parts[1] || '00').slice(0, 2);
      if (hNum >= 12) {
        selectedP = 'PM';
        if (hNum > 12) hNum -= 12;
      } else {
        selectedP = 'AM';
        if (hNum === 0) hNum = 12;
      }
      selectedH = String(hNum).padStart(2, '0');
    }

    function renderTime() {
      const hoursList = ['01', '02', '03', '04', '05', '06', '07', '08', '09', '10', '11', '12'];
      const minsList = ['00', '05', '10', '15', '20', '25', '30', '35', '40', '45', '50', '55'];
      const perList = ['AM', 'PM'];

      let hCol = '';
      hoursList.forEach(h => {
        hCol += `<div class="time-wheel-item${h === selectedH ? ' selected' : ''}" data-wheel-h="${h}">${h}</div>`;
      });

      let mCol = '';
      minsList.forEach(m => {
        mCol += `<div class="time-wheel-item${m === selectedM ? ' selected' : ''}" data-wheel-m="${m}">${m}</div>`;
      });

      let pCol = '';
      perList.forEach(p => {
        pCol += `<div class="time-wheel-item${p === selectedP ? ' selected' : ''}" data-wheel-p="${p}">${p}</div>`;
      });

      const html = `
        <div class="picker-modal-backdrop" id="picker-backdrop">
          <div class="picker-modal-card">
            <div class="picker-modal-header">
              <div class="picker-modal-title">⏰ Selector de Hora (Rueda Táctil)</div>
              <button id="picker-close-btn" style="border:none;background:none;color:var(--text-3);font-size:16px;cursor:pointer;padding:4px;">✕</button>

            <div style="padding:12px 16px 0;text-align:center;">
              <div style="font-family:var(--mono);font-size:28px;font-weight:800;color:var(--accent);">
                ${selectedH}:${selectedM} ${selectedP}
              </div>
              <div style="font-size:11.5px;color:var(--text-3);margin-top:2px;">Toca en las columnas deslizables para cambiar la hora:</div>
            </div>

            <div class="time-wheel-body">
              <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
                <span style="font-size:10.5px;font-family:var(--mono);color:var(--text-3);font-weight:700;">HORA</span>
                <div class="time-wheel-col">${hCol}</div>
              </div>
              <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
                <span style="font-size:10.5px;font-family:var(--mono);color:var(--text-3);font-weight:700;">MINUTOS</span>
                <div class="time-wheel-col">${mCol}</div>
              </div>
              <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
                <span style="font-size:10.5px;font-family:var(--mono);color:var(--text-3);font-weight:700;">PERÍODO</span>
                <div class="time-wheel-col">${pCol}</div>
              </div>
            </div>

            <div style="padding:10px 16px 14px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
              <button type="button" class="hs-btn sm" id="wheel-now-btn">⏰ Ahora</button>
              <button type="button" class="hs-btn primary sm" id="wheel-confirm-btn">✓ Confirmar Hora</button>
            </div>
          </div>
        </div>
      `;

      container.innerHTML = html;

      document.getElementById('picker-close-btn').onclick = closePicker;
      document.getElementById('picker-backdrop').onclick = (e) => {
        if (e.target.id === 'picker-backdrop') closePicker();
      };

      container.querySelectorAll('[data-wheel-h]').forEach(el => {
        el.onclick = () => { selectedH = el.dataset.wheelH; renderTime(); };
      });
      container.querySelectorAll('[data-wheel-m]').forEach(el => {
        el.onclick = () => { selectedM = el.dataset.wheelM; renderTime(); };
      });
      container.querySelectorAll('[data-wheel-p]').forEach(el => {
        el.onclick = () => { selectedP = el.dataset.wheelP; renderTime(); };
      });

      document.getElementById('wheel-now-btn').onclick = () => {
        const nowD = new Date();
        let h24 = nowD.getHours();
        let m = String(Math.floor(nowD.getMinutes() / 5) * 5).padStart(2, '0');
        if (m === '60') m = '55';
        selectedM = m;
        if (h24 >= 12) {
          selectedP = 'PM';
          if (h24 > 12) h24 -= 12;
        } else {
          selectedP = 'AM';
          if (h24 === 0) h24 = 12;
        }
        selectedH = String(h24).padStart(2, '0');

        targetInput.dispatchEvent(new Event('change', { bubbles: true }));
        targetInput.dispatchEvent(new Event('input', { bubbles: true }));
        closePicker();
      };
    }

    renderTime();
  }

  let activeModalCallback = null;

  function showSinergiaModal(opts) {
    const container = document.getElementById('sinergia-modal-container');
    if (!container) return;

    activeModalCallback = opts.onSave || null;

    let bodyHtml = '';
    (opts.fields || []).forEach(f => {
      if (f.type === 'html') {
        bodyHtml += '<div class="sinergia-form-group">';
        if (f.label) bodyHtml += '<label style="font-weight:700;color:var(--text-1);margin-bottom:6px;display:block;">' + esc(f.label) + '</label>';
        bodyHtml += f.content || '';
        bodyHtml += '</div>';
        return;
      }
      bodyHtml += '<div class="sinergia-form-group">';
      bodyHtml += '<label>' + esc(f.label) + '</label>';
      if (f.type === 'select') {
        bodyHtml += '<select id="smodal-' + f.id + '">';
        (f.options || []).forEach(opt => {
          const val = typeof opt === 'object' ? opt.value : opt;
          const lbl = typeof opt === 'object' ? opt.label : opt;
          bodyHtml += '<option value="' + esc(val) + '"' + (val === f.value ? ' selected' : '') + '>' + esc(lbl) + '</option>';
        });
        bodyHtml += '</select>';
      } else if (f.type === 'textarea') {
        bodyHtml += '<textarea id="smodal-' + f.id + '" rows="' + (f.rows || 3) + '" placeholder="' + esc(f.placeholder || '') + '">' + esc(f.value || '') + '</textarea>';
      } else if (f.type === 'date') {
        bodyHtml += '<div style="display:flex;gap:6px;align-items:center;">';
        bodyHtml += '<input type="date" id="smodal-' + f.id + '" value="' + esc(f.value !== undefined ? f.value : '') + '" style="flex:1;cursor:pointer;">';
        bodyHtml += '<button type="button" class="hs-btn primary sm modal-open-cal-btn" data-target="smodal-' + f.id + '" style="padding:7px 12px;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:4px;">📅 Abrir Mini Calendario</button>';
        bodyHtml += '</div>';
      } else if (f.type === 'time') {
        bodyHtml += '<div style="display:flex;gap:6px;align-items:center;">';
        bodyHtml += '<input type="time" id="smodal-' + f.id + '" value="' + esc(f.value !== undefined ? f.value : '') + '" style="flex:1;cursor:pointer;">';
        bodyHtml += '<button type="button" class="hs-btn primary sm modal-open-time-btn" data-target="smodal-' + f.id + '" style="padding:7px 12px;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:4px;">⏰ Selector Rueda</button>';
        bodyHtml += '</div>';
      } else {
        bodyHtml += '<input type="' + (f.type || 'text') + '" id="smodal-' + f.id + '" value="' + esc(f.value !== undefined ? f.value : '') + '" placeholder="' + esc(f.placeholder || '') + '"' + (f.step ? ' step="' + f.step + '"' : '') + (f.min !== undefined ? ' min="' + f.min + '"' : '') + '>';
      }
      bodyHtml += '</div>';
    });

    const html = `
      <div class="sinergia-modal-backdrop" id="smodal-backdrop">
        <div class="sinergia-modal-card">
          <div class="sinergia-modal-header">
            <h3 class="sinergia-modal-title">${esc(opts.title || 'Sinergia Studio')}</h3>
            <button id="smodal-close-btn" style="border:none;background:none;color:var(--text-3);font-size:16px;cursor:pointer;padding:4px;">✕</button>
          </div>
          <div class="sinergia-modal-body">
            ${bodyHtml}
          </div>
          <div class="sinergia-modal-footer">
            <button class="hs-btn" id="smodal-cancel-btn">Cancelar</button>
            <button class="hs-btn primary" id="smodal-save-btn">${esc(opts.saveLabel || 'Guardar')}</button>
          </div>
        </div>
      </div>
    `;

    container.innerHTML = html;

    const firstInput = container.querySelector('input, select, textarea');
    if (firstInput) setTimeout(() => firstInput.focus(), 50);

    // Event listeners for Mini Calendar & Time Wheel triggers
    container.querySelectorAll('.modal-open-cal-btn').forEach(btn => {
      btn.onclick = () => openMiniCalendar(btn.dataset.target);
    });
    container.querySelectorAll('.modal-open-time-btn').forEach(btn => {
      btn.onclick = () => openTimeWheelPicker(btn.dataset.target);
    });

    const close = () => hideSinergiaModal();
    document.getElementById('smodal-close-btn').onclick = close;
    document.getElementById('smodal-cancel-btn').onclick = close;
    document.getElementById('smodal-backdrop').onclick = (e) => {
      if (e.target.id === 'smodal-backdrop') close();
    };

    document.getElementById('smodal-save-btn').onclick = () => {
      const data = {};
      (opts.fields || []).forEach(f => {
        const el = document.getElementById('smodal-' + f.id);
        if (el) data[f.id] = el.value;
      });
      if (activeModalCallback) activeModalCallback(data);
      hideSinergiaModal();
    };
  }

        { name: 'Importadora de Herrajes Ducasse / Hafele', contact: '987654321', type: 'Herrajes & Rieles', note: 'Bisagras cierre suave clip-on, correderas telescópicas pesadas' },

      state.appFlow = 'hub';
    }

    if (!state.finanzas.activeMonth) {
      const now = new Date();
      state.finanzas.activeMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    }
    if (!state.finanzas.subView) state.finanzas.subView = 'ingresos';
    if (!state.finanzas.months) state.finanzas.months = {};
    getMonthFinanzas(state.finanzas.activeMonth);

    FAMILY_MEMBERS.forEach(m => {
      if (!state.members[m.id]) {
        state.members[m.id] = createMemberInitialData(m.id);
      } else {
        const mem = state.members[m.id];
        mem.color = m.color; // Adopt modern architectural palette
        if (!mem.driveVault || !mem.driveVault.length) {
          mem.driveVault = getDefaultMemberDriveVault(m.id);
        }
        if (!mem.habits || !mem.habits.length) {
          mem.habits = getDefaultMemberHabits(m.id);
        }
                if (!mem.activityGroups || !mem.activityGroups.length) {
          mem.activityGroups = getDefaultMemberActivityGroups(m.id);
        }
        if (!mem.exams || !mem.exams.length) {
          mem.exams = getDefaultMemberExams(m.id);
        }
        // If schedule has empty days, hydrate with preset
        const sch = mem.schedules && mem.schedules[0];
        if (sch && sch.days) {
          const isEmpty = Object.values(sch.days).every(arr => !arr || arr.length === 0);
          if (isEmpty) {
            sch.days = JSON.parse(JSON.stringify(RAW_PRESETS[m.id] || GEANLY_RAW_DAYS));
          }
        }
      }
    });

    const cfg = state.pomoConfig || { focusMins: 25, breakMins: 5 };
    if (state.pomoRunning && state.pomoEndTime) {
      const diffSecs = Math.floor((state.pomoEndTime - Date.now()) / 1000);
      pomo.mode = state.pomoMode || 'Enfoque';
      pomo.total = (pomo.mode === 'Enfoque' ? cfg.focusMins : cfg.breakMins) * 60;
      if (diffSecs > 0) {
        pomo.remaining = diffSecs;
        pomo.running = true;
        pomo.interval = setInterval(pomoTick, 1000);
      } else {
        // Finalizó mientras la app estaba cerrada
        state.pomoRunning = false;
        pomo.running = false;
        pomo.remaining = cfg.focusMins * 60;
        pomo.total = cfg.focusMins * 60;
        pomo.mode = 'Enfoque';
      }
    } else if (state.pomoRemainingSecs) {
      pomo.remaining = state.pomoRemainingSecs;
      pomo.mode = state.pomoMode || 'Enfoque';
      pomo.total = (pomo.mode === 'Enfoque' ? cfg.focusMins : cfg.breakMins) * 60;
    } else {
      pomo.remaining = cfg.focusMins * 60;
      pomo.total = cfg.focusMins * 60;
      pomo.mode = 'Enfoque';
    }

    // Inicializar Firebase Realtime Database para sincronización en vivo
    try {
      if (window.firebase) {
        if (!firebase.apps || !firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        window.gfbFirebaseDb = db;
        const syncRef = db.ref('gfb_cloud_sync');

        // Escuchar cambios en vivo desde cualquier celular o PC
        syncRef.on('value', (snapshot) => {
          const cloudData = snapshot.val();
          if (cloudData && typeof cloudData === 'object' && cloudData.lastUpdated) {
            isReceivingCloudData = true;
            if (cloudData.members) state.members = cloudData.members;
            if (cloudData.sinergia) state.sinergia = cloudData.sinergia;
            if (cloudData.sinergiaMaterials) state.sinergiaMaterials = cloudData.sinergiaMaterials;
            if (cloudData.sinergiaSuppliers) state.sinergiaSuppliers = cloudData.sinergiaSuppliers;
            if (cloudData.finanzas) state.finanzas = cloudData.finanzas;
            if (cloudData.household) state.household = cloudData.household;
            if (cloudData.academic) state.academic = cloudData.academic;
            
            store.set('familia-gfb-workspace-v5', JSON.stringify(state));
            cloudStatus = 'connected';
            isReceivingCloudData = false;
            render();
          } else {
            // Primera vez: subir datos locales para poblar la nube
            syncToFirebase();
          }
        }, (err) => {
          console.warn('Firebase listen error:', err);
          cloudStatus = 'offline';
        });
      }
    } catch(e) {
      console.warn('Firebase init error:', e);
      cloudStatus = 'offline';
    }

    applyTheme();
    try {
      render();
    } catch(err) {
      console.error('Render error:', err);
      state.activeGlobalTab = 'portal';
      state.activeMemberId = null;
      render();
    }
  }

      document.body.style.background = "#0e1015 url('./fondo-textura.jpg') center center / cover no-repeat fixed";
      document.body.style.color = '#f4f5f8';

    }

  function getActiveMember() {
    return (state.activeMemberId && state.members[state.activeMemberId]) ? state.members[state.activeMemberId] : null;
  }

  function getActivePhase(sch, targetWeekStr) {
    if (!sch) return null;
    if (!sch.phases || !sch.phases.length) {
      return {
        id: 'default',
        name: sch.periodName || 'Rutina General',
        weeksCount: 1,
        startDate: sch.startDate || '2026-08-01',
        endDate: sch.endDate || '2026-12-31',
        days: sch.days || {}
      };
    }
    
    // Si estamos en el editor y hay una fase seleccionada para edición:
    if (state.memberSubTab === 'editor' && view.activePhaseId) {
      const p = sch.phases.find(x => x.id === view.activePhaseId);
      if (p) return p;
    }

    // Si estamos en la vista de horario o se pasa una semana específica:
    const mem = getActiveMember();
    const weekStr = targetWeekStr || (mem ? mem.currentWeekStart : null);
    if (weekStr) {
      const dates = getWeekDates(weekStr);
      const weekStartStr = localDateStr(dates[0]);
      const weekEndStr = localDateStr(dates[6]);
      
      const matched = sch.phases.find(p => {
        if (p.startDate && p.endDate) {
          return (weekEndStr >= p.startDate && weekStartStr <= p.endDate);
        }
        return false;
      });
      if (matched) return matched;
    }

    return sch.phases[0];
  }

  function getActiveEditorDays(sch) {
    if (!sch) return {};
    if (sch.phases && sch.phases.length) {
      const curP = (view.activePhaseId && sch.phases.find(p => p.id === view.activePhaseId)) || sch.phases[0];
      if (!curP.days) curP.days = JSON.parse(JSON.stringify(sch.days || {}));
      return curP.days;
    }
    if (!sch.days) sch.days = {};
    return sch.days;
  }

  function getScheduleDays(sch, targetWeekStr) {
    if (!sch) return {};
    const phase = getActivePhase(sch, targetWeekStr);
    if (phase && phase.days) return phase.days;
    return sch.days || {};
  }

  function getSchedule(targetWeekStr) {
    const mem = getActiveMember();
    if (!mem || !mem.schedules || !mem.schedules.length) return null;
    
    // Si se pasa una fecha de semana específica (o en la vista de horario mem.currentWeekStart):
    const weekStr = targetWeekStr || mem.currentWeekStart;
    if (weekStr && state.memberSubTab === 'horario') {
      const dates = getWeekDates(weekStr);
      const weekStartStr = localDateStr(dates[0]);
      const weekEndStr = localDateStr(dates[6]);
      
      // Buscar el horario cuyo intervalo de fechas cubra esta semana
      const matchedSch = mem.schedules.find(s => {
        if (s.startDate && s.endDate) {
          return (weekEndStr >= s.startDate && weekStartStr <= s.endDate);
        }
        return false;
      });
      if (matchedSch) return matchedSch;
    }

    // En el Editor o por defecto: usar el seleccionado actualmente
    return mem.schedules.find(s => s.id === mem.activeScheduleId) || mem.schedules[0];
  }

  function getMemberCategories() {
    const mem = getActiveMember();
    return mem ? mem.categories : DEFAULT_CATEGORIES.geanly;
  }

  function getWeekState() {
    const mem = getActiveMember();
    if (!mem) return { done: {}, notes: {} };
    const sid = mem.activeScheduleId, w = mem.currentWeekStart;
    if (!mem.weekData[sid]) mem.weekData[sid] = {};
    if (!mem.weekData[sid][w]) mem.weekData[sid][w] = { done: {}, notes: {} };
    return mem.weekData[sid][w];
  }

  function findCurrentBlock() {
    const mem = getActiveMember();
    if (!mem) return null;
    const now = new Date(), todayStr = localDateStr(now);
    const dates = getWeekDates(mem.currentWeekStart);
    const idx = dates.findIndex(d => localDateStr(d) === todayStr);
    if (idx === -1) return null;
    const day = ORDER[idx];
    const sch = getSchedule(mem.currentWeekStart);
    if (!sch) return null;
    const schDays = getScheduleDays(sch, mem.currentWeekStart);
    const blocks = schDays[day] || [];
    const mins = now.getHours()*60 + now.getMinutes();
    for (let i = 0; i < blocks.length; i++) {
      const m0 = toMin(blocks[i][0]); let m1 = toMin(blocks[i][1]);
      if (m1 <= m0) m1 = GRID_END;
      if (mins >= m0 && mins < m1) return { day, idx: i, block: blocks[i] };
    }
    return null;
  }

  function computeStats() {
    const mem = getActiveMember();
    const sch = getSchedule(mem ? mem.currentWeekStart : null); if (!sch) return {};
    const schDays = getScheduleDays(sch, mem ? mem.currentWeekStart : null);
    const t = {};
    ORDER.forEach(d => (schDays[d] || []).forEach(b => {
      const cat = b[3];
      t[cat] = (t[cat] || 0) + (toMin(b[1]) - toMin(b[0]));
    }));
    return t;
  }

  function pctDay(day) {
    const mem = getActiveMember();
    const sch = getSchedule(mem ? mem.currentWeekStart : null); if (!sch) return 0;
    const schDays = getScheduleDays(sch, mem ? mem.currentWeekStart : null);
    const blocks = schDays[day] || [], ws = getWeekState();
    if (!blocks.length) return 0;
    let done = 0;
    blocks.forEach((_,i) => { if (ws.done[day+'-'+i]) done++; });
    return Math.round(100*done/blocks.length);
  }

  function buildDayMap(day) {
    const mem = getActiveMember();
    const sch = getSchedule(mem ? mem.currentWeekStart : null); if (!sch) return {};
    const schDays = getScheduleDays(sch, mem ? mem.currentWeekStart : null);
    const map = {};
    (schDays[day] || []).forEach((b, i) => {
      const r0 = slotIdx(toMin(b[0])), r1 = slotIdx(toMin(b[1]));
      map[r0] = { span: Math.max(1, r1 - r0), block: b, idx: i };
    });
    return map;
  }

  function playBeep() {
    try {
      const c = new (window.AudioContext||window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain();
      o.connect(g); g.connect(c.destination); o.frequency.value = 750; o.type = 'sine';
      g.gain.setValueAtTime(0.3, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.8);
      o.start(c.currentTime); o.stop(c.currentTime + 0.8);
    } catch(e){}
  }

  /* ================================================================
     SONIDO DE ALARMA DE CELULAR / CHIME ARMÓNICO
     ================================================================ */
  function playAlarmChime() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const notes = [587.33, 783.99, 880.00, 1046.50]; // D5, G5, A5, C6
      notes.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(ctx.destination);
        const startTime = ctx.currentTime + (idx * 0.13);
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.35, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.38);
        osc.start(startTime);
        osc.stop(startTime + 0.38);
      });
    } catch(e) {}
  }

  /* ================================================================
     SINCRONIZACIÓN DE ALARMA AL CELULAR (MODAL INTERACTIVO & SHARE API)
     ================================================================ */
  function generateICSString(mem, sch) {
    let ics = "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Familia GFB//Horarios & Alarmas//ES\r\nCALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\n";
    ics += `X-WR-CALNAME:Horario & Alarmas — ${mem.name}\r\n`;

    const dayMap = {
      LUNES: 'MO',
      MARTES: 'TU',
      MIERCOLES: 'WE',
      JUEVES: 'TH',
      VIERNES: 'FR',
      SABADO: 'SA',
      DOMINGO: 'SU'
    };

    const now = new Date();
    const monday = getMondayOf(now);

    ORDER.forEach((dayKey, dayIdx) => {
      const blocks = sch.days[dayKey] || [];
      const dDate = new Date(monday);
      dDate.setDate(monday.getDate() + dayIdx);
      const y = dDate.getFullYear();
      const m = String(dDate.getMonth() + 1).padStart(2, '0');
      const d = String(dDate.getDate()).padStart(2, '0');
      const dayIso = `${y}${m}${d}`;

      blocks.forEach((b, bIdx) => {
        const startClean = b[0].replace(':', '') + '00';
        const endClean = (b[1] === '24:00' ? '235900' : b[1].replace(':', '') + '00');
        const uid = `gfb-${mem.id}-${dayKey}-${bIdx}-${Date.now()}@familiagfb.com`;

        const isSchoolMember = (mem.id === 'franco' || mem.id === 'benjamin');
        const startHour = parseInt(b[0].split(':')[0], 10);
        const isSchoolHours = isSchoolMember && (dayIdx < 5) && (startHour < 15);

        ics += "BEGIN:VEVENT\r\n";
        ics += `UID:${uid}\r\n`;
        ics += `SUMMARY:${b[2]} (${mem.name})\r\n`;
        ics += `DESCRIPTION:Actividad de ${mem.name} - Familia GFB Workspace\r\n`;
        ics += `DTSTART:${dayIso}T${startClean}\r\n`;
        ics += `DTEND:${dayIso}T${endClean}\r\n`;
        ics += `RRULE:FREQ=WEEKLY;BYDAY=${dayMap[dayKey]}\r\n`;

        if (!isSchoolHours) {
          ics += "BEGIN:VALARM\r\n";
          ics += "ACTION:DISPLAY\r\n";
          ics += `DESCRIPTION:⏰ Recordatorio: ${b[2]} (${mem.name})\r\n`;
          ics += "TRIGGER:-PT10M\r\n";
          ics += "END:VALARM\r\n";
        }

        ics += "END:VEVENT\r\n";
      });
    });

    (mem.exams || []).forEach((ex, exIdx) => {
      const exDateClean = ex.date.replace(/-/g, '');
      const exTimeClean = ex.time ? ex.time.replace(':', '') + '00' : '080000';
      const uid = `gfb-exam-${mem.id}-${exIdx}-${Date.now()}@familiagfb.com`;

      ics += "BEGIN:VEVENT\r\n";
      ics += `UID:${uid}\r\n`;
      ics += `SUMMARY:🎓 ${ex.type}: ${ex.course} (${mem.name})\r\n`;
      ics += `DESCRIPTION:Temas: ${ex.notes || 'Evaluación'} - Ponderación: ${ex.weight || '30%'}\r\n`;
      ics += `DTSTART:${exDateClean}T${exTimeClean}\r\n`;
      ics += `DTEND:${exDateClean}T${exTimeClean}\r\n`;
      ics += "BEGIN:VALARM\r\n";
      ics += "ACTION:DISPLAY\r\n";
      ics += `DESCRIPTION:🚨 EXAMEN/ENTREGA: ${ex.course} (${mem.name})\r\n`;
      ics += "TRIGGER:-PT30M\r\n";
      ics += "END:VALARM\r\n";
      ics += "END:VEVENT\r\n";
    });

    ics += "END:VCALENDAR\r\n";
    return ics;
  }

  function downloadICSBlob(ics, filename) {
    const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      a.remove();
      URL.revokeObjectURL(url);
    }, 1500);
  }

      } catch (err) {
        showToast('Error al solicitar permisos', 'warn');
      }
    };

    // Botón 3: Direct Download
    document.getElementById('btn-download-ics-file').onclick = () => {
      downloadICSBlob(icsData, filename);
      showToast('📥 Archivo .ICS descargado. Ábrelo en tu celular para guardar.');
    };

    if (!filtered.length) {

      h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px;">';

      sorted.forEach((ex) => {
        const exDate = new Date(ex.date + 'T00:00:00');

        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        
        let badgeBg = 'rgba(59,130,246,0.15)', badgeColor = '#3b82f6', badgeText = 'En ' + diffDays + ' días';

        } else if (diffDays === 0) {

        } else if (diffDays <= 3) {

          catColor = '#8b5cf6';

          typePrefix = '🏡 ';
          detailsPrefix = '📝 <strong>Detalle / Notas:</strong> ';

          catColor = '#ef4444';
          typePrefix = '⚡ ';
          detailsPrefix = '🚨 <strong>Acción Inmediata:</strong> ';
        } else if (cat === 'salud') {

          catColor = '#06b6d4';
          typePrefix = '🏥 ';
          detailsPrefix = '💊 <strong>Indicaciones:</strong> ';
        }

        // Clean, universal pill badge without forced emojis - displays exact text (30%, S/. 1,200, 4 créditos, etc.)
        let weightBadgeHtml = '';
        if (ex.weight && ex.weight.trim()) {
          weightBadgeHtml = '<span style="font-size:11px;font-family:var(--mono);color:var(--text-1);font-weight:700;background:var(--bg-surface);border:1px solid var(--border);padding:2px 9px;border-radius:12px;letter-spacing:0.3px;">' + esc(ex.weight.trim()) + '</span>';

        // Header info in card

        h += '<span style="font-size:10px;font-family:var(--mono);font-weight:700;padding:2px 7px;border-radius:12px;background:rgba(0,0,0,0.22);color:' + catColor + ';border:1px solid ' + catColor + '44;">' + catBadge + '</span>';

        h += '<strong style="font-size:13.5px;color:' + (ex.done ? 'var(--text-3)' : 'var(--text-1)') + ';display:block;margin-bottom:2px;' + (ex.done ? 'text-decoration:line-through;opacity:0.7;' : '') + '">' + esc(ex.course) + '</strong>';

        h += '</div>';

        h += '</div>';

      h += '</div>';

    h += '</div>';
    h += '</div>';
    return h;

    let listHtml = '<div style="display:flex;flex-direction:column;gap:12px;" id="manage-groups-list">';
    
    mem.activityGroups.forEach((grp, gIdx) => {
      listHtml += `
        <div style="background:var(--bg-elevated);border:1px solid var(--border);border-left:4px solid ${grp.color||'var(--accent)'};border-radius:var(--radius-sm);padding:12px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px;">

              <strong style="font-size:13.5px;color:var(--text-1);">${esc(grp.name)}</strong>

      saveLabel: 'Listo',
      fields: [
        { id: 'groupsListHtml', type: 'html', content: listHtml }
      ],
      onSave: () => {
        saveState(); render();

    });

    setTimeout(() => {
      const cBtn = document.getElementById('create-new-activity-group-btn');
      if (cBtn) {
        cBtn.onclick = () => {
          showEditActivityGroupModal(mem, null);
        };
      }

    function showEditActivityGroupModal(mem, editIndex = null) {
    if (!mem.activityGroups) mem.activityGroups = getDefaultMemberActivityGroups(mem.id);
    const isEdit = (editIndex !== null && mem.activityGroups[editIndex]);
    const grp = isEdit ? mem.activityGroups[editIndex] : { id: genId(), name: '', color: '#3b82f6', catKeys: [] };
    const cats = getMemberCategories();

    // 1. Categories checklist (already assigned categories are crossed out and disabled)
    let catCheckboxesHtml = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;max-height:210px;overflow-y:auto;padding:8px;background:var(--bg-surface);border:1px solid var(--border);border-radius:4px;">';
    
    Object.keys(cats).forEach(ck => {
      const cInfo = cats[ck];
      const isChecked = grp.catKeys.includes(ck);
      
      // Check if this category is already in another group
      const otherGrp = mem.activityGroups.find((g, idx) => (editIndex === null || idx !== editIndex) && g.catKeys.includes(ck));

      if (otherGrp) {
        catCheckboxesHtml += `
          <label style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-3);cursor:not-allowed;padding:4px 8px;border-radius:4px;background:var(--bg-base);border:1px dashed var(--border);opacity:0.5;user-select:none;" title="Ya pertenece al grupo: ${esc(otherGrp.name)}">
