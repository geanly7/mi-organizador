  /* ================================================================
     EVENTS
     ================================================================ */
  function handleClick(e) {
    if (e.target.id==='theme-toggle'||e.target.closest('#theme-toggle')) {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      applyTheme(); saveState(); render(); return;
    }

    // Cerrar menú flotante si está abierto y se hace clic afuera
    if (state.quickNavOpen && !e.target.closest('#quick-nav-toggle') && !e.target.closest('#quick-nav-dropdown')) {
      state.quickNavOpen = false;
      render();
    }

    // Botón Iniciar en Pantalla Splash
    if (e.target.id === 'btn-app-iniciar' || e.target.closest('#btn-app-iniciar')) {
      state.appFlow = 'hub';
      state.quickNavOpen = false;
      saveState(); render(); return;
    }

    // Botón Volver a Splash
    if (e.target.id === 'back-to-splash-btn') {
      state.appFlow = 'splash';
      state.quickNavOpen = false;
      saveState(); render(); return;
    }

    // Clic en tarjeta del Hub de 3 Opciones
    const hubCard = e.target.closest('[data-hub-enter]');
    if (hubCard) {
      state.activeGlobalTab = hubCard.dataset.hubEnter;
      if (state.activeGlobalTab === 'portal') {
        state.memberSubTab = 'horario';
        if (state.deviceOwner && state.deviceOwner !== 'all') {
          state.activeMemberId = state.deviceOwner;
        } else {
          if (!state.activeMemberId) {
            state.activeMemberId = state.lastActiveMemberId || 'geanly';
          }
        }
      }
      state.appFlow = 'workspace';
      state.quickNavOpen = false;
      saveState(); render(); return;
    }

    // Modal: Selección de Dueño de Celular
    const pickOwnerBtn = e.target.closest('.device-pick-owner-btn');
    if (pickOwnerBtn) {
      const ownerId = pickOwnerBtn.dataset.ownerId;
      state.deviceOwner = ownerId;
      try { localStorage.setItem('gfb_device_owner', ownerId); } catch(e) {}
      if (ownerId && ownerId !== 'all') {
        state.activeMemberId = ownerId;
        state.lastActiveMemberId = ownerId;
        state.activeGlobalTab = 'portal';
        state.appFlow = 'workspace';
        hideSinergiaModal();
        saveState(); render();
        showToast('📱 ¡Celular vinculado a ' + (FAMILY_MEMBERS.find(m => m.id === ownerId)?.name || 'tu perfil') + '!');
      } else {
        state.deviceOwner = 'all';
        hideSinergiaModal();
        saveState(); render();
        showToast('💻 Modo Administrador Multiusuario activado');
      }
      return;
    }

    // Botón para cambiar vinculación de dispositivo
    if (e.target.id === 'btn-change-device-owner' || e.target.closest('#btn-change-device-owner')) {
      showDeviceLinkModal(() => {
        saveState(); render();
      });
      return;
    }

    // Hub Bulletin Board: Add Note
    if (e.target.id === 'hub-add-fnote-btn' || e.target.closest('#hub-add-fnote-btn')) {
      const inp = document.getElementById('hub-new-fnote-text');
      const authorSel = document.getElementById('hub-new-fnote-author');
      const urgChk = document.getElementById('hub-new-fnote-urgent');
      if (inp && inp.value.trim()) {
        if (!state.household) state.household = {};
        if (!state.household.familyNotes) state.household.familyNotes = [];
        state.household.familyNotes.unshift({
          id: genId(),
          author: (authorSel ? authorSel.value : 'Familia GFB'),
          urgent: (urgChk ? urgChk.checked : false),
          text: inp.value.trim(),
          createdAt: localDateStr(new Date())
        });
        saveState(); render();
        showToast('✓ Aviso publicado en la pizarra familiar');
      } else {
        showToast('Escribe un texto para publicar', 'warn');
      }
      return;
    }

    // Hub Bulletin Board: Delete Note
    const fnoteDel = e.target.closest('.hub-fnote-del');
    if (fnoteDel) {
      const idx = +fnoteDel.dataset.i;
      if (state.household && state.household.familyNotes) {
        state.household.familyNotes.splice(idx, 1);
        saveState(); render();
        showToast('Aviso eliminado de la pizarra', 'warn');
      }
      return;
    }

    // Toggle Cuadrado de 3 Líneas (Menú Flotante)
    if (e.target.closest('#quick-nav-toggle')) {
      state.quickNavOpen = !state.quickNavOpen;
      render(); return;
    }
    if (e.target.id === 'quick-nav-close') {
      state.quickNavOpen = false;
      render(); return;
    }

    // Salto rápido desde los Cuadraditos del Menú Flotante
    const qJump = e.target.closest('[data-quick-jump]');
    if (qJump) {
      state.activeGlobalTab = qJump.dataset.quickJump;
      if (state.activeGlobalTab === 'portal' && state.lastActiveMemberId && !state.activeMemberId) {
        state.activeMemberId = state.lastActiveMemberId;
      }
      state.appFlow = 'workspace';
      state.quickNavOpen = false;
      saveState(); render();
      const tabNames = { portal: '📅 Horarios de la Familia', sinergia: '🏢 Sinergia Studio', finanzas: '🏠 Finanzas del Hogar' };
      showToast('Cambiado a ' + (tabNames[state.activeGlobalTab] || 'Módulo'));
      return;
    }

    // Botón para ir al Hub de 3 opciones desde el Menú Flotante
    if (e.target.id === 'quick-to-hub-btn') {
      state.appFlow = 'hub';
      state.quickNavOpen = false;
      saveState(); render(); return;
    }

    // Top Navigation Brand (Logo vuelve al Hub de 3 opciones)
    if (e.target.id==='go-home-btn'||e.target.closest('#go-home-btn')) {
      state.appFlow = 'hub';
      state.quickNavOpen = false;
      saveState(); render(); return;
    }
    if (e.target.id==='tab-portal') {
      state.activeGlobalTab = 'portal';
      if (state.lastActiveMemberId && !state.activeMemberId) {
        state.activeMemberId = state.lastActiveMemberId;
      }
      state.appFlow = 'workspace';
      state.quickNavOpen = false;
      saveState(); render(); return;
    }
    if (e.target.id==='tab-sinergia') {
      state.activeGlobalTab = 'sinergia';
      state.appFlow = 'workspace';
      state.quickNavOpen = false;
      saveState(); render(); return;
    }
    if (e.target.id==='tab-finanzas') {
      state.activeGlobalTab = 'finanzas';
      state.appFlow = 'workspace';
      state.quickNavOpen = false;
      saveState(); render(); return;
    }
    if (e.target.id==='leave-member-btn') {
      state.activeMemberId = null;
      state.lastActiveMemberId = null;
      state.activeGlobalTab = 'portal';
      state.appFlow = 'workspace';
      saveState(); render(); return;
    }

    // Select Member
    const selectMemberBtn = e.target.closest('[data-action="select-member"]');
    if (selectMemberBtn) {
      state.activeMemberId = selectMemberBtn.dataset.mid;
      state.lastActiveMemberId = state.activeMemberId;
      state.activeGlobalTab = 'portal';
      state.memberSubTab = 'horario';
      if (window.innerWidth <= 768) {
        view.scheduleMode = 'day';
        view.activeDay = getTodayDayKey();
      }
      saveState(); render();
      showToast('¡Horario de ' + state.members[state.activeMemberId].name + ' cargado! 👋');
      return;
    }

    // Member Sub tabs
    const memQuickSwitch = e.target.closest('[data-switch-mid]');
    if (memQuickSwitch) {
      state.activeMemberId = memQuickSwitch.dataset.switchMid;
      state.lastActiveMemberId = state.activeMemberId;
      state.memberSubTab = 'horario';
      saveState(); render();
      showToast('Cambiado a horario de ' + state.members[state.activeMemberId].name + ' 👋');
      return;
    }

    const msub = e.target.closest('[data-msub]');
    if (msub) {
      state.memberSubTab = msub.dataset.msub;
      saveState(); render(); return;
    }

    // View switch for schedules (Week vs Day)
    if (e.target.id==='switch-view-week') { view.scheduleMode = 'week'; render(); return; }
    if (e.target.id==='switch-view-day') { view.scheduleMode = 'day'; render(); return; }
    const activeDayBtn = e.target.closest('[data-activeday]');
    if (activeDayBtn) { view.activeDay = activeDayBtn.dataset.activeday; render(); return; }

    const mem = getActiveMember();

    // Profile Customizer
    if (e.target.id==='edit-profile-btn' && mem) {
      showSinergiaModal({
        title: '⚙️ Configurar Perfil: ' + mem.name,
        saveLabel: 'Guardar Perfil',
        fields: [
          { id: 'name', label: 'Nombre:', value: mem.name },
          { id: 'role', label: 'Rol / Título Familiar o Profesional:', value: mem.role },
          { id: 'focus', label: 'Objetivo Principal / Frase de Enfoque:', value: mem.focusGoal || mem.defaultFocus },
          { id: 'color', label: 'Color Temático:', value: mem.color },
          { id: 'deviceHtml', label: '📱 Vinculación de este Dispositivo:', type: 'html', content: `
            <div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:4px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;margin-top:4px;">
              <div>
                <strong style="font-size:12.5px;color:var(--text-1);">Dispositivo vinculado a:</strong>
                <div style="font-size:11px;color:var(--accent);font-family:var(--mono);">${state.deviceOwner === 'all' ? '💻 Modo Administrador (Todos)' : (state.deviceOwner ? '📱 ' + (FAMILY_MEMBERS.find(m => m.id === state.deviceOwner)?.name || state.deviceOwner) : '⚪ Sin vincular')}</div>
              </div>
              <button type="button" class="hs-btn sm" id="btn-change-device-owner" style="padding:4px 9px;font-size:11px;">Cambiar</button>
            </div>
          `}
        ],
        onSave: (data) => {
          if (data.name) mem.name = data.name.trim();
          if (data.role) mem.role = data.role.trim();
          if (data.focus) mem.focusGoal = data.focus.trim();
          if (data.color) mem.color = data.color.trim();
          saveState(); render(); showToast('✓ Perfil actualizado');
        }
      });
      return;
    }

    // Alarm Sound Test & ICS Export Handlers
    if (e.target.id === 'test-alarm-sound-btn' || e.target.closest('#test-alarm-sound-btn')) {
      playAlarmChime();
      showToast('🔔 ¡Sonando tono de alarma armónico!');
      return;
    }

    if (e.target.id === 'trigger-test-task-btn' || e.target.closest('#trigger-test-task-btn')) {
      playAlarmChime();
      showToast('⏰ [ALARMA DE CELULAR] En 10 minutos inicia tu siguiente bloque de horario.');
      return;
    }

    if ((e.target.id === 'export-ics-alarm-btn' || e.target.closest('#export-ics-alarm-btn')) && mem) {
      showSyncAlarmModal(mem);
      return;
    }

    // Schedule Switcher / Creator
    if (e.target.id==='add-schedule-btn' && mem) {
      showSinergiaModal({
        title: '📅 Crear Nuevo Horario',
        saveLabel: 'Crear Horario',
        fields: [
          { id: 'name', label: 'Nombre del Horario:', placeholder: 'Ej: Horario de Exámenes, Rutina de Obras, Vacaciones' }
        ],
        onSave: (data) => {
          if (!data.name) return showToast('Ingresa un nombre para el horario', 'warn');
          const newId = genId();
          const baseDays = JSON.parse(JSON.stringify(RAW_PRESETS[mem.id] || GEANLY_RAW_DAYS));
          if (!mem.schedules) mem.schedules = [];
          mem.schedules.push({
            id: newId,
            name: data.name.trim(),
            startDate: '2026-08-25',
            endDate: '2026-12-31',
            days: baseDays
          });
          mem.activeScheduleId = newId;
          saveState(); render(); showToast('✓ Nuevo horario "' + data.name.trim() + '" creado');
        }
      });
      return;
    }

    if (e.target.id==='sch-clone-btn' && mem) {
      const sch = getSchedule(); if (!sch) return;
      showSinergiaModal({
        title: '📋 Duplicar Horario Actual',
        saveLabel: 'Duplicar Horario',
        fields: [
          { id: 'name', label: 'Nombre para la Copia:', value: 'Copia de ' + sch.name }
        ],
        onSave: (data) => {
          if (!data.name) return showToast('Ingresa un nombre', 'warn');
          const newId = genId();
          mem.schedules.push({
            id: newId,
            name: data.name.trim(),
            startDate: sch.startDate || '2026-08-25',
            endDate: sch.endDate || '2026-12-31',
            days: JSON.parse(JSON.stringify(sch.days))
          });
          mem.activeScheduleId = newId;
          saveState(); render(); showToast('✓ Horario duplicado con éxito');
        }
      });
      return;
    }

        saveLabel: 'Guardar Nombre',
        fields: [
          { id: 'name', label: 'Nuevo Nombre del Horario:', value: sch.name }
        ],

          if (!data.name) return showToast('Ingresa un nombre válido', 'warn');
          sch.name = data.name.trim();
          saveState(); render(); showToast('✓ Horario renombrado');
        }

      sch.days = JSON.parse(JSON.stringify(RAW_PRESETS[mem.id] || GEANLY_RAW_DAYS));
      saveState(); render(); showToast('✓ Plantilla base cargada');

    }

    if (e.target.id==='sch-delete-btn' && mem) {
      if (mem.schedules.length <= 1) { showToast('No puedes eliminar el único horario', 'warn'); return; }
      
      mem.schedules = mem.schedules.filter(s => s.id !== mem.activeScheduleId);
      mem.activeScheduleId = mem.schedules[0].id;
      saveState(); render(); showToast('Horario eliminado', 'warn');
      return;
    }

    // Day Tools: Copy & Clear
    if (e.target.id==='ed-copy-day' && mem) {
      const sch = getSchedule(); if (!sch) return;
      showSinergiaModal({
        title: '📋 Copiar Rutina de ' + LABELS[view.editorDay],
        saveLabel: 'Copiar Rutina',
        fields: [
          { id: 'target', label: 'Día Destino:', type: 'select', value: 'TODOS_LABORALES', options: [
            { value: 'TODOS_LABORALES', label: '📅 Lunes a Viernes (Todos los laborales)' },
            { value: 'LUNES', label: 'Lunes' },
            { value: 'MARTES', label: 'Martes' },
            { value: 'MIERCOLES', label: 'Miércoles' },
            { value: 'JUEVES', label: 'Jueves' },
            { value: 'VIERNES', label: 'Viernes' },
            { value: 'SABADO', label: 'Sábado' },
            { value: 'DOMINGO', label: 'Domingo' }
          ]}
        ],
        onSave: (data) => {
          const srcBlocks = JSON.parse(JSON.stringify(sch.days[view.editorDay] || []));
          if (data.target === 'TODOS_LABORALES') {
            ['LUNES','MARTES','MIERCOLES','JUEVES','VIERNES'].forEach(d => {
              sch.days[d] = JSON.parse(JSON.stringify(srcBlocks));
            });
            saveState(); render(); showToast('✓ Rutina copiada a Lunes-Viernes');
          } else if (ORDER.includes(data.target)) {
            sch.days[data.target] = srcBlocks;
            view.editorDay = data.target;
            saveState(); render(); showToast('✓ Rutina copiada a ' + LABELS[data.target]);
          }
        }
      });
      return;
    }

    if (e.target.id==='ed-clear-day' && mem) {
      const sch = getSchedule(); if (!sch) return;
      const curDays = getActiveEditorDays(sch);

      saveState(); render(); showToast('Día vaciado', 'warn');
      return;

    if (phaseTab) {
      view.activePhaseId = phaseTab.dataset.phaseId;
      render();
      return;
    }

    // --- MULTI-PHASE: JUMP TO PHASE IN HORARIO VIEW ---
    const phaseJump = e.target.closest('.phase-jump-btn');
    if (phaseJump) {
      const pStart = phaseJump.dataset.pstart;
      const mem = getActiveMember();
      if (mem && pStart) {
        mem.currentWeekStart = getMondayOf(new Date(pStart + 'T12:00:00'));
        saveState(); render();
        showToast('Navegado a la fecha de la fase: ' + pStart);
      }
      return;
    }

    // --- MULTI-PHASE: ADD NEW PHASE TO CURRENT SCHEDULE ---
    if (e.target.id === 'add-schedule-phase-btn' || e.target.closest('#add-schedule-phase-btn')) {
      const mem = getActiveMember();
      if (mem) {
        const sch = getSchedule();
        if (sch) {
          if (!sch.phases) sch.phases = [];
          
          const nextPhaseIdx = sch.phases.length + 1;
          let lastEnd = sch.startDate || '2026-08-25';
          if (sch.phases.length > 0) {
            const lastP = sch.phases[sch.phases.length - 1];
            if (lastP.endDate) lastEnd = lastP.endDate;
          }
          
          const sDateD = new Date(lastEnd + 'T12:00:00');
          sDateD.setDate(sDateD.getDate() + 1);
          const sDateStr = localDateStr(sDateD);

          const defaultWeeks = nextPhaseIdx === 2 ? 3 : nextPhaseIdx === 3 ? 5 : 2;
          const eDateD = new Date(sDateStr + 'T12:00:00');
          eDateD.setDate(eDateD.getDate() + (defaultWeeks * 7) - 1);
          const eDateStr = localDateStr(eDateD);

          showSinergiaModal({
            title: '➕ Agregar Nueva Etapa / Intervalo de Fechas',
            saveLabel: 'Crear Etapa',
            fields: [
              { id: 'name', label: 'Nombre de la Etapa / Rutina:', value: `Etapa ${nextPhaseIdx}: ${nextPhaseIdx === 2 ? 'Laboratorios & Prácticas' : nextPhaseIdx === 3 ? 'Exámenes & Evaluaciones' : 'Nueva Rutina'}` },
              { id: 'startDate', label: 'Fecha de Inicio (Desde):', type: 'date', value: sDateStr },
              { id: 'endDate', label: 'Fecha de Fin (Hasta):', type: 'date', value: eDateStr },
              { id: 'copyFrom', label: 'Plantilla de Bloques Horarios:', type: 'select', value: 'last', options: [
                { value: 'last', label: '📋 Copiar bloques de la etapa anterior' },
                { value: 'base', label: '🔄 Cargar plantilla base predeterminada' },
                { value: 'empty', label: '🧹 Iniciar en blanco (sin bloques)' }
              ]}
            ],
            onSave: (data) => {
              if (!data.name || !data.name.trim()) return showToast('Ingresa un nombre para la etapa', 'warn');
              const sDate = data.startDate || sDateStr;
              const eDate = data.endDate || eDateStr;

              let pDays = {};
              if (data.copyFrom === 'last' && sch.phases.length > 0) {
                pDays = JSON.parse(JSON.stringify(sch.phases[sch.phases.length - 1].days || {}));
              } else if (data.copyFrom === 'base') {
                pDays = JSON.parse(JSON.stringify(RAW_PRESETS[mem.id] || GEANLY_RAW_DAYS));
              } else {
                ORDER.forEach(d => { pDays[d] = []; });
              }

              const newPId = genId();
              sch.phases.push({
                id: newPId,
                name: data.name.trim(),
                startDate: sDate,
                endDate: eDate,
                days: pDays
              });

              // Sincronizar fecha fin global
              if (eDate > (sch.endDate || '')) {
                sch.endDate = eDate;
              }

              view.activePhaseId = newPId;
              saveState(); render();
              showToast(`🎉 ¡Etapa "${data.name.trim()}" creada del ${sDate} al ${eDate}!`);
            }
          });
        }
      }
      return;
    }

    // --- MULTI-PHASE: DELETE CURRENT PHASE ---
    if (e.target.id === 'del-phase-btn') {
      const mem = getActiveMember();
      if (mem) {
        const sch = getSchedule();
        if (sch && sch.phases && sch.phases.length > 1) {
          sch.phases = sch.phases.filter(p => p.id !== view.activePhaseId);
          view.activePhaseId = sch.phases[0].id;
          saveState(); render();
          showToast('Fase eliminada del horario', 'warn');
        }
      }
      return;
    }

    // --- MULTI-PHASE: DUPLICATE CURRENT PHASE ---
    if (e.target.id === 'clone-phase-btn') {
      const mem = getActiveMember();
      if (mem) {
        const sch = getSchedule();
        if (sch && sch.phases) {
          const curP = sch.phases.find(p => p.id === view.activePhaseId) || sch.phases[0];
          const newPId = genId();
          sch.phases.push({
            id: newPId,
            name: `Copia de ${curP.name}`,
            weeksCount: curP.weeksCount || 2,
            startDate: curP.startDate,
            endDate: curP.endDate,
            days: JSON.parse(JSON.stringify(curP.days || {}))
          });
          view.activePhaseId = newPId;
          saveState(); render();
          showToast('✓ Fase duplicada con éxito');
        }
      }
      return;
    }

    // --- MULTI-PERIOD SCHEDULE: SELECT PERIOD TO EDIT ---
    const schCard = e.target.closest('.sch-timeline-card');
    if (schCard && !e.target.closest('.del-sch-period-btn')) {
      const schId = schCard.dataset.schId;
      const mem = getActiveMember();
      if (mem && schId) {
        mem.activeScheduleId = schId;
        saveState(); render();
        showToast('Cargado para edición: ' + (getSchedule()?.name || 'Horario'));
      }
      return;
    }

    // --- MULTI-PERIOD SCHEDULE: DELETE PERIOD ---
    const delSchPeriod = e.target.closest('.del-sch-period-btn');
    if (delSchPeriod) {
      const schId = delSchPeriod.dataset.schId;
      const mem = getActiveMember();
      if (mem && mem.schedules.length > 1) {
        mem.schedules = mem.schedules.filter(s => s.id !== schId);
        if (mem.activeScheduleId === schId) {
          mem.activeScheduleId = mem.schedules[0].id;
        }
        saveState(); render();
        showToast('Periodo de horario eliminado', 'warn');
      }
      return;
    }

    // --- MULTI-PERIOD SCHEDULE: ADD NEW PERIOD MODAL ---
    if (e.target.id === 'add-schedule-period-btn' || e.target.closest('#add-schedule-period-btn')) {
      const mem = getActiveMember();
      if (mem) {
        // Calculate smart suggested start date (day after the last schedule ends)
        let maxEnd = '2026-08-25';
        (mem.schedules || []).forEach(s => {
          if (s.endDate && s.endDate > maxEnd) maxEnd = s.endDate;
        });
        const nextStartD = new Date(maxEnd + 'T12:00:00');
        nextStartD.setDate(nextStartD.getDate() + 1);
        const nextStart = localDateStr(nextStartD);
        
        const nextEndD = new Date(nextStart + 'T12:00:00');
        nextEndD.setDate(nextEndD.getDate() + 14); // 2 weeks default
        const nextEnd = localDateStr(nextEndD);

        showSinergiaModal({
          title: '🗓️ Programar Nuevo Periodo de Horario',
          saveLabel: '➕ Crear Periodo',
          fields: [
            { id: 'name', label: 'Nombre del Horario / Actividad:', placeholder: 'Ej: Semana de Exámenes, Rutina Especial, Vacaciones' },
            { id: 'periodName', label: 'Periodo / Semestre:', value: 'Periodo Especial (' + nextStart.slice(5) + ')' },
            { id: 'startDate', label: 'Fecha de Inicio:', type: 'date', value: nextStart },
            { id: 'endDate', label: 'Fecha de Fin:', type: 'date', value: nextEnd },
            { id: 'copyFrom', label: 'Plantilla de Bloques Horarios:', type: 'select', value: 'current', options: [
              { value: 'current', label: '📋 Copiar bloques del horario actual' },
              { value: 'base', label: '🔄 Cargar plantilla base predeterminada' },
              { value: 'empty', label: '🧹 Iniciar en blanco (sin bloques)' }
            ]}
          ],
          onSave: (data) => {
            if (!data.name || !data.name.trim()) return showToast('Escribe un nombre para el horario', 'warn');
            
            let daysBlocks = {};
            const curSch = getSchedule();
            if (data.copyFrom === 'current' && curSch && curSch.days) {
              daysBlocks = JSON.parse(JSON.stringify(curSch.days));
            } else if (data.copyFrom === 'base') {
              daysBlocks = JSON.parse(JSON.stringify(RAW_PRESETS[mem.id] || GEANLY_RAW_DAYS));
            } else {
              ORDER.forEach(d => { daysBlocks[d] = []; });
            }

            const newId = genId();
            mem.schedules.push({
              id: newId,
              name: data.name.trim(),
              periodName: (data.periodName || 'Periodo').trim(),
              startDate: data.startDate || nextStart,
              endDate: data.endDate || nextEnd,
              days: daysBlocks
            });
            mem.activeScheduleId = newId;
            saveState(); render();
            showToast('🎉 ¡Nuevo periodo "' + data.name.trim() + '" creado!');
          }
        });
      }
      return;
    }

    // --- TIME PICKER (RELOJ 🕐 & RUEDA TÁCTIL) ---
    const timeBtn = e.target.closest('.modal-open-time-btn, .hs-editor-time-btn');
    if (timeBtn) {
      if (timeBtn.dataset.target) {
        openTimeWheelPicker(timeBtn.dataset.target);
      } else {
        const col = timeBtn.closest('.hs-editor-time-col');
        const inp = col ? col.querySelector('.ed-time-val') : null;
        if (inp) openTimeWheelPicker(inp);
      }
      return;
    }
    if (e.target.matches('.ed-time-val')) {
      openTimeWheelPicker(e.target);
      return;
    }

    // --- DYNAMIC MINI CALENDAR PICKER TRIGGER ---
    const openCalBtn = e.target.closest('.modal-open-cal-btn');
    if (openCalBtn) {
      openMiniCalendar(openCalBtn.dataset.target);
      return;
    }
    if (e.target.id === 'sch-start-date') {
      openMiniCalendar('sch-start-date');
      return;
    }
    if (e.target.id === 'sch-end-date') {
      openMiniCalendar('sch-end-date');
      return;
    }
    if (e.target.id === 'cur-phase-start') {
      openMiniCalendar('cur-phase-start');
      return;
    }
    if (e.target.id === 'cur-phase-end') {
      openMiniCalendar('cur-phase-end');
      return;
    }

    // --- GO TO VALID SCHEDULE RANGE ---
    if (e.target.id === 'go-to-valid-schedule-range' || e.target.closest('#go-to-valid-schedule-range')) {
      const mem = getActiveMember();
      if (mem) {
        const sch = getSchedule();
        if (sch && sch.startDate) {
          mem.currentWeekStart = getMondayOf(new Date(sch.startDate + 'T12:00:00'));

          showToast('Navegado al periodo de vigencia: ' + sch.startDate);
        }
      }
      return;
    }

    // --- SCHEDULE EDITOR: APPLY & ACTIVATE SCHEDULE IN INTERVAL ---
    if (e.target.id === 'apply-schedule-interval-btn' || e.target.closest('#apply-schedule-interval-btn')) {
      const mem = getActiveMember();
      if (mem) {
        const sch = getSchedule();
        if (sch) {
          const sInp = document.getElementById('sch-start-date');
          const eInp = document.getElementById('sch-end-date');
          const pInp = document.getElementById('sch-period-name');
          
          if (sInp && sInp.value) sch.startDate = sInp.value;
          if (eInp && eInp.value) sch.endDate = eInp.value;
          if (pInp && pInp.value) sch.periodName = pInp.value.trim();
          
          mem.activeScheduleId = sch.id;
          
          const sDate = sch.startDate || '2026-08-01';
          const eDate = sch.endDate || '2026-12-31';
          const today = localDateStr(new Date());
          
          if (today >= sDate && today <= eDate) {
            mem.currentWeekStart = getMondayOf(new Date());
          } else {
            mem.currentWeekStart = getMondayOf(new Date(sDate + 'T12:00:00'));
          }

          state.memberSubTab = 'horario';
          saveState();
          render();
          showToast(`🎉 ¡Horario "${sch.name}" cargado y activado del ${sDate} al ${eDate}!`);
        }
      }
      return;
    }

    // --- SCHEDULE EDITOR: ADD BLOCK ---
    if (e.target.id === 'ed-add-block' || e.target.closest('#ed-add-block')) {
      const mem = getActiveMember();
      if (mem) {
        const sch = getSchedule();
        if (sch) {
          const day = view.editorDay || 'LUNES';
          const curDays = getActiveEditorDays(sch);
          if (!curDays[day]) curDays[day] = [];
          
          let nextStart = '08:00', nextEnd = '09:00';
          const blocks = curDays[day];
          if (blocks.length > 0) {
            const last = blocks[blocks.length - 1];
            nextStart = last[1] === '24:00' ? '20:00' : last[1];
            const [h, m] = nextStart.split(':').map(Number);
            const endH = Math.min(23, h + 1);
            nextEnd = String(endH).padStart(2, '0') + ':' + String(m).padStart(2, '0');
            if (nextEnd <= nextStart) nextEnd = '23:59';
          }
          
          const catKeys = Object.keys(getMemberCategories());
          const cat = catKeys[0] || 'ESTUDIO';
          curDays[day].push([nextStart, nextEnd, 'Nueva Actividad', cat]);
          saveState(); render();
          showToast('✓ Bloque agregado al ' + LABELS[day]);
        }
      }
      return;
    }

    const edDel = e.target.closest('.ed-del');
    if (edDel && mem) {
      const sch = getSchedule();
      if (sch) {
        const d = edDel.dataset.d || view.editorDay;
        const idx = parseInt(edDel.dataset.i, 10);
        const curDays = getActiveEditorDays(sch);
        if (curDays[d] && curDays[d][idx] !== undefined) {
          curDays[d].splice(idx, 1);
          saveState(); render();
          showToast('Bloque eliminado del horario', 'warn');
        }
      }
      return;
    }

    // --- SCHEDULE EDITOR: DAY SELECTOR TABS ---
    const edDayBtn = e.target.closest('.hs-editor-daybtn');
    if (edDayBtn) {
      view.editorDay = edDayBtn.dataset.d;
      render();
      return;
    }

    // --- PIPELINE: DELETE PROJECT ---
    const projDel = e.target.closest('.proj-del-btn');
    if (projDel) {
      const pid = projDel.dataset.pid;
      if (state.sinergia && state.sinergia.projects) {
        state.sinergia.projects = state.sinergia.projects.filter(p => p.id !== pid);
        saveState(); render();
        showToast('Proyecto eliminado del pipeline', 'warn');
      }
      return;
    }


    // --- POMODORO: PRESET BUTTONS ---
    const pomoPreset = e.target.closest('.pomo-preset-btn');
    if (pomoPreset) {
      const mins = +pomoPreset.dataset.mins;
      if (mins) {
        if (!state.pomoConfig) state.pomoConfig = { focusMins: 45, breakMins: 10, longBreakMins: 20 };
        state.pomoConfig.focusMins = mins;
        pomo.remaining = mins * 60;
        pomo.total = mins * 60;
        saveState(); render();
        showToast(`Temporizador ajustado a ${mins} min`);
      }
      return;
    }

    if (e.target.id==='add-category-btn' && mem) {
      showSinergiaModal({
        title: '🏷️ Crear Nueva Categoría de Horario',
        saveLabel: 'Crear Categoría',
        fields: [
          { id: 'name', label: 'Nombre de la Categoría:', placeholder: 'Ej: Taller de Arte, Inglés, Tesis, Entrenamiento' },
          { id: 'color', label: 'Color (Hexadecimal):', value: '#7c6cff' }
        ],
        onSave: (data) => {
          if (!data.name) return showToast('Ingresa un nombre', 'warn');
          const code = data.name.trim().toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 10) || ('CAT' + Date.now().toString().slice(-4));
          if (!mem.categories) mem.categories = {};
          mem.categories[code] = { c: (data.color || '#7c6cff').trim(), n: data.name.trim() };
          saveState(); render(); showToast('✓ Categoría "' + data.name.trim() + '" agregada');
        }
      });
      return;
    }
    const catDelBtn = e.target.closest('.cat-del-btn');
    if (catDelBtn && mem) {
      const k = catDelBtn.dataset.cat;
      if (Object.keys(mem.categories).length <= 1) { showToast('Debes tener al menos 1 categoría', 'warn'); return; }
      if (!confirm('¿Eliminar la categoría "' + (mem.categories[k]?.n || k) + '"?')) return;
      delete mem.categories[k];
      saveState(); render(); showToast('Categoría eliminada', 'warn');
      return;
    }

    // Quick edit block on schedule
    const qEdit = e.target.closest('.quick-edit-block');
    if (qEdit && mem) {
      const d = qEdit.dataset.d, i = +qEdit.dataset.i;
      const sch = getSchedule();
      if (sch && sch.days[d] && sch.days[d][i]) {
        const b = sch.days[d][i];
        const cats = getMemberCategories();
        const catOpts = Object.keys(cats).map(k => ({ value: k, label: cats[k].n || k }));
        showSinergiaModal({
          title: '✏️ Editar Actividad del Horario',
          saveLabel: 'Guardar Actividad',
          fields: [
            { id: 'label', label: 'Nombre de la Actividad:', value: b[2] },
            { id: 'cat', label: 'Categoría:', type: 'select', value: b[3] || Object.keys(cats)[0], options: catOpts },
            { id: 'start', label: 'Hora Inicio (HH:MM):', value: b[0] },
            { id: 'end', label: 'Hora Fin (HH:MM):', value: b[1] }
          ],
          onSave: (data) => {
            if (data.label) b[2] = data.label.trim();
            if (data.cat) b[3] = data.cat;
            if (data.start) b[0] = data.start.trim();
            if (data.end) b[1] = data.end.trim();
            saveState(); render(); showToast('✓ Actividad actualizada');
          }
        });
      }
      return;
    }

    // Print member schedule A4
    if (e.target.id==='print-schedule-btn' && mem) {
      printMemberSchedulePDF(mem);
      return;
    }

    // Week Nav
    if (mem && e.target.id==='week-prev') {
      const ws = new Date(mem.currentWeekStart+'T12:00:00'); ws.setDate(ws.getDate()-7);
      mem.currentWeekStart = localDateStr(ws); saveState(); render(); return;
    }
    if (mem && e.target.id==='week-next') {
      const ws = new Date(mem.currentWeekStart+'T12:00:00'); ws.setDate(ws.getDate()+7);
      mem.currentWeekStart = localDateStr(ws); saveState(); render(); return;
    }
    if (mem && e.target.id==='week-today') {
      mem.currentWeekStart = getMondayOf(new Date()); saveState(); render(); return;
    }

    // Schedule Block Click (Toggle Done)
    const block = e.target.closest('[data-key]');
    if (block && mem && !e.target.closest('.quick-edit-block')) {
      const key = block.dataset.key;
      const ws = getWeekState();
      if (ws.done[key]) delete ws.done[key]; else ws.done[key] = true;
      saveState(); render();
      showToast(ws.done[key] ? '✓ Actividad completada' : 'Desmarcado');
      return;
    }

    // Pomodoro Presets
    const presetBtn = e.target.closest('[data-setmins]');
    if (presetBtn) {
      const m = +presetBtn.dataset.setmins;
      state.pomoConfig.focusMins = m;
      saveState();
      pomoReset();
      showToast('⏱️ Tiempo de enfoque ajustado a ' + m + ' min');
      return;
    }
    if (e.target.id==='apply-pomo-config') {
      const fM = +document.getElementById('custom-focus-mins').value || 25;
      const bM = +document.getElementById('custom-break-mins').value || 5;
      state.pomoConfig.focusMins = fM;
      state.pomoConfig.breakMins = bM;
      saveState();
      pomoReset();
      showToast('⏱️ Temporizador configurado: ' + fM + 'm enfoque / ' + bM + 'm descanso');
      return;
    }
    if (e.target.id==='pomo-start') { pomoToggle(); return; }
    if (e.target.id==='pomo-reset') { pomoReset(); return; }

    // Priorities
    if (e.target.id==='add-todo-btn' && mem) {
      const inp = document.getElementById('new-todo-text');
      if (inp && inp.value.trim()) {
        if (!mem.priorities) mem.priorities = [];
        mem.priorities.push({ id: genId(), text: inp.value.trim(), done: false });
        inp.value = ''; saveState(); render(); showToast('+ Prioridad agregada');
      }
      return;
    }
    const todoDel = e.target.closest('.hs-todo-del');
    if (todoDel && mem) {
      
      mem.priorities.splice(+todoDel.dataset.idx, 1); saveState(); render(); return;
    }

    // Habit Goals
    if (e.target.id==='add-habit-btn' && mem) {
      showSinergiaModal({
        title: '🔥 Registrar Nueva Meta de Hábito',
        saveLabel: 'Crear Hábito',
        fields: [
          { id: 'text', label: 'Meta o Hábito Semanal a Desarrollar:', placeholder: 'Ej: Estudiar 2 horas diarias, Gimnasio 4x/semana' },
          { id: 'target', label: 'Frecuencia / Meta Objetivo:', placeholder: 'Ej: 5 días/sem, 10 pomodoros, 30 min/día', value: 'Semanal' }
        ],
        onSave: (data) => {
          if (!data.text) return showToast('Ingresa la meta de hábito', 'warn');
          if (!mem.habits) mem.habits = [];
          mem.habits.push({ id: genId(), text: data.text.trim(), target: (data.target || 'Semanal').trim(), count: 0 });
          saveState(); render(); showToast('✓ Meta de hábito agregada');
        }
      });
      return;
    }
    const habitInc = e.target.closest('.habit-inc');
    if (habitInc && mem) {
      const idx = +habitInc.dataset.i;
      if (mem.habits && mem.habits[idx]) {
        mem.habits[idx].count = (mem.habits[idx].count || 0) + 1;
        saveState(); render();
      }
      return;
    }
    const habitDec = e.target.closest('.habit-dec');
    if (habitDec && mem) {
      const idx = +habitDec.dataset.i;
      if (mem.habits && mem.habits[idx]) {
        mem.habits[idx].count = Math.max(0, (mem.habits[idx].count || 0) - 1);
        saveState(); render();
      }
      return;
    }
    const habitDel = e.target.closest('.habit-del');
    if (habitDel && mem) {
      
      mem.habits.splice(+habitDel.dataset.i, 1);
      saveState(); render(); return;

    // Drive Vault: Add, Edit & Delete custom folders

      showSinergiaModal({

        saveLabel: 'Guardar Carpeta',
        fields: [
          { id: 'name', label: 'Nombre de la Carpeta:', placeholder: 'Ej: 📚 Álgebra Lineal & Ejercicios, 📐 Modelos 3D Estructurales' },
          { id: 'category', label: 'Categoría o Etiqueta:', placeholder: 'Ej: Académico, Sinergia, Obras, Hogar, Deporte', value: 'General' },
          { id: 'desc', label: 'Descripción del Contenido:', placeholder: 'Documentos y archivos en Google Drive' },
          { id: 'url', label: 'Enlace URL a Google Drive (5 TB):', placeholder: 'https://drive.google.com', value: 'https://drive.google.com' }
        ],
        onSave: (data) => {
          if (!data.name) return showToast('Ingresa el nombre de la carpeta', 'warn');
          if (!mem.driveVault) mem.driveVault = [];
          mem.driveVault.push({
            id: genId(),
            name: data.name.trim(),
            category: (data.category || 'General').trim(),
            desc: (data.desc || '').trim(),
            url: (data.url || 'https://drive.google.com').trim()
          });
          saveState(); render(); showToast('✓ Carpeta agregada a tu Bóveda Drive');
        }
      });

    const memDriveEdit = e.target.closest('.mem-drive-edit');

      if (f) {

          fields: [
            { id: 'name', label: 'Nombre de la Carpeta:', value: f.name },
            { id: 'category', label: 'Categoría / Etiqueta:', value: f.category || 'General' },
            { id: 'desc', label: 'Descripción del Contenido:', value: f.desc || '' },
            { id: 'url', label: 'Enlace URL de Google Drive:', value: f.url || '' }
          ],
          onSave: (data) => {
            f.name = data.name || f.name;
            f.category = data.category || f.category;
            f.desc = data.desc || f.desc;
            f.url = data.url || f.url;
            saveState(); render(); showToast('✓ Carpeta modificada con éxito');
          }
        });
      }
      return;
    }
    const memDriveDel = e.target.closest('.mem-drive-del');
    if (memDriveDel && mem) {
      
      mem.driveVault.splice(+memDriveDel.dataset.i, 1);
      saveState(); render(); showToast('Carpeta eliminada de la bóveda', 'warn');
      return;
    }

    if (e.target.id==='add-field-note') {
      showSinergiaModal({
        title: '📝 Registrar Visita / Nota de Obra en Bitácora',
        saveLabel: 'Guardar Registro',

  function exportMaterialsCSV() {
    const mats = state.sinergiaMaterials || [];
    if (!mats.length) {
      showToast('No hay insumos registrados para exportar', 'warn');
      return;
    }
    const headers = ['Categoría', 'Insumo / Color / Modelo', 'Marca', 'Especificación', 'Unidad', 'Precio (S/.)', 'Proveedor', 'Notas'];
    const rows = mats.map(m => [
      `"${(m.cat||'').replace(/"/g, '""')}"`,
      `"${(m.name||'').replace(/"/g, '""')}"`,
      `"${(m.brand||'').replace(/"/g, '""')}"`,
      `"${(m.spec||'').replace(/"/g, '""')}"`,
      `"${(m.unit||'').replace(/"/g, '""')}"`,
      (+m.price||0).toFixed(2),
      `"${(m.supplier||'').replace(/"/g, '""')}"`,
      `"${(m.notes||'').replace(/"/g, '""')}"`
    ]);

    const csvContent = '\uFEFF' + [headers.join(','), ...rows.map(r => r.join(','))].join('\r\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.setAttribute('href', url);
    link.setAttribute('download', `Tarifario_Sinergia_Studio_${localDateStr(new Date()).replace(/\//g,'-')}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    showToast('📥 Tarifario exportado en formato Excel (.csv)');
  }

  function recalcQuote() {
    const cart = state.sinergiaCart || [];
    const moMethod = document.getElementById('calc-mo-method')?.value || 'factor';
    const moFactor = +(document.getElementById('calc-mo-factor')?.value || 1.55);
    const disenoPrice = +(document.getElementById('calc-diseno')?.value || 450);
    const adelantoPct = +(document.getElementById('calc-adelanto-pct')?.value || 50);

    const fin = calculateSinergiaFinancials(cart, {
      moMethod,
      moFactor,
      disenoPrice,
      adelantoPct
    });

    const sMel = document.getElementById('sum-melamina');
    const sHer = document.getElementById('sum-herrajes');
    const sCz = document.getElementById('sum-cuarzo');
    const sLed = document.getElementById('sum-led');
    const sExtras = document.getElementById('sum-extras');
    const sMatTot = document.getElementById('sum-mat-total');
    const sDis = document.getElementById('sum-diseno');
    const sMO = document.getElementById('sum-mo');
    const sTot = document.getElementById('sum-total');
    const sAde = document.getElementById('sum-adelanto');
    const sSal = document.getElementById('sum-saldo');
    const moLbl = document.getElementById('calc-mo-label');

    if (moLbl) {
      moLbl.textContent = moMethod === 'factor' ? 'Factor Melamina (ej. 1.55):' : '% Mano de Obra (ej. 40%):';
    }

    if (sMel) sMel.textContent = 'S/. ' + fin.costMel.toFixed(2);
    if (sHer) sHer.textContent = 'S/. ' + fin.costHerrajes.toFixed(2);
    if (sCz) sCz.textContent = 'S/. ' + fin.costCz.toFixed(2);
    if (sLed) sLed.textContent = 'S/. ' + fin.costLed.toFixed(2);
    if (sExtras) sExtras.textContent = 'S/. ' + fin.costExtras.toFixed(2);
    if (sMatTot) sMatTot.textContent = 'S/. ' + fin.costMatTotal.toFixed(2);
    if (sDis) sDis.textContent = 'S/. ' + fin.disenoPrice.toFixed(2);
    if (sMO) sMO.textContent = 'S/. ' + fin.costMO.toFixed(2);
    if (sTot) sTot.textContent = 'S/. ' + fin.grandTotal.toFixed(2);
    if (sAde) sAde.textContent = 'S/. ' + fin.adelantoVal.toFixed(2);
    if (sSal) sSal.textContent = 'S/. ' + fin.saldoVal.toFixed(2);
  }

    function handleChange(e) {
    const mem = getActiveMember();

      const ex = (mem.exams || []).find(x => x.id === e.target.dataset.id);

        ex.done = e.target.checked;
        saveState();
        render();
        showToast(ex.done ? '✓ ¡Actividad completada!' : 'Actividad marcada como pendiente');
      }
      return;
    }
    if (mem) {
      const sch = getSchedule();
      if (sch) {
        if (e.target.id === 'sch-start-date' || e.target.id === 'sch-end-date') {
          if (e.target.id === 'sch-start-date') sch.startDate = e.target.value;
          if (e.target.id === 'sch-end-date') sch.endDate = e.target.value;
          saveState();
          const badge = document.getElementById('sch-range-badge');
          if (badge) {
            badge.innerHTML = 'Intervalo: <strong style="color:var(--accent);">' + (sch.startDate || '—') + '</strong> al <strong style="color:var(--accent);">' + (sch.endDate || '—') + '</strong>';
          }
          return;

        if (e.target.id === 'cur-phase-name') {
          if (sch.phases && view.activePhaseId) {
            const p = sch.phases.find(x => x.id === view.activePhaseId);
            if (p) { p.name = e.target.value; saveState(); }
          }
          return;
        }
        if (e.target.id === 'cur-phase-start' || e.target.id === 'cur-phase-end') {
          if (sch.phases && view.activePhaseId) {
            const p = sch.phases.find(x => x.id === view.activePhaseId);

              if (e.target.id === 'cur-phase-end') p.endDate = e.target.value;

    }

    if (e.target.id === 'finanzas-search-input') {
      view.finanzasSearch = e.target.value;
      render();
      const inp = document.getElementById('finanzas-search-input');
      if (inp) {
        inp.focus();
        inp.setSelectionRange(inp.value.length, inp.value.length);
      }
      return;
    }

    if (e.target.closest('#sim-item-name, #sim-item-cost, #sim-item-pct')) {
      if (!state.household.simulador) state.household.simulador = {};
      const nameInp = document.getElementById('sim-item-name');
      const costInp = document.getElementById('sim-item-cost');
      const pctInp = document.getElementById('sim-item-pct');
      if (nameInp) state.household.simulador.name = nameInp.value;
      if (costInp) state.household.simulador.cost = cleanNum(costInp.value, 3200);
      if (pctInp) state.household.simulador.dedicationPct = cleanNum(pctInp.value, 50);
      saveState();
      render();
      const activeEl = document.getElementById(e.target.id);
      if (activeEl && activeEl.focus) {
        activeEl.focus();
        if (activeEl.setSelectionRange && activeEl.value) {
          activeEl.setSelectionRange(activeEl.value.length, activeEl.value.length);
        }
      }
      return;
    }

    if (e.target.matches('.mat-price-edit')) {
      const m = (state.sinergiaMaterials||[]).find(x => x.id === e.target.dataset.id);
      if (m) {
        m.price = cleanNum(e.target.value, 0);
        saveState();
      }
      return;
    }

    if (e.target.matches('.cart-qty-input')) {
      const idx = +e.target.dataset.i;
      if (state.sinergiaCart && state.sinergiaCart[idx]) {
        state.sinergiaCart[idx].qty = cleanNum(e.target.value, 0);
        saveState(); recalcQuote();
      }
      return;
    }

    if (e.target.matches('.cart-price-input')) {
      const idx = +e.target.dataset.i;
      if (state.sinergiaCart && state.sinergiaCart[idx]) {
        state.sinergiaCart[idx].price = cleanNum(e.target.value, 0);
        saveState(); recalcQuote();
      }
      return;
    }

    if (e.target.id === 'calc-mo-method') {
      const moLbl = document.getElementById('calc-mo-label');
      const moInp = document.getElementById('calc-mo-factor');
      if (e.target.value === 'factor') {
        if (moLbl) moLbl.textContent = 'Factor Melamina (ej. 1.55):';
        if (moInp && +moInp.value > 10) moInp.value = '1.55';
      } else {
        if (moLbl) moLbl.textContent = '% Mano de Obra (ej. 40%):';
        if (moInp && +moInp.value < 5) moInp.value = '40';
      }
      recalcQuote();
      return;
    }

    if (e.target.closest('#calc-mo-factor, #calc-diseno, #calc-adelanto-pct, #calc-dias-entrega')) {
      recalcQuote();
      return;
    }

    if (mem && e.target.id === 'sch-selector') {
      mem.activeScheduleId = e.target.value;
      saveState(); render();
      showToast('Horario activo cambiado');
      return;
    }
    if (mem && e.target.matches('.cat-color-picker')) {
      const k = e.target.dataset.cat;
      if (mem.categories && mem.categories[k]) {
        mem.categories[k].c = e.target.value;
        saveState();
      }
      return;
    }
    if (mem && e.target.matches('.cat-name-input')) {
      const k = e.target.dataset.cat;
      if (mem.categories && mem.categories[k]) {
        mem.categories[k].n = e.target.value.trim();
        saveState();
      }
      return;
    }
    if (mem && e.target.matches('.todo-check')) {
      mem.priorities[+e.target.dataset.idx].done = e.target.checked;
      saveState(); render(); return;
    }
    if (mem && e.target.matches('.mem-drive-input')) {
      const idx = +e.target.dataset.i;
      if (mem.driveVault && mem.driveVault[idx]) {
        mem.driveVault[idx].url = e.target.value.trim();
        saveState();
      }
      return;
    }
    if (e.target.matches('.proj-stage-change')) {
      const p = state.sinergia.projects.find(x => x.id === e.target.dataset.pid);
      if (p) { p.stage = e.target.value; saveState(); render(); showToast('Estado del proyecto actualizado'); }
      return;
    }
    if (e.target.matches('.df-url')) {
      state.sinergia.driveFolders[+e.target.dataset.i].url = e.target.value;
      saveState(); return;
    }
    if (e.target.matches('.course-drive')) {
      state.academic.courses[+e.target.dataset.i].driveUrl = e.target.value;
      saveState(); return;
    }

    if (mem) {
      const sch = getSchedule(); if (!sch) return;
      if (e.target.matches('.ed-start')) { const tDays = (sch.phases && view.activePhaseId ? (sch.phases.find(p=>p.id===view.activePhaseId)||{}).days : null) || sch.days; (tDays[e.target.dataset.d]||[])[+e.target.dataset.i][0] = e.target.value; saveState(); return; }
      if (e.target.matches('.ed-end')) {
        let v = e.target.value; if(v==='23:59') v='24:00';
        const tDays = (sch.phases && view.activePhaseId ? (sch.phases.find(p=>p.id===view.activePhaseId)||{}).days : null) || sch.days; (tDays[e.target.dataset.d]||[])[+e.target.dataset.i][1] = v; saveState(); return;
      }
      if (e.target.matches('.ed-label')) { (sch.days[e.target.dataset.d]||[])[+e.target.dataset.i][2] = e.target.value; saveState(); return; }
      if (e.target.matches('.ed-cat')) { const tDays = (sch.phases && view.activePhaseId ? (sch.phases.find(p=>p.id===view.activePhaseId)||{}).days : null) || sch.days; (tDays[e.target.dataset.d]||[])[+e.target.dataset.i][3] = e.target.value; saveState(); render(); return; }
    }

    if (e.target.id==='restore-json-input') {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          state = JSON.parse(evt.target.result);
          saveState(); applyTheme(); render();
          showToast('✓ Backup restaurado');
        } catch(err){ showToast('Archivo inválido', 'warn'); }
      };
      reader.readAsText(file);
    }
  }

    document.addEventListener('click', function(e) {
      try { handleClick(e); } catch(err) { console.error('Click error:', err); }
    });
    document.addEventListener('change', function(e) {
      try { handleChange(e); } catch(err) { console.error('Change error:', err); }
    });
    document.addEventListener('input', function(e) {
      try {
        handleChange(e);
        // Debounce automático para inputs de texto largos y búsquedas
        if (e.target.matches('input[type="text"], textarea, .cat-name-input')) {
          debounceSave(400);
        }
      } catch(err) { console.error('Input error:', err); }
    });

    // Atajos de teclado globales (Ctrl + M: Menú rápido ☰, Escape: Cerrar modal/menú)
    window.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        const modal = document.getElementById('smodal-backdrop');
        if (modal) {
          hideSinergiaModal();
          return;
        }
        if (state.quickNavOpen) {
          state.quickNavOpen = false;
          render();
          return;
        }
      }
      if ((e.ctrlKey || e.altKey || e.metaKey) && (e.key === 'm' || e.key === 'M')) {
        e.preventDefault();
        state.quickNavOpen = !state.quickNavOpen;
        render();
      }
    });
    
    window.addEventListener('error', function(e) {
      console.warn('App error intercepted:', e.message);
    });

    loadState();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(reg => {
          reg.update();
        }).catch(()=>{});
      });
    }

  })();
  </script>
</body>
</html>
