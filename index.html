            <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${cInfo.c};flex-shrink:0;opacity:0.4;"></span>
            <span style="font-weight:600;text-decoration:line-through;">${esc(cInfo.n)}</span>
            <span style="font-size:9.5px;font-family:var(--mono);color:${otherGrp.color};margin-left:auto;font-weight:700;">(${esc(otherGrp.name.split(' ')[1] || otherGrp.name)})</span>
          </label>
        `;
      } else {
        catCheckboxesHtml += `
          <label style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-1);cursor:pointer;padding:4px 8px;border-radius:4px;background:var(--bg-elevated);border:1px solid var(--border);transition:all 0.15s ease;">
            <input type="checkbox" class="grp-cat-checkbox" value="${ck}" ${isChecked ? 'checked' : ''}>
            <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${cInfo.c};flex-shrink:0;"></span>
            <span style="font-weight:600;">${esc(cInfo.n)}</span>
          </label>
        `;
      }
    });
    catCheckboxesHtml += '</div>';

    // 2. Pure Visual Swatch Palette (20 Colors) - Zero text, no duplicates allowed!
    const PALETTE_COLORS = [
      '#3b82f6', '#DAAF37', '#10b981', '#8b5cf6', '#ef4444', 
      '#06b6d4', '#f59e0b', '#ec4899', '#6366f1', '#4A7C59', 
      '#4A6984', '#8C7355', '#8C6350', '#8C6D75', '#5A7365', 
      '#64748b', '#0ea5e9', '#e11d48', '#84cc16', '#d97706'
    ];

    // Check taken colors from other groups
    const takenColors = mem.activityGroups
      .filter((g, idx) => (editIndex === null || idx !== editIndex))
      .map(g => (g.color || '').toLowerCase());

    // If currently selected color is taken (e.g. initial fallback), choose first free color
    let initialColor = grp.color || '#3b82f6';
    if (takenColors.includes(initialColor.toLowerCase())) {
      const freeColor = PALETTE_COLORS.find(c => !takenColors.includes(c.toLowerCase()));
      if (freeColor) initialColor = freeColor;
    }

    let swatchesHtml = '<div style="display:flex;gap:10px;flex-wrap:wrap;padding:10px;background:var(--bg-surface);border:1px solid var(--border);border-radius:6px;" id="swatch-picker-container">';
    
    PALETTE_COLORS.forEach(c => {
      const isTaken = takenColors.includes(c.toLowerCase());
      const isSel = (c.toLowerCase() === initialColor.toLowerCase());

      if (isTaken) {
        swatchesHtml += `
          <div class="color-swatch-circle taken" style="width:34px;height:34px;border-radius:50%;background:${c};opacity:0.25;cursor:not-allowed;position:relative;display:flex;align-items:center;justify-content:center;border:1px dashed rgba(255,255,255,0.4);" title="Color ya utilizado en otro grupo">
            <span style="color:#fff;font-size:12px;font-weight:900;">✕</span>
          </div>
        `;
      } else {
        swatchesHtml += `
          <div class="color-swatch-circle available ${isSel ? 'selected' : ''}" data-swatch-color="${c}" style="width:34px;height:34px;border-radius:50%;background:${c};cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s ease;box-shadow:${isSel ? '0 0 0 3px var(--bg-surface), 0 0 0 6px ' + c : 'none'};transform:${isSel ? 'scale(1.12)' : 'scale(1)'};" title="Seleccionar este color">
            <span class="swatch-check" style="color:#fff;font-size:13px;font-weight:900;display:${isSel ? 'block' : 'none'};">✓</span>
          </div>
        `;
      }
    });

    swatchesHtml += `<input type="hidden" id="selected-grp-color" value="${initialColor}"></div>`;

    showSinergiaModal({
      title: isEdit ? '✏️ Editar Grupo de Actividades' : '➕ Crear Nuevo Grupo de Actividades',
      saveLabel: 'Guardar Grupo',
      fields: [
        { id: 'name', label: 'Nombre del Grupo (ej: 🎓 Ciclo 2026-II, 🛠️ Obras Huancayo):', value: grp.name, placeholder: 'Nombre del grupo...' },
        { id: 'colorSwatches', label: 'Color del Grupo (selecciona un color disponible):', type: 'html', content: swatchesHtml },
        { id: 'catSelect', label: 'Selecciona las Actividades para este grupo (las ya asignadas aparecen tachadas):', type: 'html', content: catCheckboxesHtml }
      ],
      onSave: (data) => {
        if (!data.name || !data.name.trim()) return showToast('Ingresa un nombre para el grupo', 'warn');
        
        // Collect checked category keys
        const selKeys = [];
        document.querySelectorAll('.grp-cat-checkbox:checked').forEach(inp => {
          selKeys.push(inp.value);
        });

        const colorInput = document.getElementById('selected-grp-color');
        const finalColor = colorInput ? colorInput.value : (grp.color || '#3b82f6');

        grp.name = data.name.trim();
        grp.color = finalColor;
        grp.catKeys = selKeys;

        if (!isEdit) {
          mem.activityGroups.push(grp);
        }

        saveState();
        showToast('✓ Grupo "' + grp.name + '" guardado');
        setTimeout(() => showManageActivityGroupsModal(mem), 50);
      }
    });

    // Attach swatch click handler
    setTimeout(() => {
      const container = document.getElementById('swatch-picker-container');
      const hiddenInput = document.getElementById('selected-grp-color');
      if (container && hiddenInput) {
        container.querySelectorAll('.color-swatch-circle.available').forEach(sw => {
          sw.onclick = () => {
            const chosen = sw.dataset.swatchColor;
            hiddenInput.value = chosen;
            container.querySelectorAll('.color-swatch-circle.available').forEach(other => {
              const isIt = (other === sw);
              other.style.boxShadow = isIt ? `0 0 0 3px var(--bg-surface), 0 0 0 6px ${chosen}` : 'none';
              other.style.transform = isIt ? 'scale(1.12)' : 'scale(1)';
              const check = other.querySelector('.swatch-check');
              if (check) check.style.display = isIt ? 'block' : 'none';
            });
          };
        });
      }
    }, 50);
  }

  function renderHorario(mem, current) {
    let h = '';
    const todayStr = localDateStr(new Date());
    const dates = getWeekDates(mem.currentWeekStart);
    const ws = getWeekState();
    const sch = getSchedule(mem.currentWeekStart);
    const cats = getMemberCategories();

    if (!sch) return '<div class="hs-empty">No hay horario configurado. Ve al Editor para crear uno.</div>';

    const activePhase = getActivePhase(sch, mem.currentWeekStart);
    const schDays = getScheduleDays(sch, mem.currentWeekStart);

    if (current && cats[current.block[3]]) {
      h += '<div class="hs-banner">⚡ Actividad en curso de '+esc(mem.name)+': <strong>'+esc(current.block[2])+'</strong> ('+cats[current.block[3]].n+')</div>';
    }

    // Banner de Horario Activo, Fases e Intervalo de Vigencia
    if (sch) {
      const sStart = sch.startDate || '2026-08-01';
      const sEnd = sch.endDate || '2026-12-31';
      const pName = sch.periodName || 'Semestre 2026-II';
      h += '<div style="background:rgba(59,130,246,0.08);border:1px solid rgba(59,130,246,0.25);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px;">';
      
      h += '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">';
      h += '<div style="display:flex;align-items:center;gap:8px;">';
      h += '<span style="font-size:16px;">🟢</span>';
      h += '<div><strong style="font-size:13.5px;color:var(--text-1);">' + esc(sch.name) + '</strong> <span style="font-size:11px;color:var(--accent);font-family:var(--mono);margin-left:4px;">(' + esc(pName) + ')</span></div>';
      h += '</div>';
      h += '<div style="font-size:11.5px;font-family:var(--mono);color:var(--text-2);">';
      h += '📅 Intervalo Total: <strong style="color:var(--text-1);">' + sStart + '</strong> al <strong style="color:var(--text-1);">' + sEnd + '</strong>';
      h += '</div>';
      h += '</div>';

      // Si el horario tiene varias fases/etapas por semanas
      if (sch.phases && sch.phases.length > 1) {
        h += '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-top:6px;border-top:1px dashed rgba(59,130,246,0.2);">';
        h += '<span style="font-size:10.5px;color:var(--text-3);font-weight:700;text-transform:uppercase;">Etapas / Fases:</span>';
        sch.phases.forEach((p, pIdx) => {
          const isCurrentPhase = activePhase && activePhase.id === p.id;
          const pS = p.startDate || sStart;
          const pE = p.endDate || sEnd;
          h += '<button class="hs-btn sm phase-jump-btn' + (isCurrentPhase ? ' primary' : '') + '" data-pstart="' + pS + '" style="font-size:11px;padding:4px 10px;border-radius:12px;font-weight:600;" title="Ir a ' + esc(p.name) + ' (' + pS + ' al ' + pE + ')">';
          h += (isCurrentPhase ? '📌 ' : '') + esc(p.name) + ' <span style="font-family:var(--mono);font-size:10.5px;opacity:0.9;margin-left:4px;">(' + pS + ' al ' + pE + ')</span>';
          h += '</button>';
        });
        h += '</div>';
      }

      h += '</div>';
    }

    // ==========================================
    // CAPAS & GRUPOS DE ACTIVIDADES (PRENDER / APAGAR POR GRUPO O INDIVIDUAL)
    // ==========================================
    if (!mem.activityGroups || !mem.activityGroups.length) {
      mem.activityGroups = getDefaultMemberActivityGroups(mem.id);
    }
    const groups = mem.activityGroups || [];

    const usedCatKeys = new Set();
    Object.values(schDays || {}).forEach(blocks => {
      (blocks || []).forEach(b => {
        if (b && b[3]) usedCatKeys.add(b[3]);
      });
    });

    if (!view.catFilters) view.catFilters = {};
    if (!view.catFilters[mem.id]) {
      view.catFilters[mem.id] = {};
      usedCatKeys.forEach(k => { view.catFilters[mem.id][k] = true; });
    }
    const currentFilters = view.catFilters[mem.id];
    usedCatKeys.forEach(k => {
      if (currentFilters[k] === undefined) currentFilters[k] = true;
    });

    const anyDisabled = Array.from(usedCatKeys).some(k => currentFilters[k] === false);

    h += '<div class="hs-card" style="margin-bottom:14px;padding:12px;background:var(--bg-elevated);border-left:4px solid var(--user-color, var(--accent));">';
    
    // Header row of toolbar
    h += '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px;">';
    h += '<div style="display:flex;align-items:center;gap:6px;">';
    h += '<span style="font-size:16px;">📁</span>';
    h += '<strong style="font-size:13px;color:var(--text-1);letter-spacing:0.3px;">GRUPOS & CAPAS:</strong>';
    if (anyDisabled) {
      h += '<span style="background:rgba(239,68,68,0.18);color:#ef4444;font-size:10px;font-family:var(--mono);padding:1px 7px;border-radius:10px;font-weight:700;border:1px solid rgba(239,68,68,0.3);">Filtro Activo</span>';
    }
    h += '</div>';

    // Global control buttons
    h += '<div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap;">';
    h += '<button type="button" class="hs-btn sm cat-preset-btn" data-preset="all" style="font-size:11px;padding:3px 9px;' + (!anyDisabled ? 'background:var(--accent);color:#fff;font-weight:700;' : '') + '">✨ Ver Todo</button>';
    h += '<button type="button" class="hs-btn sm cat-preset-btn" data-preset="none" style="font-size:11px;padding:3px 8px;background:rgba(239,68,68,0.15);color:#ef4444;border:1px solid rgba(239,68,68,0.4);font-weight:700;" title="Apaga todas las actividades">🔴 Apagar Todo</button>';
    h += '<button type="button" class="hs-btn sm" id="open-manage-groups-btn" style="font-size:11px;padding:3px 9px;background:var(--bg-surface);border:1px solid var(--border);font-weight:700;" title="Crear y organizar tus propios grupos">⚙️ Agrupar / Editar</button>';
    h += '</div>';
    h += '</div>';

    // 1. Render Group Level Toggles (Power feature!)
    h += '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px dashed var(--border);">';
    h += '<span style="font-size:11px;font-family:var(--mono);color:var(--text-3);font-weight:700;">GRUPOS:</span>';
    groups.forEach((grp, gIdx) => {
      // Check if group is completely ON, partially ON, or completely OFF
      const totalKeys = grp.catKeys.length;
      const onKeys = grp.catKeys.filter(k => currentFilters[k] !== false).length;
      const isFullOn = totalKeys > 0 && onKeys === totalKeys;
      const isPartial = onKeys > 0 && onKeys < totalKeys;
      const isOff = onKeys === 0;

      let statusBadge = isFullOn ? '🟢' : (isPartial ? '🟡' : '✕');
      let grpBg = isFullOn ? (grp.color + '22') : (isPartial ? (grp.color + '15') : 'var(--bg-surface)');
      let grpColor = isFullOn ? grp.color : (isPartial ? grp.color : 'var(--text-3)');
      let grpBorder = isFullOn ? ('1.5px solid ' + grp.color) : (isPartial ? ('1.5px dashed ' + grp.color) : '1px dashed var(--border)');

      h += '<button type="button" class="group-filter-toggle-btn" data-gidx="' + gIdx + '" style="padding:5px 12px;font-size:11.5px;font-family:var(--mono);font-weight:700;border-radius:18px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all 0.15s ease;background:' + grpBg + ';color:' + grpColor + ';border:' + grpBorder + ';' + (isOff ? 'opacity:0.5;text-decoration:line-through;' : '') + '" title="Clic para prender/apagar todo este grupo">';
      h += '<span>' + statusBadge + '</span> <strong>' + esc(grp.name) + '</strong> <span style="font-size:10px;opacity:0.8;">(' + onKeys + '/' + totalKeys + ')</span>';
      h += '</button>';
    });
    h += '</div>';

    h += '</div>';

    // Week Nav & View Switch
    const label = fmtShort(dates[0]) + ' – ' + fmtFull(dates[6]);
    h += '<div class="date-nav-toolbar" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;">';
    h += '<div class="date-nav-controls" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">';
    h += '<button class="hs-btn sm" id="week-prev" style="padding:5px 10px;flex-shrink:0;">◀</button>';
    h += '<span style="font-family:var(--mono);font-size:12.5px;font-weight:700;display:inline-block;width:190px;min-width:190px;max-width:190px;text-align:center;white-space:nowrap;user-select:none;box-sizing:border-box;">'+esc(label)+'</span>';
    h += '<button class="hs-btn sm" id="week-next" style="padding:5px 10px;flex-shrink:0;">▶</button>';
    h += '<button class="hs-btn sm primary" id="week-today" style="padding:5px 10px;font-size:11px;">Esta Semana</button>';
    h += '<button class="hs-btn sm" id="print-schedule-btn" style="background:var(--accent-soft);color:var(--user-color, var(--accent));">🖨️ Imprimir Horario A4</button>';
    h += '</div>';

    h += '<div class="hs-view-switch">';
    h += '<button class="hs-view-switch-btn'+(view.scheduleMode==='day'?' active':'')+'" id="switch-view-day">📱 Vista Diaria</button>';
    h += '<button class="hs-view-switch-btn'+(view.scheduleMode==='week'?' active':'')+'" id="switch-view-week">📅 Vista Semanal</button>';
    h += '</div>';
    h += '</div>';

    const sStart = sch.startDate || '2026-08-01';
    const sEnd = sch.endDate || '2026-12-31';
    const weekStartStr = localDateStr(dates[0]);
    const weekEndStr = localDateStr(dates[6]);
    const isWeekInRange = (weekEndStr >= sStart && weekStartStr <= sEnd);

    if (!isWeekInRange) {
      const isPast = weekEndStr < sStart;
      h += '<div class="hs-card" style="text-align:center;padding:42px 20px;background:var(--bg-elevated);border-radius:var(--radius-sm);border:1px dashed var(--border);margin-top:12px;">';
      h += '<div style="font-size:38px;margin-bottom:10px;">⏸️</div>';
      h += '<h3 style="font-size:16px;font-weight:800;color:var(--text-1);margin-bottom:6px;">Semana fuera del Periodo de Vigencia</h3>';
      h += '<p style="font-size:13px;color:var(--text-2);max-width:560px;margin:0 auto 16px auto;line-height:1.5;">El horario <strong>' + esc(sch.name) + '</strong> (' + esc(sch.periodName || 'Semestre') + ') está configurado únicamente para el intervalo del <strong>' + sStart + '</strong> al <strong>' + sEnd + '</strong>.<br>Esta semana (' + esc(label) + ') ' + (isPast ? 'es anterior al inicio' : 'es posterior al término') + ' de este horario.</p>';
      h += '<button class="hs-btn primary sm" id="go-to-valid-schedule-range" style="font-weight:700;padding:8px 18px;font-size:12px;">📅 Ir a la Vigencia de este Horario (' + sStart + ')</button>';
      h += '</div>';
      return h;
    }

    if (view.scheduleMode === 'day') {
      // Vista Diaria para Móviles
      const selDay = view.activeDay || 'LUNES';
      h += '<div class="hs-dayview-tabs">';
      ORDER.forEach((d, i) => {
        const isToday = localDateStr(dates[i]) === todayStr;
        const isSel = selDay === d;
        h += '<button class="hs-dayview-tab'+(isSel?' active':'')+'" data-activeday="'+d+'">';
        h += '<span>'+LABELS[d]+' '+dates[i].getDate()+'</span>';
        h += '<span style="font-size:9.5px;opacity:0.8;margin-top:2px;">'+pctDay(d)+'%</span>';
        h += '</button>';
      });
      h += '</div>';

      const dayBlocks = (schDays[selDay] || []);
      if (!dayBlocks.length) {
        h += '<div class="hs-card" style="text-align:center;padding:28px 16px;color:var(--text-3);font-size:13px;">No hay bloques programados para '+LABELS[selDay]+'. Puedes agregarlos en la pestaña <strong>✏️ Editor</strong>.</div>';
      } else {
        h += '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px;">';
        const filteredDayBlocks = dayBlocks.filter(b => currentFilters[b[3]] !== false);
        if (!filteredDayBlocks.length && dayBlocks.length > 0) {
          h += '<div class="hs-card" style="text-align:center;padding:24px 16px;color:var(--text-3);font-size:12.5px;">Las actividades de ' + LABELS[selDay] + ' están apagadas con los filtros actuales. Pulsa <strong>✨ Ver Todo</strong> para encenderlas.</div>';
        }
        dayBlocks.forEach((b, i) => {
          const isCatVisible = currentFilters[b[3]] !== false;
          if (!isCatVisible) return;
          const key = selDay + '-' + i;
          const isDone = !!ws.done[key];
          const isNow = current && current.day === selDay && current.idx === i;
          const catInfo = cats[b[3]] || { c: '#7c6cff', n: b[3] };
          h += '<div class="hs-dayview-card'+(isDone?' done':'')+(isNow?' now':'')+'" style="--cat:'+catInfo.c+'" data-key="'+key+'">';
          h += '<div style="display:flex;align-items:center;gap:12px;flex:1;">';
          h += '<span style="font-size:16px;">'+(isDone?'✅':'⬜')+'</span>';
          h += '<div><span class="hs-dayview-time">'+b[0]+' – '+b[1]+'</span>';
          h += '<div class="hs-dayview-title">'+esc(b[2])+'</div></div>';
          h += '</div>';
          h += '<div style="display:flex;align-items:center;gap:6px;">';
          h += '<span class="hs-dayview-cat">'+esc(catInfo.n)+'</span>';
          h += '<button class="quick-edit-block" data-d="'+selDay+'" data-i="'+i+'" style="border:none;background:var(--bg-surface);color:var(--text-2);border-radius:4px;padding:3px 7px;cursor:pointer;font-size:11.5px;" title="Editar actividad">✏️</button>';
          h += '</div>';
          h += '</div>';
        });
        h += '</div>';
        h += '<p class="hs-hint">💡 Toca cualquier bloque para marcarlo como completado.</p>';
      }
    } else {
      // Vista Semanal (Tabla Completa con Línea de Tiempo NOW)
      const dayMaps = {}, covered = {};
      ORDER.forEach(d => { dayMaps[d] = buildDayMap(d); covered[d] = {}; });
      const now = new Date();
      const currentMins = now.getHours() * 60 + now.getMinutes();

      h += '<div class="hs-wrap"><table class="hs-table"><thead><tr><th></th>';
      ORDER.forEach((d, i) => {
        const isToday = localDateStr(dates[i]) === todayStr;
        h += '<th'+(isToday?' class="today"':'')+'>' + LABELS[d] + ' ' + dates[i].getDate() + '<span class="pct">'+pctDay(d)+'%</span></th>';
      });
      h += '</tr></thead><tbody>';

      for (let s = 0; s < N_SLOTS; s++) {
        const mins = GRID_START + s*SLOT;
        h += '<tr><td class="hs-timecell">'+(mins%60===0?labelHM(mins):'')+'</td>';
        ORDER.forEach((d, di) => {
          if (covered[d][s]) return;
          const entry = dayMaps[d][s];
          const isToday = localDateStr(dates[di]) === todayStr;
          const isNowSlot = isToday && currentMins >= mins && currentMins < mins + SLOT;
          const colCls = isToday ? ' today-col' : '';
          const nowLineHtml = isNowSlot ? '<div class="now-indicator-line"><span class="now-indicator-badge">🔴 '+labelHM(currentMins)+'</span></div>' : '';

          if (entry) {
            for (let k=0;k<entry.span;k++) covered[d][s+k]=true;
            const key = d+'-'+entry.idx, b = entry.block;
            const isDone = !!ws.done[key], isNow = current && current.day===d && current.idx===entry.idx;
            const catInfo = cats[b[3]] || { c: '#7c6cff', n: b[3] };
            const isCatVisible = currentFilters[b[3]] !== false;
            let cls = 'hs-block'+(isDone?' done':'')+(isNow?' now':'');
            let blockOpacityStyle = isCatVisible ? '' : 'opacity:0.12;filter:grayscale(90%);';
            h += '<td class="hs-daycell'+colCls+'" rowspan="'+entry.span+'" style="height:'+(entry.span*15)+'px;position:relative;">';
            h += nowLineHtml;
            h += '<div class="'+cls+'" style="--cat:'+catInfo.c+';'+blockOpacityStyle+'" data-key="'+key+'">';
            h += '<span class="tm">'+b[0]+'–'+b[1]+'</span><span class="lbl">'+esc(b[2])+'</span></div></td>';
          } else {
            h += '<td class="hs-daycell'+colCls+'" style="height:15px;position:relative;">'+nowLineHtml+'</td>';
          }
        });
        h += '</tr>';
      }
      h += '</tbody></table></div></div>';
      h += '<p class="hs-hint">💡 Clic en un bloque para marcarlo como completado · La línea roja marca la hora actual en vivo.</p>';
    }

    // Grid: Configurable Pomodoro + Daily Priorities
    h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:20px;">';
    
    // Configurable Focus Timer
    const isB = pomo.mode==='Descanso';
    const cfg = state.pomoConfig || { focusMins: 25, breakMins: 5 };

    h += '<div class="hs-card">';
    h += '<div class="hs-card-header">';
    h += '<span class="hs-section-title">⏱️ Temporizador de Enfoque</span>';
    h += '<div class="pomo-time-presets">';
    [15, 25, 45, 60].forEach(m => {
      h += '<button class="pomo-preset-btn'+(cfg.focusMins===m?' active':'')+'" data-setmins="'+m+'">'+m+' min</button>';
    });
    h += '</div></div>';

    h += '<div class="hs-pomo-wrap">';
    h += '<div class="hs-pomo-ring-wrap"><svg class="hs-pomo-ring" viewBox="0 0 200 200">';
    h += '<circle class="hs-pomo-ring-bg" cx="100" cy="100" r="88"/>';
    h += '<circle class="hs-pomo-ring-fill'+(isB?' on-break':'')+'" id="pomo-ring" cx="100" cy="100" r="88"/>';
    h += '</svg><div class="hs-pomo-center">';
    h += '<span class="hs-pomo-mode'+(isB?' break-mode':'')+'" id="pomo-mode">'+pomo.mode+'</span>';
    h += '<span class="hs-pomo-time" id="pomo-time">25:00</span></div></div>';

    // Custom time input row
    h += '<div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);">';
    h += '<span>Enfoque:</span><input type="number" id="custom-focus-mins" min="1" max="180" value="'+cfg.focusMins+'" style="width:48px;padding:3px 6px;background:var(--bg-input);border:1px solid var(--border);color:var(--text-1);border-radius:4px;font-family:var(--mono);"><span>min</span>';
    h += '<span style="margin-left:8px;">Descanso:</span><input type="number" id="custom-break-mins" min="1" max="60" value="'+cfg.breakMins+'" style="width:48px;padding:3px 6px;background:var(--bg-input);border:1px solid var(--border);color:var(--text-1);border-radius:4px;font-family:var(--mono);"><span>min</span>';

      const isSel = (sk === currentScope);

    });

        const tInp = document.getElementById('uni-title');
        const tyInp = document.getElementById('uni-type');
        const dInp = document.getElementById('uni-date');
        const tmInp = document.getElementById('uni-time');
        const wInp = document.getElementById('uni-weight');
        const nInp = document.getElementById('uni-notes');

        if (!tInp || !tInp.value.trim()) {
          showToast('Ingresa el título o nombre de la actividad', 'warn');
          return;
        }

        const savedItem = {
          id: initialData ? initialData.id : genId(),
          categoryType: currentScope,
          course: tInp.value.trim(),
          type: tyInp ? tyInp.value : 'General',
          date: dInp ? dInp.value : localDateStr(new Date()),
          time: tmInp ? tmInp.value : '',
          weight: wInp ? wInp.value.trim() : '',
          done: initialData ? !!initialData.done : false,
          notes: nInp ? nInp.value.trim() : ''
        };

        if (onSaved) onSaved(savedItem);
      }
    });

    // In-place smooth instant scope switching without modal re-creation (Zero flicker)
    setTimeout(() => {
      const cont = document.getElementById('sinergia-modal-container');
      if (!cont) return;

      cont.querySelectorAll('.uni-scope-btn').forEach(btn => {
        btn.onclick = () => {
          const newScope = btn.dataset.scopeKey;
          if (newScope === currentScope) return;
          currentScope = newScope;
          const newCfg = SCOPE_CONFIGS[currentScope] || SCOPE_CONFIGS.academico;

          // 1. Update Buttons Styling
          cont.querySelectorAll('.uni-scope-btn').forEach(b => {
            const isTarget = (b.dataset.scopeKey === currentScope);
            const bsc = SCOPE_CONFIGS[b.dataset.scopeKey] || SCOPE_CONFIGS.academico;
            b.style.border = isTarget ? ('1.5px solid ' + bsc.color) : ('1.5px solid ' + bsc.border + '66');

          // 2. Update Labels & Placeholders in-place smoothly
          const tLabel = document.getElementById('uni-title-label');
          const tInp = document.getElementById('uni-title');
          if (tLabel) tLabel.textContent = newCfg.titleLabel;
          if (tInp) tInp.placeholder = newCfg.titlePlaceholder;

          const tyLabel = document.getElementById('uni-type-label');
          const tySelect = document.getElementById('uni-type');
          if (tyLabel) tyLabel.textContent = newCfg.typeLabel;
          if (tySelect) {
            let opts = '';
            newCfg.types.forEach(t => {
              opts += `<option value="${t}">${t}</option>`;
            });
            tySelect.innerHTML = opts;
          }

          const wLabel = document.getElementById('uni-weight-label');
          const wInp = document.getElementById('uni-weight');
          if (wLabel) wLabel.textContent = newCfg.weightLabel;
          if (wInp) wInp.placeholder = newCfg.weightPlaceholder;

          const nLabel = document.getElementById('uni-notes-label');
          const nInp = document.getElementById('uni-notes');
          if (nLabel) nLabel.textContent = newCfg.notesLabel;
          if (nInp) nInp.placeholder = newCfg.notesPlaceholder;
        };
      });
    }, 30);
  }

  /* ================================================================
     RENDER: CALENDARIO DE OBRAS & ENTREGAS DE SINERGIA STUDIO
     ================================================================ */
    function renderSinergiaCalendar() {
    if (!state.sinergia) state.sinergia = { projects: [], calendarNotes: {} };
    if (!state.sinergia.calendarNotes) state.sinergia.calendarNotes = {};
    if (!state.sinergia.activeMonth) state.sinergia.activeMonth = getCurrentMonthKey();

    const activeMKey = state.sinergia.activeMonth;
    const [yearStr, monthStr] = activeMKey.split('-');
    const year = parseInt(yearStr, 10);
    const monthIndex = parseInt(monthStr, 10) - 1;

    const firstDayDate = new Date(year, monthIndex, 1);
    const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
    let startDayOfWeek = firstDayDate.getDay();
    startDayOfWeek = (startDayOfWeek === 0) ? 6 : startDayOfWeek - 1;

    const todayStr = localDateStr(new Date());
    const projects = state.sinergia.projects || [];

    let h = '<div style="margin-top:16px;">';
    h += '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;">';
    h += '<div>';
    h += '<h2 style="font-size:18px;font-weight:800;color:#DAAF37;margin:0;">📅 Calendario de Obras, Medidas & Entregas · Sinergia Studio</h2>';
    h += '<div style="font-size:12px;color:var(--text-2);margin-top:2px;">Haz clic en cualquier día para programar visitas técnicas, fabricación, montajes o registrar notas de taller.</div>';
    h += '</div>';
    h += '<div style="display:flex;align-items:center;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px 6px;">';
    h += '<button class="hs-btn sm" id="sin-cal-prev-btn" style="padding:4px 9px;font-size:11px;flex-shrink:0;">◀</button>';
    h += '<span style="font-size:12.5px;font-weight:700;font-family:var(--mono);display:inline-block;width:170px;min-width:170px;max-width:170px;text-align:center;color:var(--text-1);white-space:nowrap;user-select:none;box-sizing:border-box;">📅 ' + formatMonthName(activeMKey) + '</span>';
    h += '<button class="hs-btn sm" id="sin-cal-next-btn" style="padding:4px 9px;font-size:11px;flex-shrink:0;">▶</button>';
    h += '</div>';
    h += '</div>';

    // Barra de Leyenda de Hitos de Sinergia Studio
    h += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center;font-size:11px;font-family:var(--mono);">';
    h += '<span style="color:var(--text-3);font-weight:700;margin-right:2px;">HITOS DE OBRA:</span>';
    h += '<span style="padding:2px 8px;border-radius:12px;background:rgba(245,158,11,0.18);border:1px solid rgba(245,158,11,0.4);color:#f59e0b;font-weight:700;">📐 Medidas / Visita</span>';
    h += '<span style="padding:2px 8px;border-radius:12px;background:rgba(139,92,246,0.18);border:1px solid rgba(139,92,246,0.4);color:#8b5cf6;font-weight:700;">🎨 Renders & 3D</span>';
    h += '<span style="padding:2px 8px;border-radius:12px;background:rgba(6,182,212,0.18);border:1px solid rgba(6,182,212,0.4);color:#06b6d4;font-weight:700;">🛒 Compras Pelíkano</span>';
    h += '<span style="padding:2px 8px;border-radius:12px;background:rgba(249,115,22,0.18);border:1px solid rgba(249,115,22,0.4);color:#f97316;font-weight:700;">🔨 Armado en Sitio</span>';
    h += '<span style="padding:2px 8px;border-radius:12px;background:rgba(16,185,129,0.18);border:1px solid rgba(16,185,129,0.4);color:#10b981;font-weight:700;">📦 Entrega & Montaje</span>';
    h += '<span style="padding:2px 8px;border-radius:12px;background:rgba(218,175,55,0.18);border:1px solid rgba(218,175,55,0.4);color:#DAAF37;font-weight:700;">💰 Cobro de Saldo</span>';
    h += '</div>';

    // Grilla 7 Columnas
    h += '<div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;">';
    h += '<div style="display:grid;grid-template-columns:repeat(7, minmax(0, 1fr));background:var(--bg-card);border-bottom:2px solid var(--border);text-align:center;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text-2);padding:8px 0;">';
    ['LUN', 'MAR', 'MIÉ', 'JUE', 'VIE', 'SÁB', 'DOM'].forEach(dName => {
      h += '<div>' + dName + '</div>';
    });
    h += '</div>';

    h += '<div style="display:grid;grid-template-columns:repeat(7, minmax(0, 1fr));gap:1px;background:var(--border);">';
    for (let i = 0; i < startDayOfWeek; i++) {
      h += '<div style="background:var(--bg-base);min-height:90px;opacity:0.4;"></div>';
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const dayKey = activeMKey + '-' + String(day).padStart(2, '0');
      const isToday = dayKey === todayStr;
      const dayNotes = state.sinergia.calendarNotes[dayKey] || [];
      const dayDeliveries = projects.filter(p => p.deliveryDate === dayKey);
      const dayVisits = projects.filter(p => p.visitDate === dayKey);

      h += '<div class="sin-cal-day-cell" data-date="' + dayKey + '" style="background:' + (isToday ? 'rgba(218,175,55,0.12)' : 'var(--bg-elevated)') + ';border:' + (isToday ? '1.5px solid #DAAF37' : 'none') + ';min-height:95px;padding:6px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:background 0.2s;" title="Clic para ver o programar hitos de obra">';
      
      h += '<div style="display:flex;justify-content:space-between;align-items:center;">';
      h += '<span style="font-size:12px;font-family:var(--mono);font-weight:' + (isToday ? '800' : '600') + ';color:' + (isToday ? '#DAAF37' : 'var(--text-1)') + ';">' + day + '</span>';
      const totalEvents = dayNotes.length + dayDeliveries.length + dayVisits.length;
      if (totalEvents > 0) {
        h += '<span style="font-size:9px;background:var(--bg-surface);padding:1px 4px;border-radius:4px;border:1px solid var(--border);color:#DAAF37;font-weight:700;">' + totalEvents + '</span>';
      }
      h += '</div>';

      h += '<div style="display:flex;flex-direction:column;gap:3px;margin:4px 0;flex:1;overflow:hidden;">';
      
      // Visitas a Obra / Toma de Medidas
      dayVisits.forEach(p => {
        h += '<div style="font-size:9.5px;padding:2px 4px;border-radius:3px;background:rgba(245,158,11,0.22);color:#f59e0b;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="Visita / Medidas: ' + esc(p.client) + ' (' + esc(p.room) + ')">📐 Medidas: ' + esc(p.client) + '</div>';
      });

      // Entregas de Obra / Montajes
      dayDeliveries.forEach(p => {
        h += '<div style="font-size:9.5px;padding:2px 4px;border-radius:3px;background:rgba(16,185,129,0.22);color:#10b981;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="Entrega Final: ' + esc(p.client) + ' (' + esc(p.room) + ')">📦 Entrega: ' + esc(p.client) + '</div>';
      });

      // Hitos y notas específicas registradas en el día
      dayNotes.forEach(n => {
        const noteTxt = typeof n === 'string' ? n : (n.text || n.noteText || n.content || '');
        const nType = (n && n.type) ? n.type : 'hito';
        let nBg = 'rgba(218,175,55,0.18)', nColor = 'var(--text-1)', nIcon = '🔨';
        if (nType === 'medidas') { nBg = 'rgba(245,158,11,0.18)'; nColor = '#f59e0b'; nIcon = '📐'; }
        else if (nType === 'diseno') { nBg = 'rgba(139,92,246,0.18)'; nColor = '#8b5cf6'; nIcon = '🎨'; }
        else if (nType === 'compras') { nBg = 'rgba(6,182,212,0.18)'; nColor = '#06b6d4'; nIcon = '🛒'; }
        else if (nType === 'entrega') { nBg = 'rgba(16,185,129,0.18)'; nColor = '#10b981'; nIcon = '📦'; }
        else if (nType === 'cobro') { nBg = 'rgba(218,175,55,0.22)'; nColor = '#DAAF37'; nIcon = '💰'; }

        h += '<div style="font-size:9.5px;padding:2px 4px;border-radius:3px;background:' + nBg + ';border:1px solid rgba(218,175,55,0.3);color:' + nColor + ';font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="' + esc(noteTxt) + '">' + nIcon + ' ' + esc(noteTxt) + '</div>';
      });
      h += '</div>';

      h += '<div style="font-size:9.5px;color:var(--text-3);text-align:right;opacity:0.7;">+ Hito</div>';
      h += '</div>';
    }

    const totalCells = startDayOfWeek + daysInMonth;
    const remCells = (7 - (totalCells % 7)) % 7;
    for (let i = 0; i < remCells; i++) {
      h += '<div style="background:var(--bg-base);min-height:90px;opacity:0.4;"></div>';
    }

    h += '</div></div>';
    h += '</div>';
    return h;
  }

  /* ================================================================
     FINANZAS DEL HOGAR: HELPERS & DATA MANAGER
     ================================================================ */
    function getCurrentMonthKey() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  function formatMonthName(mKey) {
    if (!mKey || !mKey.includes('-')) mKey = getCurrentMonthKey();
    const [y, m] = mKey.split('-');
    const mNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
    const idx = parseInt(m, 10) - 1;
    return (mNames[idx] || 'Mes') + ' ' + y;
  }

  function getPrevMonthKey(mKey) {
    if (!mKey || !mKey.includes('-')) mKey = getCurrentMonthKey();
    const [y, m] = mKey.split('-').map(Number);
    const d = new Date(y, m - 2, 1);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  function getNextMonthKey(mKey) {
    if (!mKey || !mKey.includes('-')) mKey = getCurrentMonthKey();
    const [y, m] = mKey.split('-').map(Number);
    const d = new Date(y, m, 1);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  /* ================================================================
     CUSTOM IN-APP CONFIRMATION MODAL (ZERO BROWSER POPUPS)
     ================================================================ */
  function showAppConfirm(opts) {
    const title = opts.title || '¿Estás seguro?';
    const msg = opts.message || 'Esta acción no se puede deshacer.';
    const confirmLabel = opts.confirmLabel || 'Sí, Continuar';
    const cancelLabel = opts.cancelLabel || 'Cancelar';
    const isDanger = opts.isDanger !== false;

    const overlay = document.createElement('div');
    overlay.className = 'sinergia-modal-overlay';
    overlay.style.zIndex = '100000';
    overlay.innerHTML = `
      <div class="sinergia-modal" style="max-width:380px;border-radius:12px;border:1px solid var(--border-strong);box-shadow:var(--shadow);">
        <div class="sinergia-modal-header" style="border-bottom:1px solid var(--border);padding:14px 18px;">
          <h3 style="font-size:15px;font-weight:800;color:var(--text-1);margin:0;">${esc(title)}</h3>
          <button class="sinergia-modal-close" id="app-confirm-close-btn">✕</button>
        </div>
        <div class="sinergia-modal-body" style="padding:16px 18px;font-size:13px;color:var(--text-2);line-height:1.4;">
          ${esc(msg)}
        </div>
        <div class="sinergia-modal-footer" style="padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;">
          <button class="hs-btn sm" id="app-confirm-cancel-btn">${esc(cancelLabel)}</button>
          <button class="hs-btn sm" id="app-confirm-ok-btn" style="background:${isDanger ? '#ef4444' : 'var(--accent)'};color:#fff;font-weight:700;">${esc(confirmLabel)}</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    const close = () => overlay.remove();
    overlay.querySelector('#app-confirm-close-btn').onclick = close;
    overlay.querySelector('#app-confirm-cancel-btn').onclick = close;
    overlay.querySelector('#app-confirm-ok-btn').onclick = () => {
      close();
      if (typeof opts.onConfirm === 'function') opts.onConfirm();
    };
  }

  <xml>
    <x:ExcelWorkbook>

  <style>
    body { font-family: Calibri, 'Segoe UI', Arial, sans-serif; font-size: 11pt; color: #1e293b; }
    .title-banner { background-color: #0e1015; color: #DAAF37; font-size: 16pt; font-weight: bold; padding: 12px; text-align: center; }
    .subtitle-banner { background-color: #1e293b; color: #f8fafc; font-size: 10pt; text-align: center; padding: 6px; }
    .meta-row { background-color: #f1f5f9; color: #64748b; font-size: 9pt; padding: 4px 8px; }
    th { background-color: ${themeColor}; color: #ffffff; font-weight: bold; border: 1px solid #334155; padding: 8px 10px; text-align: center; font-size: 10.5pt; }
    td { border: 1px solid #cbd5e1; padding: 6px 10px; font-size: 10pt; }
    .alt-row { background-color: #f8fafc; }
    .num-cell { text-align: right; font-family: 'Consolas', monospace; mso-number-format: '"S/."\\ #\\,##0\\.00'; }
    .bold-cell { font-weight: bold; }
    .total-row td { background-color: #e2e8f0; font-weight: bold; border-top: 2px solid #334155; border-bottom: 2px solid #334155; }
    .badge-paid { color: #15803d; font-weight: bold; }
    .badge-pending { color: #b91c1c; font-weight: bold; }
  </style>
</head>
<body>
  <table border="0" cellpadding="0" cellspacing="0">
    <tr>
      <td colspan="${columns.length}" class="title-banner">${esc(title)}</td>
    </tr>
    <tr>
      <td colspan="${columns.length}" class="subtitle-banner">${esc(subtitle)} · Generado: ${localDateStr(new Date())}</td>
    </tr>
    <tr><td colspan="${columns.length}"></td></tr>
    <tr>
      ${columns.map(c => `<th style="width:${c.width || 120}px;">${esc(c.header)}</th>`).join('')}
    </tr>`;

    rows.forEach((r, idx) => {
      const isAlt = idx % 2 === 1;
      html += `<tr class="${isAlt ? 'alt-row' : ''}">`;
      columns.forEach(c => {
        const val = r[c.key] !== undefined ? r[c.key] : '';
        const align = c.align || 'left';
        const isNum = typeof val === 'number' || c.isCurrency;
        const formattedVal = c.isCurrency && typeof val === 'number' ? `S/. ${val.toFixed(2)}` : esc(val);
        html += `<td align="${align}" class="${isNum ? 'num-cell' : ''}">${formattedVal}</td>`;
      });
      html += `</tr>`;
    });

    if (totals) {
      html += `<tr class="total-row">`;
      columns.forEach(c => {
        const val = totals[c.key] !== undefined ? totals[c.key] : '';
        const align = c.align || 'left';
        const formattedVal = c.isCurrency && typeof val === 'number' ? `S/. ${val.toFixed(2)}` : (val !== '' ? `<strong>${esc(val)}</strong>` : '');
        html += `<td align="${align}" class="${c.isCurrency ? 'num-cell bold-cell' : 'bold-cell'}">${formattedVal}</td>`;
      });
      html += `</tr>`;
    }

    html += `</table></body></html>`;

    const blob = new Blob([html], { type: 'application/vnd.ms-excel;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('📊 ¡Archivo Excel exportado con formato profesional!');
  }

  function getMonthFinanzas(mKey) {
    if (!state.finanzas) state.finanzas = {};
    if (!state.finanzas.months) state.finanzas.months = {};
    if (!state.finanzas.activeMonth) state.finanzas.activeMonth = getCurrentMonthKey();
    if (!mKey) mKey = state.finanzas.activeMonth;

    if (!state.finanzas.months[mKey]) {
      // Look for previous month to intelligently rollover fixed items
      const prevKey = getPrevMonthKey(mKey);
      const prevData = state.finanzas.months[prevKey];

      if (prevData) {
        // Roll over fixed expenses (reset to Pendiente for the new month)
        const newGastos = (prevData.gastos || []).map(g => ({
          id: genId(),
          desc: g.desc,
          amount: g.amount,
          cat: g.cat,
          payer: g.payer,
          status: 'Pendiente',
          dueDate: mKey + '-' + (g.dueDate ? (g.dueDate.split('-')[2] || '15') : '15'),
          notes: g.notes || ''
        }));

        // Roll over recurring fixed income
        const newIngresos = (prevData.ingresos || [])
          .filter(i => (i.freq || 'Mensual') === 'Mensual')
          .map(i => ({
            id: genId(),
            desc: i.desc,
            amount: i.amount,
            payer: i.payer,
            freq: i.freq,
            date: mKey + '-' + (i.date ? (i.date.split('-')[2] || '30') : '30'),
            notes: i.notes || ''
          }));

        // Roll over active debts with current remaining balance
        const newDeudas = (prevData.deudas || [])
          .filter(d => cleanNum(d.balance, 0) > 0)
          .map(d => ({
            id: genId(),
            desc: d.desc,
            creditor: d.creditor,
            total: d.total,
            balance: d.balance,
            monthlyInstallment: d.monthlyInstallment,
            dueDate: mKey + '-' + (d.dueDate ? (d.dueDate.split('-')[2] || '20') : '20'),
            status: 'Al día',
            notes: d.notes || ''
          }));

        // Roll over savings goals with current accumulated balance
        const newAhorros = (prevData.ahorros || []).map(a => ({
          id: genId(),
          name: a.name,
          target: a.target,
          current: a.current,
          monthlyContrib: a.monthlyContrib,
          deadline: a.deadline,
          notes: a.notes || ''
        }));

        state.finanzas.months[mKey] = {
          ingresos: newIngresos,
          gastos: newGastos,
          ahorros: newAhorros,
          deudas: newDeudas,
          calendarNotes: {}
        };
      } else {
        // Base initial template
        state.finanzas.months[mKey] = {
          ingresos: [
            { id: genId(), desc: 'Sueldo Willman (Obra & Construcción)', amount: 2800, payer: 'Willman', freq: 'Mensual', date: mKey + '-30', notes: 'Sueldo principal de obras' },
            { id: genId(), desc: 'Ingreso Karen (Administración)', amount: 1500, payer: 'Karen', freq: 'Mensual', date: mKey + '-30', notes: 'Administración y gestiones' },
            { id: genId(), desc: 'Utilidades Sinergia Studio (Geanly)', amount: 1200, payer: 'Geanly', freq: 'Variable', date: mKey + '-25', notes: 'Proyectos de diseño y modelado 3D' }
          ],
          gastos: [
            { id: genId(), desc: 'Servicios Básicos (Luz, Agua, Internet)', amount: 380, cat: 'servicios', payer: 'Willman', status: 'Pagado', dueDate: mKey + '-15', notes: 'Luz del sur e internet' },
            { id: genId(), desc: 'Alimentación & Despensa Mensual', amount: 1400, cat: 'alimentacion', payer: 'Karen', status: 'En curso', dueDate: mKey + '-28', notes: 'Canasta básica familiar' },
            { id: genId(), desc: 'Educación Geanly / Franco / Benjamín', amount: 650, cat: 'educacion', payer: 'Compartido', status: 'Pendiente', dueDate: mKey + '-30', notes: 'Pensión y materiales' },
            { id: genId(), desc: 'Transporte, Combustible y Pasajes', amount: 350, cat: 'transporte', payer: 'Willman', status: 'Pagado', dueDate: mKey + '-20', notes: 'Movilidad y gasolina' },
            { id: genId(), desc: 'Mantenimiento e Imprevistos del Hogar', amount: 250, cat: 'hogar', payer: 'Compartido', status: 'Pendiente', dueDate: mKey + '-25', notes: 'Reparaciones del hogar' }
          ],
          ahorros: [
            { id: genId(), name: 'Fondo de Emergencia Familiar', target: 6000, current: 3500, monthlyContrib: 400, deadline: '2026-12', notes: 'Reserva para 3 meses de gastos fijos' },
            { id: genId(), name: 'Herramientas & Taller Sinergia', target: 3500, current: 1500, monthlyContrib: 350, deadline: '2026-11', notes: 'Ruteadora y herramientas de impacto' },
            { id: genId(), name: 'Fondo de Vacaciones Familiares', target: 4000, current: 1200, monthlyContrib: 250, deadline: '2027-01', notes: 'Viaje familiar fin de año' }
          ],
          deudas: [
            { id: genId(), desc: 'Préstamo Equipamiento / Herramientas', total: 4800, balance: 1900, monthlyInstallment: 475, dueDate: mKey + '-20', status: 'Al día', creditor: 'Banco / Financiera', notes: 'Compra de sierra y calibrador' }
          ],
          calendarNotes: {
            [mKey + '-05']: [{ id: genId(), text: '💡 Revisión quincenal de cuentas del hogar', author: 'Karen' }],
            [mKey + '-15']: [{ id: genId(), text: '⚡ Recibo de luz e internet cancelado', author: 'Willman' }],
            [mKey + '-20']: [{ id: genId(), text: '💳 Cuota préstamo equipamiento cancelada', author: 'Willman' }],
            [mKey + '-28']: [{ id: genId(), text: '🛒 Compra mayorista de despensa', author: 'Familia' }]
          }
        };
      }
    }
    return state.finanzas.months[mKey];
  }

  /* ================================================================
     RENDER: FINANZAS DEL HOGAR (4 PILARES + HISTORIAL + CALENDARIO)
     ================================================================ */
  function renderFinanzas() {
    const activeMKey = (state.finanzas && state.finanzas.activeMonth) || getCurrentMonthKey();
    const fTab = (state.finanzas && state.finanzas.subView) || 'ingresos';
    const mData = getMonthFinanzas(activeMKey);

    const ingresosList = mData.ingresos || [];
    const gastosList = mData.gastos || [];
    const ahorrosList = mData.ahorros || [];
    const deudasList = mData.deudas || [];
    const calNotesObj = mData.calendarNotes || {};

    // Totales y Cálculos
    let totalIngresos = 0;
    ingresosList.forEach(i => { totalIngresos += cleanNum(i.amount, 0); });

    let totalGastos = 0, gastosPagados = 0, gastosPendientes = 0;
    gastosList.forEach(g => {
      const amt = cleanNum(g.amount, 0);
      totalGastos += amt;
      if (g.status === 'Pagado') gastosPagados += amt;
      else gastosPendientes += amt;
    });

    let totalAhorrado = 0, totalMetaAhorro = 0, ahorroMensualTotal = 0;
    ahorrosList.forEach(a => {
      totalAhorrado += cleanNum(a.current, 0);
      totalMetaAhorro += cleanNum(a.target, 0);
      ahorroMensualTotal += cleanNum(a.monthlyContrib, 0);
    });

    let totalDeudaSaldo = 0, cuotasMesTotal = 0;
    deudasList.forEach(d => {
      totalDeudaSaldo += cleanNum(d.balance, 0);
      cuotasMesTotal += cleanNum(d.monthlyInstallment, 0);
    });

    const balanceNeto = totalIngresos - totalGastos - ahorroMensualTotal - cuotasMesTotal;

    const catBadges = {
      servicios: { label: '⚡ Servicios', color: '#5B7083', bg: 'rgba(91,112,131,0.18)' },
      alimentacion: { label: '🛒 Alimentación', color: '#4E8772', bg: 'rgba(78,135,114,0.18)' },
      educacion: { label: '🎓 Educación', color: '#526E8F', bg: 'rgba(82,110,143,0.18)' },
      salud: { label: '💊 Salud', color: '#B76E79', bg: 'rgba(183,110,121,0.18)' },
      transporte: { label: '🚗 Transporte', color: '#64748B', bg: 'rgba(100,116,139,0.18)' },
      hogar: { label: '🏠 Hogar', color: '#8C7355', bg: 'rgba(140,115,85,0.18)' },
      negocio: { label: '🏢 Negocio/Sinergia', color: '#DAAF37', bg: 'rgba(218,175,55,0.18)' },
      otros: { label: '📦 Otros', color: '#475569', bg: 'rgba(71,85,105,0.18)' }
    };

    let h = '<div class="hs-card" style="border-top:4px solid #4E8772;">';

    // 1. Header con Navegación de Mes Histórico
    h += '<div class="hs-card-header" style="flex-wrap:wrap;gap:14px;align-items:center;">';
    h += '<div>';
    h += '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">';
    h += '<h2 style="font-size:21px;font-weight:800;letter-spacing:-0.01em;margin:0;">🏠 FINANZAS DEL HOGAR</h2>';
    h += '<span style="background:var(--bg-elevated);color:#4E8772;font-size:11px;font-family:var(--mono);padding:3px 10px;border-radius:12px;font-weight:700;border:1px solid rgba(78,135,114,0.3);">CENTRO DE CONTROL GFB</span>';
    h += '</div>';
    h += '<p style="font-size:12px;color:var(--text-2);margin-top:3px;">Gestión de Ingresos, Gastos, Ahorro Mensual, Deudas y Calendario con notas por día.</p>';
    h += '</div>';

    // Selector de Mes y Acciones Principales
    h += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">';
    h += '<div style="display:flex;align-items:center;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px 6px;">';
    h += '<button class="hs-btn sm" id="fin-prev-month-btn" style="padding:3px 8px;font-size:11px;" title="Mes Anterior">◀</button>';
    h += '<span style="font-size:12.5px;font-weight:700;font-family:var(--mono);display:inline-block;width:170px;min-width:170px;max-width:170px;text-align:center;color:var(--text-1);white-space:nowrap;user-select:none;box-sizing:border-box;">📅 ' + formatMonthName(activeMKey) + '</span>';
    h += '<button class="hs-btn sm" id="fin-next-month-btn" style="padding:3px 8px;font-size:11px;" title="Mes Siguiente">▶</button>';
    h += '</div>';
    h += '<button class="hs-btn sm" id="fin-export-csv-btn" title="Exportar reporte de este mes en Excel">📥 Exportar</button>';
    h += '</div>';
    h += '</div>';

    // 2. 4 KPIs Financieros Fundamentales
    h += '<div class="hs-stats" style="margin-top:16px;">';
    h += '<div class="hs-stat" style="--cat:#4E8772"><div class="hs-stat-h" style="color:#4E8772;">S/. ' + totalIngresos.toFixed(2) + '</div><div class="hs-stat-l">1. Ingresos Totales</div></div>';
    h += '<div class="hs-stat" style="--cat:#B76E79"><div class="hs-stat-h" style="color:#B76E79;">S/. ' + totalGastos.toFixed(2) + '</div><div class="hs-stat-l">2. Gastos Totales (Pend: ' + gastosPendientes.toFixed(0) + ')</div></div>';
    h += '<div class="hs-stat" style="--cat:#DAAF37"><div class="hs-stat-h" style="color:#DAAF37;">S/. ' + totalAhorrado.toFixed(2) + '</div><div class="hs-stat-l">3. Ahorro Total (+S/. ' + ahorroMensualTotal.toFixed(0) + '/mes)</div></div>';
    h += '<div class="hs-stat" style="--cat:' + (totalDeudaSaldo > 0 ? '#C08240' : '#5B7083') + '"><div class="hs-stat-h" style="color:' + (totalDeudaSaldo > 0 ? '#C08240' : '#5B7083') + ';">S/. ' + totalDeudaSaldo.toFixed(2) + '</div><div class="hs-stat-l">4. Saldo Deudas (Cuota: S/. ' + cuotasMesTotal.toFixed(0) + ')</div></div>';
    h += '</div>';

    // Barra de Balance Libre
    h += '<div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">';
    h += '<div style="font-size:12px;color:var(--text-2);">Margen Libre Disponible en el Mes (Ingresos - Gastos - Ahorro - Cuotas):</div>';
    h += '<div style="font-size:14px;font-weight:800;font-family:var(--mono);color:' + (balanceNeto >= 0 ? '#4E8772' : '#B76E79') + ';">S/. ' + balanceNeto.toFixed(2) + ' ' + (balanceNeto >= 0 ? '✓ (Superávit)' : '⚠️ (Déficit)') + '</div>';
    h += '</div>';

    // 3. Sub-pestañas de Navegación (4 Pilares + Calendario)
    h += '<div style="display:flex;gap:6px;border-bottom:1px solid var(--border);margin-top:16px;overflow-x:auto;padding-bottom:2px;">';
    h += '<button class="top-nav-btn' + (fTab === 'ingresos' ? ' active' : '') + '" id="fin-tab-ingresos">🟢 1. Menú de Ingresos (' + ingresosList.length + ')</button>';
    h += '<button class="top-nav-btn' + (fTab === 'gastos' ? ' active' : '') + '" id="fin-tab-gastos">🔴 2. Menú de Gastos (' + gastosList.length + ')</button>';
    h += '<button class="top-nav-btn' + (fTab === 'ahorros' ? ' active' : '') + '" id="fin-tab-ahorros">🎯 3. Ahorro Mensual (' + ahorrosList.length + ')</button>';
    h += '<button class="top-nav-btn' + (fTab === 'deudas' ? ' active' : '') + '" id="fin-tab-deudas">💳 4. Deudas & Obligaciones (' + deudasList.length + ')</button>';
    h += '<button class="top-nav-btn' + (fTab === 'calendario' ? ' active' : '') + '" id="fin-tab-calendario">📅 5. Calendario & Notas por Día</button>';
    h += '</div>';

    // ==============================================================
    // PILAR 1: MENÚ DE INGRESOS
    // ==============================================================
    if (fTab === 'ingresos') {
      h += '<div style="margin-top:16px;">';
      h += '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;">';
      h += '<div>';
      h += '<strong style="font-size:14px;color:var(--text-1);">Registro Detallado de Ingresos de ' + formatMonthName(activeMKey) + '</strong>';
      h += '<div style="font-size:11.5px;color:var(--text-2);">Fuentes de ingresos laborales, profesionales y utilidades de Sinergia Studio</div>';
      h += '</div>';
      h += '<div style="display:flex;gap:6px;">';
      h += '<button class="hs-btn primary sm" id="add-ingreso-btn">➕ + Nuevo Ingreso</button>';
      h += '<button class="hs-btn sm" id="transfer-sinergia-btn">💼 + Ganancia Sinergia</button>';
      h += '</div>';
      h += '</div>';

      h += '<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-elevated);margin-bottom:12px;"><div style="min-width:650px;">';
      h += '<table style="width:100%;border-collapse:collapse;font-size:12px;text-align:left;">';
      h += '<thead style="background:var(--bg-card);border-bottom:2px solid var(--border);font-family:var(--mono);font-size:11px;color:var(--text-2);text-transform:uppercase;"><tr>';
      h += '<th style="padding:10px 12px;">Concepto / Origen</th>';
      h += '<th style="padding:10px 12px;white-space:nowrap;">Responsable</th>';
      h += '<th style="padding:10px 12px;">Frecuencia</th>';
      h += '<th style="padding:10px 12px;">Fecha Estimada</th>';
      h += '<th style="padding:10px 12px;text-align:right;">Monto</th>';
      h += '<th style="padding:10px 12px;text-align:center;">Acciones</th>';
      h += '</tr></thead><tbody>';

      if (!ingresosList.length) {
        h += '<tr><td colspan="6" style="padding:24px;text-align:center;color:var(--text-3);">No hay ingresos registrados en este mes. Haz clic en "+ Nuevo Ingreso" para agregar uno.</td></tr>';
      } else {
        ingresosList.forEach(item => {
          h += '<tr style="border-bottom:1px solid var(--border);">';
          h += '<td style="padding:10px 12px;"><strong style="color:var(--text-1);">' + esc(item.desc) + '</strong>' + (item.notes ? '<div style="font-size:10.5px;color:var(--text-3);">' + esc(item.notes) + '</div>' : '') + '</td>';
          h += '<td style="padding:10px 12px;"><span style="display:inline-flex;align-items:center;gap:5px;white-space:nowrap;background:var(--bg-surface);padding:3px 9px;border-radius:6px;border:1px solid var(--border);font-size:11.5px;font-weight:700;color:var(--text-1);">👤 ' + esc(item.payer || 'Familia') + '</span></td>';
          h += '<td style="padding:10px 12px;font-family:var(--mono);color:var(--text-2);">' + esc(item.freq || 'Mensual') + '</td>';
          h += '<td style="padding:10px 12px;font-family:var(--mono);color:var(--text-3);">' + esc(item.date || '—') + '</td>';
          h += '<td style="padding:10px 12px;text-align:right;font-weight:800;font-family:var(--mono);color:#4E8772;">S/. ' + cleanNum(item.amount, 0).toFixed(2) + '</td>';
          h += '<td style="padding:10px 12px;text-align:center;">';
          h += '<div style="display:flex;justify-content:center;gap:4px;">';
          h += '<button class="edit-ingreso-btn hs-btn sm" data-id="' + item.id + '" style="padding:3px 7px;font-size:10.5px;" title="Editar ingreso">✏️</button>';
          h += '<button class="del-ingreso-btn" data-id="' + item.id + '" style="border:none;background:none;color:#ff6666;cursor:pointer;font-size:12px;padding:0 4px;" title="Eliminar">🗑️</button>';
          h += '</div></td>';
          h += '</tr>';
        });
      }
      h += '</tbody></table></div></div>';
      h += '</div>';
    }

    // ==============================================================
    // PILAR 2: MENÚ DE GASTOS
    // ==============================================================
    else if (fTab === 'gastos') {
      h += '<div style="margin-top:16px;">';
      h += '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;">';
      h += '<div>';
      h += '<strong style="font-size:14px;color:var(--text-1);">Control de Gastos Fijos y Cotidianos de ' + formatMonthName(activeMKey) + '</strong>';
      h += '<div style="font-size:11.5px;color:var(--text-2);">Pagos de servicios, despensa, transporte y compromisos del hogar</div>';
      h += '</div>';
      h += '<div style="display:flex;gap:6px;">';
      h += '<button class="hs-btn primary sm" id="add-gasto-btn">➕ + Nuevo Gasto</button>';
      h += '</div>';
      h += '</div>';

      // Tabla de Gastos
      h += '<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-elevated);margin-bottom:12px;"><div style="min-width:650px;">';
      h += '<table style="width:100%;border-collapse:collapse;font-size:12px;text-align:left;">';
      h += '<thead style="background:var(--bg-card);border-bottom:2px solid var(--border);font-family:var(--mono);font-size:11px;color:var(--text-2);text-transform:uppercase;"><tr>';
      h += '<th style="padding:10px 12px;">Estado</th>';
      h += '<th style="padding:10px 12px;">Concepto</th>';
      h += '<th style="padding:10px 12px;">Categoría</th>';
      h += '<th style="padding:10px 12px;white-space:nowrap;">Responsable</th>';

  /* ================================================================
     RENDER: STATS & EDITOR
     ================================================================ */
    function renderStats(mem) {
    if (!mem) return '';
    const totals = computeStats() || {};
    const ws = getWeekState() || { done: {} };
    const sch = getSchedule(mem.currentWeekStart);
    const cats = getMemberCategories();
    const groups = mem.activityGroups || getDefaultMemberActivityGroups(mem.id);

    let totalPlannedMins = 0, totalDoneMins = 0;
    Object.keys(totals).forEach(k => { totalPlannedMins += (totals[k] || 0); });

    const dayMetrics = {};
    let bestDay = null, maxDayDone = -1;

    ORDER.forEach(d => {
      let dPlanned = 0, dDone = 0;
      const blocks = (sch && sch.days && sch.days[d]) ? sch.days[d] : [];
      blocks.forEach((b, i) => {
        const dur = (toMin(b[1]) - toMin(b[0]));
        dPlanned += dur;
        if (ws.done[d + '-' + i]) {
          dDone += dur;
          totalDoneMins += dur;
        }
      });
      const dPct = dPlanned ? Math.min(100, Math.round(100 * dDone / dPlanned)) : 0;
      dayMetrics[d] = { planned: dPlanned, done: dDone, pct: dPct, blocksCount: blocks.length };
      if (dDone > maxDayDone && dDone > 0) {
        maxDayDone = dDone;
        bestDay = d;
      }
    });

    const overallPct = totalPlannedMins ? Math.min(100, Math.round(100 * totalDoneMins / totalPlannedMins)) : 0;
    
    // Performance Level
    let levelBadge = '🚀 En Progreso', levelColor = '#f59e0b', levelBg = 'rgba(245,158,11,0.15)';
    if (overallPct >= 90) {
      levelBadge = '🏆 Nivel Élite (Excelente)'; levelColor = '#10b981'; levelBg = 'rgba(16,185,129,0.18)';
    } else if (overallPct >= 75) {
      levelBadge = '⚡ Nivel Óptimo'; levelColor = '#3b82f6'; levelBg = 'rgba(59,130,246,0.18)';
    } else if (overallPct >= 50) {
      levelBadge = '📈 Buen Ritmo'; levelColor = '#8b5cf6'; levelBg = 'rgba(139,92,246,0.18)';
    }

    // Pomodoro metrics
    const pomoCount = mem.pomoCount || 0;
    const pomoHours = ((pomoCount * 25) / 60).toFixed(1);

    // Exams metrics
    const exams = mem.exams || [];
    const examsDone = exams.filter(x => x.done).length;
    const examsTotal = exams.length;

    // Group Time Distribution
    const groupTimeStats = [];
    const assignedCats = new Set();

    groups.forEach(grp => {
      let grpMins = 0;
      grp.catKeys.forEach(ck => {
        assignedCats.add(ck);
        grpMins += (totals[ck] || 0);
      });
      const grpPct = totalPlannedMins ? Math.min(100, Math.round(100 * grpMins / totalPlannedMins)) : 0;
      groupTimeStats.push({
        name: grp.name,
        color: grp.color || '#3b82f6',
        mins: grpMins,
        hours: (grpMins / 60).toFixed(1),
        pct: grpPct
      });
    });

    // Any other category not in groups
    let otherMins = 0;
    Object.keys(totals).forEach(ck => {
      if (!assignedCats.has(ck)) otherMins += (totals[ck] || 0);
    });
    if (otherMins > 0) {
      const otherPct = totalPlannedMins ? Math.min(100, Math.round(100 * otherMins / totalPlannedMins)) : 0;
      groupTimeStats.push({
        name: '📌 Otras Actividades',
        color: '#64748b',
        mins: otherMins,
        hours: (otherMins / 60).toFixed(1),
        pct: otherPct
      });
    }

    let h = '<div style="display:flex;flex-direction:column;gap:16px;">';

    // ==============================================================
    // 1. CABECERA & 4 TARJETAS KPI DE ALTO IMPACTO
    // ==============================================================
    h += '<div class="hs-card" style="border-top:4px solid ' + (mem.color || 'var(--accent)') + ';padding:16px;">';
    
    h += '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;">';
    h += '<div>';
    h += '<div style="display:flex;align-items:center;gap:8px;">';
    h += '<span style="font-size:22px;">📊</span>';

  function render() {
    try {
      const pageY = window.scrollY;
      const mem = getActiveMember();
      const current = findCurrentBlock();

      if (mem) root.style.setProperty('--user-color', mem.color || '#7c6cff');

      let html = '';

      // 1. PANTALLA INICIAL DE BIENVENIDA ("Familia GFB" -> "Iniciar")
      if (state.appFlow === 'splash') {
        html = renderSplashScreen();
      }
      // 2. MENÚ PRINCIPAL DE 3 OPCIONES (Hub GFB)
      else if (state.appFlow === 'hub') {
        html = renderHubScreen();
      }
      // 3. WORKSPACE DEL MÓDULO SELECCIONADO (Horarios, Sinergia o Finanzas)
      else {
        html += renderGlobalHeader();
        html += '<main class="hs-panel">';
        if (state.activeGlobalTab === 'sinergia') {
          html += renderSinergia();
        } else if (state.activeGlobalTab === 'finanzas') {
          html += renderFinanzas();
        } else {
          // Portal / Horarios tab
          if (!mem) {
            html += renderPortalSelection();
          } else {
            if (state.memberSubTab === 'horario') html += renderHorario(mem, current);
            else if (state.memberSubTab === 'calendario') html += renderMemberCalendar(mem);
            else if (state.memberSubTab === 'examenes') html += renderMemberExams(mem);
            else if (state.memberSubTab === 'boveda' || state.memberSubTab === 'academico') html += renderMemberDriveVault(mem);
            else if (state.memberSubTab === 'stats') html += renderStats(mem);
            else if (state.memberSubTab === 'editor') html += renderEditor(mem);
          }
        }
        html += '</main>';
      }

      root.innerHTML = html;
      window.scrollTo(0, pageY);
      updatePomoUI();
      if (view.activeTab === 'sinergia' && state.sinergiaView === 'cotizador') {
        recalcQuote();
      }
    } catch(err) {
      console.error('Render error:', err);
    }
  }

  /* ================================================================
     POMODORO TIMER LOGIC
     ================================================================ */
  function pomoTick() {
    pomo.remaining--;
    const mem = getActiveMember();
    const cfg = state.pomoConfig || { focusMins: 25, breakMins: 5 };

    if (pomo.remaining <= 0) {
      if (pomo.mode === 'Enfoque') {
        if (mem) { mem.pomoCount = (mem.pomoCount||0) + 1; }
        pomo.mode = 'Descanso';
        pomo.remaining = cfg.breakMins * 60;
        pomo.total = cfg.breakMins * 60;
        state.pomoMode = 'Descanso';
        state.pomoEndTime = Date.now() + (pomo.remaining * 1000);
        saveState();
        playBeep();
        showToast('🍅 ¡Enfoque completado! Tómate un merecido descanso.');
        if ('Notification' in window && Notification.permission === 'granted') {
          new Notification('🍅 ¡Pomodoro Completado! — Familia GFB', {
            body: 'Has cumplido tu bloque de enfoque. Tómate un descanso de ' + cfg.breakMins + ' minutos.',
            icon: 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'
          });
        }
      } else {
        pomo.mode = 'Enfoque';
        pomo.remaining = cfg.focusMins * 60;
        pomo.total = cfg.focusMins * 60;
        state.pomoMode = 'Enfoque';
        state.pomoEndTime = Date.now() + (pomo.remaining * 1000);
        saveState();
        playBeep();
        showToast('🎯 ¡Descanso finalizado! Hora de enfocarse.', 'info');
        if ('Notification' in window && Notification.permission === 'granted') {
          new Notification('🎯 ¡A enfocarse! — Familia GFB', {
            body: 'Inicia tu nuevo ciclo de productividad de ' + cfg.focusMins + ' minutos.',
            icon: 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'
          });
        }
      }
    }
    updatePomoUI();
  }

  function pomoToggle() {
    if (pomo.running) {
      clearInterval(pomo.interval);
      pomo.running = false;
      state.pomoRunning = false;
      state.pomoRemainingSecs = pomo.remaining;
      saveState();
    } else {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
      pomo.running = true;
      state.pomoRunning = true;
      state.pomoEndTime = Date.now() + (pomo.remaining * 1000);
      state.pomoMode = pomo.mode;
      delete state.pomoRemainingSecs;
      saveState();
      pomo.interval = setInterval(pomoTick, 1000);
    }
    const btn = document.getElementById('pomo-start');
    if (btn) {
      btn.textContent = pomo.running ? 'Pausar' : 'Iniciar';
      btn.className = 'hs-btn ' + (pomo.running ? 'danger' : 'primary');
    }
    updatePomoUI();
  }

  function pomoReset() {
    clearInterval(pomo.interval);
    pomo.running = false;
    state.pomoRunning = false;
    delete state.pomoEndTime;
    delete state.pomoRemainingSecs;
    pomo.mode = 'Enfoque';
    state.pomoMode = 'Enfoque';
    const cfg = state.pomoConfig || { focusMins: 25, breakMins: 5 };
    pomo.remaining = cfg.focusMins * 60;
    pomo.total = cfg.focusMins * 60;
    saveState();
    const btn = document.getElementById('pomo-start');
    if (btn) {
      btn.textContent = 'Iniciar';
      btn.className = 'hs-btn primary';
    }
    updatePomoUI();
  }

  function updatePomoUI() {
    const t = document.getElementById('pomo-time'), m = document.getElementById('pomo-mode'), r = document.getElementById('pomo-ring'), c = document.getElementById('pomo-count');
    const mem = getActiveMember();
    if (!t) return;
    const mm = Math.floor(pomo.remaining/60), ss = pomo.remaining%60;
    t.textContent = (mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;
    if (m) m.textContent = pomo.mode;
    if (r) {
      r.style.strokeDashoffset = POMO_CIRC * (1 - pomo.remaining/pomo.total);
      r.classList.toggle('on-break', pomo.mode==='Descanso');
    }
    if (m) m.classList.toggle('break-mode', pomo.mode==='Descanso');
    if (c && mem) c.textContent = '🍅 Pomodoros completados hoy: ' + (mem.pomoCount||0);
  }

  /* ================================================================
     PRINT / PDF HORARIO SEMANAL A4
     ================================================================ */
  function printMemberSchedulePDF(mem) {
    const sch = getSchedule();
    if (!sch) return;
    const dates = getWeekDates(mem.currentWeekStart);
    const cats = getMemberCategories();

    const printWin = window.open('', '_blank', 'width=1000,height=900');
    if (!printWin) {
      showToast('Permite ventanas emergentes para abrir el horario imprimible', 'warn');
      return;
    }

    let rowsHtml = '';
    for (let s = 0; s < N_SLOTS; s++) {
      const mins = GRID_START + s * SLOT;
      const timeLbl = mins % 60 === 0 ? labelHM(mins) : '';
      let rowCells = '';
      ORDER.forEach((d) => {
        const blocks = schDays[d] || [];
        const match = blocks.find(b => {
          const m0 = toMin(b[0]), m1 = toMin(b[1]);
          return mins >= m0 && mins < m1;
        });
        if (match) {
          const isStart = mins === toMin(match[0]);
          if (isStart) {
            const span = Math.max(1, Math.round((toMin(match[1]) - toMin(match[0])) / SLOT));
            const cat = cats[match[3]] || { c: '#7c6cff', n: match[3] };
            rowCells += `<td rowspan="${span}" style="background:#f8fafc;border:1px solid #cbd5e1;border-left:4px solid ${cat.c};padding:4px 6px;font-size:11px;vertical-align:top;">
              <div style="font-size:9.5px;color:#64748b;font-weight:700;">${match[0]}–${match[1]}</div>
              <div style="font-weight:700;color:#0f172a;margin-top:2px;">${esc(match[2])}</div>
            </td>`;
          }
        } else {
          const isCovered = blocks.some(b => {
            const m0 = toMin(b[0]), m1 = toMin(b[1]);
            return mins > m0 && mins < m1;
          });
          if (!isCovered) {
            rowCells += `<td style="border:1px solid #e2e8f0;height:14px;"></td>`;
          }
        }
      });
      rowsHtml += `<tr><td style="font-family:monospace;font-size:10px;color:#64748b;text-align:right;padding:2px 4px;border:1px solid #e2e8f0;">${timeLbl}</td>${rowCells}</tr>`;
    }

    const html = `<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Horario Semanal — ${esc(mem.name)}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; padding: 20px; color: #0f172a; background: #fff; }
    .hdr { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid ${mem.color||'#3b82f6'}; padding-bottom: 10px; margin-bottom: 12px; }
    .tbl { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .tbl th { background: #f1f5f9; color: #1e293b; padding: 6px 4px; font-size: 11px; text-align: center; border: 1px solid #cbd5e1; font-family: monospace; }
    @media print {
      body { padding: 6px; }
      @page { size: landscape; margin: 6mm; }
    }
  </style>
</head>
<body>
  <div class="hdr">
    <div>
      <h1 style="font-size:18px;font-weight:800;color:#0f172a;">👨‍👩‍👧‍👦 HORARIO SEMANAL — ${esc(mem.name).toUpperCase()} (${esc(mem.role).toUpperCase()})</h1>
      <p style="font-size:11px;color:#64748b;">Enfoque: ${esc(mem.focusGoal || mem.defaultFocus)} · Semana: ${fmtShort(dates[0])} al ${fmtFull(dates[6])}</p>
    </div>
    <div style="text-align:right;font-size:10.5px;color:#64748b;font-family:monospace;">FAMILIA GFB WORKSPACE</div>
  </div>
  <table class="tbl">
    <thead>
      <tr>
        <th style="width:48px;">Hora</th>
        ${ORDER.map((d, i) => `<th>${LABELS[d]} ${dates[i].getDate()}</th>`).join('')}
      </tr>
    </thead>
    <tbody>
      ${rowsHtml}
    </tbody>
  </table>
</body>
</html>`;

    printWin.document.open();
    printWin.document.write(html);
    printWin.document.close();
    setTimeout(() => { try { printWin.print(); } catch(e) {} }, 450);
  }

  /* ================================================================

  function exportBackupJSON() {
